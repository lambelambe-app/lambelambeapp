<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vaaamos! | Eventos Ao Vivo + Canais Fixos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
        body { background: #0a0f1e; padding: 1rem; color: #eee; }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Cabeçalho com efeito neon */
        .geo-header {
            background: linear-gradient(135deg, #0f2027, #203a43);
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        .geo-header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; }
        .location-box { background: rgba(255,255,255,0.15); padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.85rem; backdrop-filter: blur(5px); }

        /* Seções com efeito phaser (bordas neon) */
        .section-title {
            font-size: 1.3rem;
            margin: 1.5rem 0 1rem;
            border-left: 4px solid #00ffff;
            padding-left: 0.8rem;
            font-weight: bold;
            text-shadow: 0 0 3px cyan;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        /* Card estilo phaser/arcade */
        .event-card, .fixed-card {
            background: rgba(20, 30, 45, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            transition: 0.2s;
        }
        .event-card:hover, .fixed-card:hover {
            transform: translateY(-5px);
            border-color: cyan;
            box-shadow: 0 0 20px cyan;
        }
        .card-banner {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #1e2a3a;
        }
        .card-content { padding: 0.8rem; }
        .card-title { font-weight: bold; display: flex; justify-content: space-between; }
        .datetime-highlight { background: #0f1a24; padding: 0.3rem; border-radius: 0.5rem; font-size: 0.7rem; margin: 0.5rem 0; }
        .local-badge { background: #2c7da0; display: inline-block; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.7rem; cursor: pointer; margin: 0.2rem 0; }
        .event-link { display: inline-block; background: #e63946; color: white; text-decoration: none; padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 0.7rem; margin-top: 0.5rem; }
        .admin-buttons { display: flex; gap: 0.5rem; }
        .btn-icon { background: none; border: none; cursor: pointer; color: #ccc; font-size: 1rem; }
        .btn-delete { color: #e63946; }
        .btn-pin { color: #f4a261; }
        .btn-pin.active { color: #27ae60; }
        .badge-fixed { background: #27ae60; padding: 0.1rem 0.4rem; border-radius: 1rem; font-size: 0.6rem; }
        .empty-state { text-align: center; padding: 2rem; background: rgba(0,0,0,0.5); border-radius: 1rem; color: #aaa; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e2f3e;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 1000;
            animation: fadeOut 3s;
        }
        @keyframes fadeOut {
            0% { opacity: 0; transform: translateX(100%); }
            15% { opacity: 1; transform: translateX(0); }
            85% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100%); }
        }
        .form-card {
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 1.2rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            border: 1px solid cyan;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.8rem; }
        input, textarea { width: 100%; padding: 0.6rem; background: #1e2a36; border: 1px solid #2c7da0; color: white; border-radius: 0.8rem; }
        .btn-primary { background: #e63946; width: 100%; padding: 0.7rem; border: none; border-radius: 2rem; font-weight: bold; cursor: pointer; color: white; }
        footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #6c8aa0; }
        @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="geo-header">
        <h1><i class="fas fa-map-marker-alt"></i> Vaaamos! Lambe Lambe</h1>
        <div class="location-box"><i class="fas fa-globe"></i> <span id="locationText">Detectando...</span></div>
    </div>

    <!-- Seção: Canais Fixos (estilo Phaser) -->
    <div class="section-title">
        <span>🎮 CANAIS FIXOS • AO VIVO AGORA</span>
    </div>
    <div id="fixedChannelsContainer" class="cards-grid">
        <div class="empty-state">Verificando canais...</div>
    </div>

    <!-- Seção: Eventos cadastrados manualmente -->
    <div class="section-title">
        <span>📅 EVENTOS CADASTRADOS</span>
        <span id="eventCountBadge" style="background:#0a1a2a; padding:0.1rem 0.6rem; border-radius:1rem;">0</span>
    </div>
    <div id="manualEventsContainer" class="cards-grid"></div>

    <!-- Seção: YouTube geral (busca híbrida) -->
    <div class="section-title">
        <span>🎬 AO VIVO NO YOUTUBE (GERAL)</span>
    </div>
    <div id="youtubeContainer" class="cards-grid">
        <div class="empty-state">Carregando lives...</div>
    </div>

    <!-- Formulário de cadastro de evento -->
    <div class="form-card">
        <h3>➕ CADASTRAR EVENTO</h3>
        <form id="eventForm">
            <div class="form-row">
                <div class="form-group"><label>Título *</label><input type="text" id="eventTitle" required></div>
                <div class="form-group"><label>Banner (URL)</label><input type="url" id="eventBanner" placeholder="opcional"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Data/Hora *</label><input type="datetime-local" id="eventDatetime" required></div>
                <div class="form-group"><label>Cidade *</label><input type="text" id="eventCity" required></div>
            </div>
            <div class="form-group"><label>Endereço</label><input type="text" id="eventAddress" placeholder="Rua, número"></div>
            <div class="form-group"><label>Descrição *</label><textarea rows="2" id="eventDesc" required></textarea></div>
            <div class="form-group"><label>Link da Live *</label><input type="url" id="eventLink" required></div>
            <button type="submit" class="btn-primary">PUBLICAR EVENTO</button>
        </form>
    </div>
    <footer>Limite de 5 eventos · Exclusão 1h após início · Canais fixos atualizam a cada 2 min</footer>
</div>

<script>
    // ==================== CONFIGURAÇÕES ====================
    const YOUTUBE_API_KEY = "AIzaSyCrIJtzHeEeAPGxHI2ZNQlHdNyBd4mkmGQ";
    // Lista de IDs de canais fixos (ex: canais de música, eventos)
    const CANAIS_FIXOS = [
        { id: "UCXuqSBlHAE6Xw-yeJA4TpLg", nome: "Música Ao Vivo" },  // Exemplo (substitua por canais reais)
        { id: "UC0GXkZBL1kIqW-Pe1J1m0rQ", nome: "Show Session" },   // Outro exemplo
        { id: "UChVUSXFzVgkQ2yR0YzHwV7g", nome: "Live Cultural" }    // Mais um
    ];
    const IMAGENS_FIXAS = ["img1.png", "img2.png", "img3.png"]; // imagens na pasta local

    const LIMITE_EVENTOS = 5;
    const ALERTA_EMAIL = "lambelambeapp@gmail.com";

    // Filtro de palavras impróprias
    const BLOQUEADAS = ["sexo","porn","nudez","violência","droga","tráfico","arma","facção","ódio","racismo","homofobia","nazi","pedofilia","suicídio","morte","sangue","sequestro","assalto","estupro","incesto","bomba","terrorismo","cocaína","maconha","crack","heroína","prostituição"];

    function hasBadWords(text) {
        if (!text) return false;
        const lower = text.toLowerCase();
        return BLOQUEADAS.some(pal => lower.includes(pal));
    }

    function isValidYoutubeUrl(url) {
        return /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\//.test(url);
    }

    let userCity = null;
    let manualEvents = [];

    // ==================== GEOLOCALIZAÇÃO ====================
    async function getLocation() {
        if (!navigator.geolocation) return;
        try {
            const pos = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res,rej));
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=pt-BR`);
            const data = await resp.json();
            userCity = data.address?.city || data.address?.town || data.address?.municipality;
            document.getElementById("locationText").innerHTML = userCity ? `📍 ${userCity}` : "📍 Local aprox.";
            renderManualEvents();
        } catch(e) { document.getElementById("locationText").innerHTML = "📍 Não disponível"; }
    }
    getLocation();
    setInterval(getLocation, 30000);

    // ==================== CRUD EVENTOS MANUAIS ====================
    function loadEvents() {
        const stored = localStorage.getItem("vaaamos_events");
        manualEvents = stored ? JSON.parse(stored) : [];
        manualEvents.forEach(ev => { if (ev.keepByAdmin === undefined) ev.keepByAdmin = false; });
        renderManualEvents();
    }

    function saveEvents() {
        localStorage.setItem("vaaamos_events", JSON.stringify(manualEvents));
        renderManualEvents();
        document.getElementById("eventCountBadge").innerText = manualEvents.length;
    }

    function getDeviceId() {
        let id = localStorage.getItem("deviceId");
        if (!id) {
            id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem("deviceId", id);
        }
        return id;
    }

    function countUserEvents() {
        const deviceId = getDeviceId();
        return manualEvents.filter(ev => ev.createdBy === deviceId).length;
    }

    function addEvent(eventData) {
        if (hasBadWords(eventData.title) || hasBadWords(eventData.description) || hasBadWords(eventData.city) || hasBadWords(eventData.address)) {
            showToast("❌ Conteúdo impróprio! Evento bloqueado.", "red");
            return false;
        }
        if (!isValidYoutubeUrl(eventData.link)) {
            showToast("❌ Link inválido. Use link do YouTube.", "red");
            return false;
        }
        if (new Date(eventData.datetime) <= new Date()) {
            showToast("❌ Data/hora futura obrigatória.", "red");
            return false;
        }
        let userCount = countUserEvents();
        if (userCount >= LIMITE_EVENTOS) {
            showToast(`❌ Limite de ${LIMITE_EVENTOS} eventos. Contato: ${ALERTA_EMAIL}`, "orange");
            return false;
        }
        if (userCount >= 3) {
            showToast(`⚠️ Você já tem ${userCount} eventos. Para mais, contate: ${ALERTA_EMAIL}`, "#f4a261");
        }
        let banner = eventData.bannerUrl && eventData.bannerUrl.trim() !== "" ? eventData.bannerUrl : "subvam.png";
        manualEvents.push({
            id: Date.now(),
            title: eventData.title,
            bannerUrl: banner,
            datetime: eventData.datetime,
            city: eventData.city,
            address: eventData.address || "",
            description: eventData.description,
            link: eventData.link,
            createdBy: getDeviceId(),
            keepByAdmin: false
        });
        manualEvents.sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));
        saveEvents();
        showToast("✅ Evento adicionado!", "green");
        return true;
    }

    function deleteEvent(id) {
        manualEvents = manualEvents.filter(ev => ev.id !== id);
        saveEvents();
        showToast("🗑️ Removido", "red");
    }

    function togglePin(id) {
        let ev = manualEvents.find(ev => ev.id === id);
        if (ev) {
            ev.keepByAdmin = !ev.keepByAdmin;
            saveEvents();
            showToast(ev.keepByAdmin ? "📌 Fixado" : "🔓 Remoção liberada", "#f4a261");
        }
    }

    function cleanExpired() {
        const now = new Date();
        let removed = 0;
        const filtered = manualEvents.filter(ev => {
            const diff = (now - new Date(ev.datetime)) / (1000*3600);
            if (diff >= 1 && !ev.keepByAdmin) {
                removed++;
                return false;
            }
            return true;
        });
        if (removed) {
            manualEvents = filtered;
            saveEvents();
            showToast(`⏰ ${removed} evento(s) expirado(s) removido(s)`, "#2c3e50");
        }
    }
    setInterval(cleanExpired, 60000);
    cleanExpired();

    function showToast(msg, color="#2c3e50") {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = color;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatDate(iso) {
        try { return new Date(iso).toLocaleString('pt-BR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}); }
        catch(e) { return iso; }
    }

    function openMap(endereco, cidade) {
        let q = endereco || cidade;
        if (q) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank');
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) || ''; }

    function renderManualEvents() {
        const container = document.getElementById("manualEventsContainer");
        if (!manualEvents.length) {
            container.innerHTML = `<div class="empty-state">Nenhum evento cadastrado.</div>`;
            document.getElementById("eventCountBadge").innerText = "0";
            return;
        }
        const deviceId = getDeviceId();
        container.innerHTML = manualEvents.map(ev => {
            const isLocal = userCity && ev.city && ev.city.toLowerCase().includes(userCity.toLowerCase());
            const isOwner = ev.createdBy === deviceId;
            return `
                <div class="event-card">
                    <img class="card-banner" src="${ev.bannerUrl}" onerror="this.onerror=null; this.src='https://placehold.co/600x400/667eea/white?text=Vaaamos'">
                    <div class="card-content">
                        <div class="card-title">
                            <span>${escapeHtml(ev.title)}</span>
                            <div class="admin-buttons">
                                ${ev.keepByAdmin ? '<span class="badge-fixed"><i class="fas fa-thumbtack"></i></span>' : ''}
                                ${isOwner ? `
                                    <button class="btn-icon btn-delete" onclick="deleteEvent(${ev.id})"><i class="fas fa-trash-alt"></i></button>
                                    <button class="btn-icon btn-pin ${ev.keepByAdmin ? 'active' : ''}" onclick="togglePin(${ev.id})"><i class="fas fa-thumbtack"></i></button>
                                ` : ''}
                            </div>
                        </div>
                        <div class="local-badge" onclick="openMap('${escapeHtml(ev.address)}','${escapeHtml(ev.city)}')"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(ev.city)}</div>
                        <div class="datetime-highlight">⏰ ${formatDate(ev.datetime)} ${isLocal ? '📍 Perto' : ''}</div>
                        <div class="desc">${escapeHtml(ev.description)}</div>
                        <a href="${ev.link}" target="_blank" class="event-link">Assistir</a>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById("eventCountBadge").innerText = manualEvents.length;
    }

    // ==================== CANAIS FIXOS (ESTILO PHASER) ====================
    async function fetchFixedChannels() {
        const container = document.getElementById("fixedChannelsContainer");
        container.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Verificando canais...</div>`;
        let aoVivo = [];

        for (let canal of CANAIS_FIXOS) {
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${canal.id}&eventType=live&type=video&maxResults=1&key=${YOUTUBE_API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.items && data.items.length > 0) {
                    const video = data.items[0];
                    aoVivo.push({
                        canalNome: canal.nome,
                        videoId: video.id.videoId,
                        titulo: video.snippet.title,
                        thumbnail: video.snippet.thumbnails.high?.url || video.snippet.thumbnails.default?.url,
                        channelTitle: video.snippet.channelTitle
                    });
                }
                await new Promise(r => setTimeout(r, 150));
            } catch(e) { console.warn(`Erro no canal ${canal.id}`, e); }
        }

        if (aoVivo.length === 0) {
            // Exibir imagens fixas locais
            let imagensHtml = IMAGENS_FIXAS.map(img => `
                <div class="fixed-card">
                    <img class="card-banner" src="${img}" onerror="this.src='https://placehold.co/600x400/2c3e50/white?text=Indisponivel'">
                    <div class="card-content">
                        <div class="card-title">Evento em breve</div>
                        <div class="datetime-highlight">📅 Confira nossa programação</div>
                    </div>
                </div>
            `).join('');
            container.innerHTML = imagensHtml;
            return;
        }

        container.innerHTML = aoVivo.map(live => `
            <div class="fixed-card">
                <img class="card-banner" src="${live.thumbnail}" onerror="this.src='https://placehold.co/600x400/e63946/white?text=Live'">
                <div class="card-content">
                    <div class="card-title">${escapeHtml(live.titulo)}</div>
                    <div style="font-size:0.7rem; color:#2c7da0;">${escapeHtml(live.channelTitle)}</div>
                    <div class="datetime-highlight">🔴 AO VIVO AGORA</div>
                    <a href="https://www.youtube.com/watch?v=${live.videoId}" target="_blank" class="event-link">Assistir</a>
                </div>
            </div>
        `).join('');
    }

    // ==================== YOUTUBE GERAL (BUSCA HÍBRIDA) ====================
    async function fetchGeneralYouTube() {
        const container = document.getElementById("youtubeContainer");
        if (!YOUTUBE_API_KEY) {
            container.innerHTML = `<div class="empty-state">🔑 API key não configurada.</div>`;
            return;
        }
        container.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Buscando lives...</div>`;
        let videosMap = new Map();

        const keywords = ["música ao vivo", "show ao vivo", "live music", "live session"];
        for (const kw of keywords) {
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&eventType=live&type=video&maxResults=5&q=${encodeURIComponent(kw)}&key=${YOUTUBE_API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.items) data.items.forEach(item => { if (!videosMap.has(item.id.videoId)) videosMap.set(item.id.videoId, item); });
                await new Promise(r => setTimeout(r, 100));
            } catch(e) {}
        }
        try {
            const urlCat = `https://www.googleapis.com/youtube/v3/search?part=snippet&eventType=live&type=video&maxResults=8&videoCategoryId=10&key=${YOUTUBE_API_KEY}`;
            const res = await fetch(urlCat);
            const data = await res.json();
            if (data.items) data.items.forEach(item => { if (!videosMap.has(item.id.videoId)) videosMap.set(item.id.videoId, item); });
        } catch(e) {}

        if (videosMap.size === 0) {
            container.innerHTML = `<div class="empty-state">🎵 Nenhuma live de música no momento.</div>`;
            return;
        }
        const videoIds = Array.from(videosMap.keys()).join(',');
        try {
            const detUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`;
            const detRes = await fetch(detUrl);
            const detData = await detRes.json();
            if (detData.error) throw new Error(detData.error.message);
            container.innerHTML = detData.items.map(video => {
                const thumb = video.snippet.thumbnails?.high?.url || video.snippet.thumbnails?.medium?.url;
                const time = video.liveStreamingDetails?.scheduledStartTime ? `📅 ${new Date(video.liveStreamingDetails.scheduledStartTime).toLocaleString('pt-BR')}` : "🔴 AO VIVO";
                return `
                    <div class="event-card">
                        <img class="card-banner" src="${thumb}" onerror="this.src='https://placehold.co/600x400/e63946/white?text=Vaaamos'">
                        <div class="card-content">
                            <div class="card-title">${escapeHtml(video.snippet.title)}</div>
                            <div style="font-size:0.7rem;">${escapeHtml(video.snippet.channelTitle)}</div>
                            <div class="datetime-highlight">${time}</div>
                            <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="event-link">Assistir</a>
                        </div>
                    </div>
                `;
            }).join('');
        } catch(err) {
            container.innerHTML = `<div class="empty-state">Erro ao carregar detalhes</div>`;
        }
    }

    // ==================== EVENTOS DE FORMULÁRIO ====================
    document.getElementById("eventForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("eventTitle").value.trim();
        let bannerUrl = document.getElementById("eventBanner").value.trim();
        const datetime = document.getElementById("eventDatetime").value;
        const city = document.getElementById("eventCity").value.trim();
        const address = document.getElementById("eventAddress").value.trim();
        const description = document.getElementById("eventDesc").value.trim();
        const link = document.getElementById("eventLink").value.trim();
        if (!title || !datetime || !city || !description || !link) {
            showToast("Preencha todos os obrigatórios!", "orange");
            return;
        }
        addEvent({ title, bannerUrl, datetime, city, address, description, link });
        e.target.reset();
    });

    window.deleteEvent = deleteEvent;
    window.togglePin = togglePin;
    window.openMap = openMap;

    // Inicializar
    loadEvents();
    fetchFixedChannels();
    fetchGeneralYouTube();
    setInterval(fetchFixedChannels, 120000);  // a cada 2 minutos
    setInterval(fetchGeneralYouTube, 120000);
</script>
</body>
</html>
