<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vaaamos! | Eventos Ao Vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
        body { background: #f5f7fa; padding: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .geo-header {
            background: linear-gradient(135deg, #0f2027, #203a43);
            color: white;
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .geo-header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; }
        .location-box { background: rgba(255,255,255,0.2); padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.85rem; }
        .section-title {
            font-size: 1.3rem;
            margin: 1.5rem 0 1rem;
            border-left: 5px solid #e63946;
            padding-left: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
        .event-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .event-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .card-banner { width: 100%; height: 140px; object-fit: cover; background: #667eea; }
        .card-content { padding: 0.8rem; }
        .card-title { font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 0.3rem; }
        .datetime-highlight {
            background: #fff5e6;
            border-left: 3px solid #f97316;
            padding: 0.3rem;
            font-size: 0.7rem;
            margin: 0.5rem 0;
            border-radius: 0.4rem;
        }
        .local-badge {
            background: #2c7da0;
            color: white;
            font-size: 0.7rem;
            border-radius: 1rem;
            padding: 0.1rem 0.5rem;
            display: inline-block;
            margin: 0.2rem 0;
            cursor: pointer;
        }
        .event-link {
            display: inline-block;
            background: #e63946;
            color: white;
            text-decoration: none;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }
        .admin-buttons { display: flex; gap: 6px; }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 4px; }
        .btn-delete { color: #e63946; }
        .btn-pin { color: #f4a261; }
        .btn-pin.active { color: #27ae60; }
        .badge-fixed { background: #27ae60; color: white; padding: 2px 6px; border-radius: 12px; font-size: 0.65rem; }
        .empty-state { text-align: center; padding: 2rem; background: white; border-radius: 1rem; color: #666; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 1000;
            animation: fadeInOut 3s;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(100%); }
            15% { opacity: 1; transform: translateX(0); }
            85% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100%); }
        }
        .form-card {
            background: white;
            border-radius: 1.2rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.8rem; }
        input, textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 0.8rem; }
        .btn-primary {
            background: #1e2f3e;
            color: white;
            width: 100%;
            padding: 0.7rem;
            border-radius: 2rem;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #777; }
        @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="geo-header">
        <h1><i class="fas fa-map-marker-alt"></i> Vaaamos! Lambe Lambe</h1>
        <div class="location-box"><i class="fas fa-globe"></i> <span id="locationText">Detectando...</span></div>
    </div>

    <!-- Eventos cadastrados -->
    <div class="section-title">
        <span>📅 Eventos Cadastrados</span>
        <span id="eventCountBadge" style="background:#e9ecef; padding:0.1rem 0.6rem; border-radius:1rem;">0</span>
    </div>
    <div id="manualEventsContainer" class="cards-grid"></div>

    <!-- YouTube ao vivo -->
    <div class="section-title">
        <span>🎬 Ao Vivo no YouTube</span>
    </div>
    <div id="youtubeContainer" class="cards-grid">
        <div class="empty-state">Carregando lives...</div>
    </div>

    <!-- Formulário -->
    <div class="form-card">
        <h3>➕ Cadastrar Evento</h3>
        <form id="eventForm">
            <div class="form-row">
                <div class="form-group"><label>Título *</label><input type="text" id="eventTitle" required></div>
                <div class="form-group"><label>Banner (URL)</label><input type="url" id="eventBanner" placeholder="opcional"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Data/Hora *</label><input type="datetime-local" id="eventDatetime" required></div>
                <div class="form-group"><label>Cidade *</label><input type="text" id="eventCity" required></div>
            </div>
            <div class="form-group"><label>Endereço (opcional)</label><input type="text" id="eventAddress" placeholder="Rua, número"></div>
            <div class="form-group"><label>Descrição *</label><textarea rows="2" id="eventDesc" required></textarea></div>
            <div class="form-group"><label>Link da Live *</label><input type="url" id="eventLink" required></div>
            <button type="submit" class="btn-primary">Publicar Evento</button>
        </form>
    </div>
    <footer>Limite de 5 eventos por dispositivo · Exclusão 1h após início · Conteúdo impróprio é bloqueado</footer>
</div>

<script>
    // ==================== CONFIGURAÇÕES ====================
    const YOUTUBE_API_KEY = "AIzaSyCrIJtzHeEeAPGxHI2ZNQlHdNyBd4mkmGQ"; // Sua chave
    const LIMITE_EVENTOS = 5;
    const ALERTA_EMAIL = "lambelambeapp@gmail.com";

    // Palavras bloqueadas (conteúdo impróprio)
    const BLOQUEADAS = ["sexo","porn","nudez","violência","droga","tráfico","arma","facção","ódio","racismo","homofobia","nazi","pedofilia","suicídio","morte","sangue","sequestro","assalto","estupro","incesto","bomba","terrorismo","cocaína","maconha","crack","heroína","prostituição"];

    function hasBadWords(text) {
        if (!text) return false;
        const lower = text.toLowerCase();
        return BLOQUEADAS.some(pal => lower.includes(pal));
    }

    function isValidYoutubeUrl(url) {
        return /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\//.test(url);
    }

    let userCity = null;
    let manualEvents = [];

    // ==================== GEOLOCALIZAÇÃO ====================
    async function getLocation() {
        if (!navigator.geolocation) return;
        try {
            const pos = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res,rej));
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=pt-BR`);
            const data = await resp.json();
            userCity = data.address?.city || data.address?.town || data.address?.municipality;
            document.getElementById("locationText").innerHTML = userCity ? `📍 ${userCity}` : "📍 Local aprox.";
            renderManualEvents();
        } catch(e) { document.getElementById("locationText").innerHTML = "📍 Não disponível"; }
    }
    getLocation();
    setInterval(getLocation, 30000);

    // ==================== CRUD EVENTOS ====================
    function loadEvents() {
        const stored = localStorage.getItem("vaaamos_events");
        manualEvents = stored ? JSON.parse(stored) : [];
        manualEvents.forEach(ev => { if (ev.keepByAdmin === undefined) ev.keepByAdmin = false; });
        renderManualEvents();
    }

    function saveEvents() {
        localStorage.setItem("vaaamos_events", JSON.stringify(manualEvents));
        renderManualEvents();
        document.getElementById("eventCountBadge").innerText = manualEvents.length;
    }

    function getDeviceId() {
        let id = localStorage.getItem("deviceId");
        if (!id) {
            id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem("deviceId", id);
        }
        return id;
    }

    function countUserEvents() {
        const deviceId = getDeviceId();
        return manualEvents.filter(ev => ev.createdBy === deviceId).length;
    }

    function addEvent(eventData) {
        // Validação de conteúdo
        if (hasBadWords(eventData.title) || hasBadWords(eventData.description) || hasBadWords(eventData.city) || hasBadWords(eventData.address)) {
            showToast("❌ Conteúdo impróprio detectado! Evento não publicado.", "red");
            return false;
        }
        if (!isValidYoutubeUrl(eventData.link)) {
            showToast("❌ Link inválido. Use um link do YouTube.", "red");
            return false;
        }
        const eventDate = new Date(eventData.datetime);
        if (eventDate <= new Date()) {
            showToast("❌ Data/hora deve ser no futuro.", "red");
            return false;
        }

        const userCount = countUserEvents();
        if (userCount >= LIMITE_EVENTOS) {
            showToast(`❌ Limite de ${LIMITE_EVENTOS} eventos atingido. Contato: ${ALERTA_EMAIL}`, "orange");
            return false;
        }
        // Crítica a partir do terceiro evento (quando já tem 3 e tenta o 4º)
        if (userCount >= 3) {
            showToast(`⚠️ Você já tem ${userCount} eventos. Para mais, entre em contato: ${ALERTA_EMAIL}`, "#f4a261");
        }

        let banner = eventData.bannerUrl && eventData.bannerUrl.trim() !== "" ? eventData.bannerUrl : "subvam.png";
        manualEvents.push({
            id: Date.now(),
            title: eventData.title,
            bannerUrl: banner,
            datetime: eventData.datetime,
            city: eventData.city,
            address: eventData.address || "",
            description: eventData.description,
            link: eventData.link,
            createdBy: getDeviceId(),
            keepByAdmin: false
        });
        manualEvents.sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
        saveEvents();
        showToast("✅ Evento adicionado!", "green");
        return true;
    }

    function deleteEvent(id) {
        manualEvents = manualEvents.filter(ev => ev.id !== id);
        saveEvents();
        showToast("🗑️ Evento removido", "red");
    }

    function togglePin(id) {
        const ev = manualEvents.find(ev => ev.id === id);
        if (ev) {
            ev.keepByAdmin = !ev.keepByAdmin;
            saveEvents();
            showToast(ev.keepByAdmin ? "📌 Fixado! Não será removido." : "🔓 Remoção automática liberada.", "#f4a261");
        }
    }

    // Exclusão automática 1h após início
    function cleanExpired() {
        const now = new Date();
        let removed = 0;
        const filtered = manualEvents.filter(ev => {
            const diff = (now - new Date(ev.datetime)) / (1000*3600);
            if (diff >= 1 && !ev.keepByAdmin) {
                removed++;
                return false;
            }
            return true;
        });
        if (removed) {
            manualEvents = filtered;
            saveEvents();
            showToast(`⏰ ${removed} evento(s) expirado(s) (1h após início) removido(s)`, "#2c3e50");
        }
    }
    setInterval(cleanExpired, 60000);
    cleanExpired();

    function showToast(msg, color="#2c3e50") {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = color;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatDate(iso) {
        try {
            return new Date(iso).toLocaleString('pt-BR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
        } catch(e) { return iso; }
    }

    function openMap(endereco, cidade) {
        let query = endereco || cidade;
        if (query) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
    }

    function renderManualEvents() {
        const container = document.getElementById("manualEventsContainer");
        if (!manualEvents.length) {
            container.innerHTML = `<div class="empty-state">Nenhum evento cadastrado. Use o formulário acima.</div>`;
            document.getElementById("eventCountBadge").innerText = "0";
            return;
        }
        const deviceId = getDeviceId();
        container.innerHTML = manualEvents.map(ev => {
            const isLocal = userCity && ev.city && (ev.city.toLowerCase().includes(userCity.toLowerCase()) || userCity.toLowerCase().includes(ev.city.toLowerCase()));
            const isOwner = ev.createdBy === deviceId;
            return `
                <div class="event-card">
                    <img class="card-banner" src="${ev.bannerUrl}" onerror="this.onerror=null; this.src='https://placehold.co/600x400/667eea/white?text=Vaaamos'">
                    <div class="card-content">
                        <div class="card-title">
                            <span>${escapeHtml(ev.title)}</span>
                            <div class="admin-buttons">
                                ${ev.keepByAdmin ? '<span class="badge-fixed"><i class="fas fa-thumbtack"></i> Fixado</span>' : ''}
                                ${isOwner ? `
                                    <button class="btn-icon btn-delete" onclick="window.deleteEvent(${ev.id})"><i class="fas fa-trash-alt"></i></button>
                                    <button class="btn-icon btn-pin ${ev.keepByAdmin ? 'active' : ''}" onclick="window.togglePin(${ev.id})"><i class="fas fa-thumbtack"></i></button>
                                ` : ''}
                            </div>
                        </div>
                        <div class="local-badge" onclick="openMap('${escapeHtml(ev.address)}','${escapeHtml(ev.city)}')"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(ev.city)}</div>
                        <div class="datetime-highlight">⏰ ${formatDate(ev.datetime)} ${isLocal ? '📍 Perto de você' : ''}</div>
                        <div class="desc">${escapeHtml(ev.description)}</div>
                        <a href="${ev.link}" target="_blank" class="event-link"><i class="fab fa-youtube"></i> Assistir live</a>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById("eventCountBadge").innerText = manualEvents.length;
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) || ''; }

    // ==================== YOUTUBE LIVE (HÍBRIDO) ====================
    async function fetchYouTube() {
        const container = document.getElementById("youtubeContainer");
        if (!YOUTUBE_API_KEY) {
            container.innerHTML = `<div class="empty-state">🔑 Chave de API não configurada.</div>`;
            return;
        }
        container.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Buscando lives...</div>`;
        let videosMap = new Map();

        // Palavras-chave de música
        const keywords = ["música ao vivo", "show ao vivo", "live music", "live session", "apresentação ao vivo"];
        for (const kw of keywords) {
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&eventType=live&type=video&maxResults=5&q=${encodeURIComponent(kw)}&key=${YOUTUBE_API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.items) data.items.forEach(item => { if (!videosMap.has(item.id.videoId)) videosMap.set(item.id.videoId, item); });
                await new Promise(r => setTimeout(r, 100));
            } catch(e) { console.warn(kw, e); }
        }

        // Categoria 10 (Música)
        try {
            const urlCat = `https://www.googleapis.com/youtube/v3/search?part=snippet&eventType=live&type=video&maxResults=8&videoCategoryId=10&key=${YOUTUBE_API_KEY}`;
            const res = await fetch(urlCat);
            const data = await res.json();
            if (data.items) data.items.forEach(item => { if (!videosMap.has(item.id.videoId)) videosMap.set(item.id.videoId, item); });
        } catch(e) { console.warn("Categoria 10 erro", e); }

        if (videosMap.size === 0) {
            container.innerHTML = `<div class="empty-state">🎵 Nenhuma live de música no momento.</div>`;
            return;
        }

        const videoIds = Array.from(videosMap.keys()).join(',');
        try {
            const detUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`;
            const detRes = await fetch(detUrl);
            const detData = await detRes.json();
            if (detData.error) throw new Error(detData.error.message);
            container.innerHTML = detData.items.map(video => {
                const thumb = video.snippet.thumbnails?.high?.url || video.snippet.thumbnails?.medium?.url;
                const live = video.liveStreamingDetails || {};
                const time = live.scheduledStartTime ? `📅 ${new Date(live.scheduledStartTime).toLocaleString('pt-BR')}` : "🔴 AO VIVO";
                return `
                    <div class="event-card">
                        <img class="card-banner" src="${thumb}" onerror="this.src='https://placehold.co/600x400/e63946/white?text=Vaaamos'">
                        <div class="card-content">
                            <div class="card-title">${escapeHtml(video.snippet.title)}</div>
                            <div style="font-size:0.7rem; color:#2c7da0;">${escapeHtml(video.snippet.channelTitle)}</div>
                            <div class="datetime-highlight">${time}</div>
                            <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="event-link">Assistir</a>
                        </div>
                    </div>
                `;
            }).join('');
        } catch(err) {
            container.innerHTML = `<div class="empty-state">Erro ao carregar detalhes: ${err.message}</div>`;
        }
    }

    // ==================== FORMULÁRIO ====================
    document.getElementById("eventForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("eventTitle").value.trim();
        let bannerUrl = document.getElementById("eventBanner").value.trim();
        const datetime = document.getElementById("eventDatetime").value;
        const city = document.getElementById("eventCity").value.trim();
        const address = document.getElementById("eventAddress").value.trim();
        const description = document.getElementById("eventDesc").value.trim();
        const link = document.getElementById("eventLink").value.trim();
        if (!title || !datetime || !city || !description || !link) {
            showToast("Preencha todos os campos obrigatórios!", "orange");
            return;
        }
        addEvent({ title, bannerUrl, datetime, city, address, description, link });
        e.target.reset();
    });

    window.deleteEvent = deleteEvent;
    window.togglePin = togglePin;
    window.openMap = openMap;

    loadEvents();
    fetchYouTube();
    setInterval(fetchYouTube, 120000);
</script>
</body>
</html>
