<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GeoLive · Eventos ao vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: #f4f6f9;
            padding: 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Cabeçalho simples */
        .header {
            background: linear-gradient(135deg, #0f2027, #203a43);
            color: white;
            border-radius: 1.2rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .location {
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
        }
        /* Formulário em destaque acima da lista */
        .form-card {
            background: white;
            border-radius: 1.2rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        input, textarea {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 0.8rem;
            font-size: 0.9rem;
        }
        button {
            background: #1e2f3e;
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary {
            background: #e63946;
            width: 100%;
        }
        /* Lista de eventos */
        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 1rem 0 0.8rem;
            border-left: 5px solid #e63946;
            padding-left: 0.8rem;
        }
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .card-banner {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .card-content {
            padding: 0.8rem;
        }
        .card-title {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
        }
        .datetime {
            font-size: 0.7rem;
            background: #f0e6d2;
            padding: 0.2rem 0.4rem;
            border-radius: 0.5rem;
            display: inline-block;
            margin: 0.4rem 0;
        }
        .desc {
            font-size: 0.8rem;
            color: #555;
            margin: 0.4rem 0;
        }
        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .btn-small {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.2rem 0.4rem;
        }
        .delete-btn { color: #e63946; }
        .pin-btn { color: #f4a261; }
        .pin-active { color: #27ae60; }
        .live-link {
            background: #e63946;
            color: white;
            text-decoration: none;
            padding: 0.3rem 0.8rem;
            border-radius: 1.5rem;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 0.5rem;
        }
        .empty {
            text-align: center;
            padding: 2rem;
            color: #888;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 1000;
        }
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-map-marker-alt"></i> GeoLive</h1>
        <div class="location" id="locationDisplay">📍 Detectando...</div>
    </div>

    <!-- Formulário - sempre visível -->
    <div class="form-card">
        <h3 style="margin-bottom: 1rem;">➕ Novo Evento</h3>
        <form id="eventForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>Banner (URL da imagem)</label>
                    <input type="url" id="banner" placeholder="https://exemplo.com/imagem.jpg" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Data e Hora</label>
                    <input type="datetime-local" id="datetime" required>
                </div>
                <div class="form-group">
                    <label>Cidade (opcional)</label>
                    <input type="text" id="city" placeholder="Ex: São Paulo">
                </div>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="description" rows="2" required></textarea>
            </div>
            <div class="form-group">
                <label>Link da Live (YouTube)</label>
                <input type="url" id="link" placeholder="https://youtube.com/watch?v=..." required>
            </div>
            <button type="submit" class="btn-primary">Publicar Evento</button>
        </form>
    </div>

    <!-- Lista de eventos manuais -->
    <div class="section-title">
        <span>📅 Eventos Cadastrados</span>
        <span id="eventCount" style="background:#ddd; padding:0.1rem 0.6rem; border-radius:1rem;">0</span>
    </div>
    <div id="eventsList" class="events-grid"></div>

    <!-- Seção YouTube (opcional, aparece só se a chave estiver configurada) -->
    <div id="youtubeSection" style="display: none;">
        <div class="section-title">
            <span>🎬 Ao Vivo no YouTube</span>
        </div>
        <div id="youtubeList" class="events-grid"></div>
    </div>
</div>

<script>
    // ==================== CONFIGURAÇÕES ====================
    // Coloque sua chave do YouTube aqui (se não tiver, deixe vazio - a seção não aparecerá)
    const YOUTUBE_API_KEY = ""; // ← insira sua chave se quiser

    // ==================== VARIÁVEIS ====================
    let manualEvents = [];
    let userCity = null;

    // ==================== UTILITÁRIOS ====================
    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function getDeviceId() {
        let id = localStorage.getItem('deviceId');
        if (!id) {
            id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem('deviceId', id);
        }
        return id;
    }

    // Limite de 3 eventos gratuitos por dispositivo
    function countFreeEvents() {
        const deviceId = getDeviceId();
        return manualEvents.filter(ev => ev.createdBy === deviceId && !ev.isPromoter).length;
    }

    // ==================== GEOLOCALIZAÇÃO AUTOMÁTICA ====================
    async function updateLocation() {
        if (!navigator.geolocation) {
            document.getElementById('locationDisplay').innerHTML = "📍 Geolocalização não suportada";
            return;
        }
        try {
            const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject));
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=pt-BR`);
            const data = await res.json();
            userCity = data.address?.city || data.address?.town || data.address?.municipality || '';
            if (userCity) {
                document.getElementById('locationDisplay').innerHTML = `📍 ${userCity}`;
            } else {
                document.getElementById('locationDisplay').innerHTML = "📍 Localização aproximada";
            }
            renderEvents();
        } catch (err) {
            document.getElementById('locationDisplay').innerHTML = "📍 Localização não disponível";
            userCity = null;
        }
    }

    // Atualizar automaticamente a cada 30 segundos (sem botão)
    setInterval(updateLocation, 30000);
    updateLocation();

    // ==================== CRUD EVENTOS (localStorage) ====================
    function loadEvents() {
        const stored = localStorage.getItem('geolive_events');
        if (stored) manualEvents = JSON.parse(stored);
        else manualEvents = [];
        // Garantir campos padrão
        manualEvents.forEach(ev => {
            if (ev.keepByAdmin === undefined) ev.keepByAdmin = false;
            if (ev.isPromoter === undefined) ev.isPromoter = false;
            if (!ev.createdBy) ev.createdBy = 'unknown';
        });
        renderEvents();
    }

    function saveEvents() {
        localStorage.setItem('geolive_events', JSON.stringify(manualEvents));
        renderEvents();
        document.getElementById('eventCount').innerText = manualEvents.length;
    }

    function addEvent(eventData) {
        const deviceId = getDeviceId();
        const userFreeCount = countFreeEvents();
        if (userFreeCount >= 3) {
            showToast("❌ Limite de 3 eventos gratuitos atingido. Torne-se promoter (em breve).");
            return false;
        }
        const newEvent = {
            id: Date.now(),
            title: eventData.title,
            bannerUrl: eventData.banner,
            datetime: eventData.datetime,
            city: eventData.city,
            description: eventData.description,
            link: eventData.link,
            createdBy: deviceId,
            isPromoter: false,
            keepByAdmin: false
        };
        manualEvents.push(newEvent);
        manualEvents.sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
        saveEvents();
        showToast("✅ Evento adicionado!");
        return true;
    }

    function deleteEvent(id) {
        manualEvents = manualEvents.filter(ev => ev.id !== id);
        saveEvents();
        showToast("🗑️ Evento removido");
    }

    function togglePin(id) {
        const ev = manualEvents.find(ev => ev.id === id);
        if (ev) {
            ev.keepByAdmin = !ev.keepByAdmin;
            saveEvents();
            showToast(ev.keepByAdmin ? "📌 Evento fixado" : "📍 Evento liberado");
        }
    }

    // Exclusão automática (3h após horário)
    function cleanExpired() {
        const now = new Date();
        let removed = 0;
        const filtered = manualEvents.filter(ev => {
            const evDate = new Date(ev.datetime);
            const diffHours = (now - evDate) / (1000 * 3600);
            if (diffHours > 3 && !ev.keepByAdmin) {
                removed++;
                return false;
            }
            return true;
        });
        if (removed > 0) {
            manualEvents = filtered;
            saveEvents();
            showToast(`⏰ ${removed} evento(s) expirado(s) removido(s)`);
        }
    }
    setInterval(cleanExpired, 60 * 1000);
    cleanExpired();

    // ==================== RENDERIZAÇÃO ====================
    function renderEvents() {
        const container = document.getElementById('eventsList');
        if (manualEvents.length === 0) {
            container.innerHTML = `<div class="empty">Nenhum evento cadastrado. Use o formulário acima.</div>`;
            return;
        }
        container.innerHTML = manualEvents.map(ev => {
            const isLocal = userCity && ev.city && (ev.city.toLowerCase().includes(userCity.toLowerCase()) || userCity.toLowerCase().includes(ev.city.toLowerCase()));
            const isOwner = ev.createdBy === getDeviceId();
            return `
                <div class="card" style="${isLocal ? 'border-left: 4px solid #f4a261;' : ''}">
                    <img class="card-banner" src="${ev.bannerUrl}" onerror="this.src='https://placehold.co/600x400/ccc/white?text=Sem+imagem'">
                    <div class="card-content">
                        <div class="card-title">
                            <span>${escapeHtml(ev.title)}</span>
                            <div>
                                ${ev.keepByAdmin ? '<i class="fas fa-thumbtack" style="color:#27ae60;"></i>' : ''}
                            </div>
                        </div>
                        ${ev.city ? `<div><i class="fas fa-city"></i> ${escapeHtml(ev.city)}</div>` : ''}
                        <div class="datetime"><i class="far fa-clock"></i> ${formatDateTime(ev.datetime)}</div>
                        <div class="desc">${escapeHtml(ev.description)}</div>
                        <a href="${ev.link}" target="_blank" class="live-link"><i class="fab fa-youtube"></i> Assistir</a>
                        ${isOwner ? `
                            <div class="card-actions">
                                <button class="btn-small delete-btn" onclick="window.deleteEvent(${ev.id})"><i class="fas fa-trash-alt"></i> Excluir</button>
                                <button class="btn-small pin-btn ${ev.keepByAdmin ? 'pin-active' : ''}" onclick="window.togglePin(${ev.id})"><i class="fas fa-thumbtack"></i> Fixar</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function formatDateTime(iso) {
        if (!iso) return '';
        try {
            return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' });
        } catch(e) { return iso; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }

    // ==================== YOUTUBE (se chave configurada) ====================
    async function fetchYouTube() {
        if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "") {
            document.getElementById('youtubeSection').style.display = 'none';
            return;
        }
        document.getElementById('youtubeSection').style.display = 'block';
        const container = document.getElementById('youtubeList');
        container.innerHTML = '<div class="empty">Carregando...</div>';
        try {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&eventType=live&type=video&maxResults=6&videoCategoryId=10,24&key=${YOUTUBE_API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.error) {
                container.innerHTML = `<div class="empty">Erro na API: ${data.error.message}</div>`;
                return;
            }
            if (!data.items || data.items.length === 0) {
                container.innerHTML = '<div class="empty">Nenhuma live no momento</div>';
                return;
            }
            const videoIds = data.items.map(i => i.id.videoId).join(',');
            const detRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`);
            const detData = await detRes.json();
            container.innerHTML = detData.items.map(video => {
                const thumb = video.snippet.thumbnails?.high?.url || '';
                const title = video.snippet.title;
                const channel = video.snippet.channelTitle;
                const liveTime = video.liveStreamingDetails?.scheduledStartTime ? new Date(video.liveStreamingDetails.scheduledStartTime).toLocaleString('pt-BR') : 'AO VIVO';
                return `
                    <div class="card">
                        <img class="card-banner" src="${thumb}" onerror="this.src='https://placehold.co/600x400/ccc?text=YouTube'">
                        <div class="card-content">
                            <div class="card-title">${escapeHtml(title)}</div>
                            <div style="font-size:0.7rem; color:#2c7da0;">${escapeHtml(channel)}</div>
                            <div class="datetime">${liveTime}</div>
                            <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="live-link">Assistir</a>
                        </div>
                    </div>
                `;
            }).join('');
        } catch(err) {
            container.innerHTML = '<div class="empty">Erro ao carregar lives</div>';
        }
    }

    // ==================== FORMULÁRIO ====================
    document.getElementById('eventForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value.trim();
        const banner = document.getElementById('banner').value.trim();
        const datetime = document.getElementById('datetime').value;
        const city = document.getElementById('city').value.trim();
        const description = document.getElementById('description').value.trim();
        const link = document.getElementById('link').value.trim();

        if (!title || !banner || !datetime || !description || !link) {
            alert('Preencha todos os campos.');
            return;
        }
        if (new Date(datetime) < new Date()) {
            alert('Data/hora não pode ser no passado.');
            return;
        }
        if (addEvent({ title, banner, datetime, city, description, link })) {
            document.getElementById('eventForm').reset();
        }
    });

    // Expor funções globais
    window.deleteEvent = deleteEvent;
    window.togglePin = togglePin;

    // Inicialização
    loadEvents();
    fetchYouTube();
    // Atualizar lista a cada 30s (por segurança)
    setInterval(() => {
        loadEvents();
        fetchYouTube();
    }, 30000);
</script>
</body>
</html>
