<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vaaamos! · Lives com RSS do YouTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            color: #1a2c3e;
            padding: 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cabeçalho */
        .geo-header {
            background: linear-gradient(135deg, #0f2027, #203a43);
            color: white;
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .geo-header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .location-box {
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }

        /* Seções */
        .section-title {
            font-size: 1.3rem;
            margin: 1.5rem 0 1rem;
            border-left: 6px solid #e63946;
            padding-left: 0.8rem;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Cards */
        .event-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.15);
        }

        .card-banner {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-content {
            padding: 1rem;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 0.3rem;
            font-size: 1rem;
        }

        .channel-name {
            font-size: 0.75rem;
            color: #e63946;
            margin-bottom: 0.5rem;
        }

        .datetime-highlight {
            background: linear-gradient(135deg, #fff5e6, #ffe8d6);
            border-left: 4px solid #f97316;
            padding: 0.3rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            margin: 0.5rem 0;
        }

        .event-link {
            display: inline-block;
            background: linear-gradient(135deg, #e63946, #c1121f);
            color: white;
            text-decoration: none;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            color: #666;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 1000;
            animation: fadeOut 3s;
        }

        @keyframes fadeOut {
            0% { opacity: 0; transform: translateX(100%); }
            15% { opacity: 1; transform: translateX(0); }
            85% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100%); }
        }

        .form-card {
            background: white;
            border-radius: 1.2rem;
            padding: 1.2rem;
            margin-bottom: 2rem;
            border: 1px solid #e2edf2;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 0.8rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 0.8rem;
        }

        .btn-primary {
            background: #1e2f3e;
            color: white;
            width: 100%;
            padding: 0.7rem;
            border-radius: 2rem;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #777;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="geo-header">
        <h1><i class="fas fa-map-marker-alt"></i> Vaaamos! Lambe Lambe</h1>
        <div class="location-box"><i class="fas fa-globe"></i> <span id="locationText">Detectando...</span></div>
    </div>

    <!-- SEÇÃO DE LIVES COM RSS DO YOUTUBE (SEM API KEY) -->
    <div class="section-title">
        <span><i class="fab fa-youtube"></i> AO VIVO AGORA · RSS FEED</span>
    </div>
    <div id="liveContainer" class="cards-grid">
        <div class="empty-state">Carregando lives via RSS...</div>
    </div>

    <!-- CADASTRO DE EVENTOS LOCAIS -->
    <div class="form-card">
        <h3>➕ CADASTRAR EVENTO LOCAL</h3>
        <form id="eventForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="eventTitle" required>
                </div>
                <div class="form-group">
                    <label>Banner (URL)</label>
                    <input type="url" id="eventBanner" placeholder="opcional">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Data/Hora *</label>
                    <input type="datetime-local" id="eventDatetime" required>
                </div>
                <div class="form-group">
                    <label>Cidade *</label>
                    <input type="text" id="eventCity" required>
                </div>
            </div>
            <div class="form-group">
                <label>Endereço completo (opcional)</label>
                <input type="text" id="eventAddress" placeholder="Rua, número">
            </div>
            <div class="form-group">
                <label>Descrição *</label>
                <textarea rows="2" id="eventDesc" required></textarea>
            </div>
            <div class="form-group">
                <label>Link da Live *</label>
                <input type="url" id="eventLink" placeholder="https://youtube.com/..." required>
            </div>
            <button type="submit" class="btn-primary">PUBLICAR EVENTO</button>
        </form>
    </div>

    <div id="manualEventsContainer" class="cards-grid"></div>
    <footer>Limite de 3 eventos gratuitos · Suas lives são atualizadas automaticamente</footer>
</div>

<script>
    // ==================== 1. GEOLOCALIZAÇÃO ====================
    let userCity = null;
    async function getLocation() {
        if (!navigator.geolocation) return;
        try {
            const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej));
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=pt-BR`);
            const data = await resp.json();
            userCity = data.address?.city || data.address?.town || data.address?.municipality;
            document.getElementById("locationText").innerHTML = userCity ? `📍 ${userCity}` : "📍 Local aprox.";
            renderManualEvents();
        } catch (e) {
            document.getElementById("locationText").innerHTML = "📍 Não disponível";
        }
    }
    getLocation();
    setInterval(getLocation, 30000);

    // ==================== 2. LIVES VIA RSS FEED (SEM API KEY) ====================
    // LISTA DE CANAIS PARA MONITORAR (SUBSTITUA PELOS IDS DOS CANAIS QUE VOCÊ QUER)
    // 🔧 COMO OBTER O CHANNEL ID:
    // 1. Acesse o canal pelo navegador
    // 2. Clique com botão direito -> "Exibir código fonte da página"
    // 3. Procure por "channel_id": o valor será algo como "UCXuqSBlHAE6Xw-yeJA4TpLg"
    const CHANNELS = [
        { id: "UCXuqSBlHAE6Xw-yeJA4TpLg", name: "Música Brasil" },
        { id: "UC-9-kyTW8ZkZNDHQJ6FgpwQ", name: "Arte Ao Vivo" },
        { id: "UCVHFbqXqoYvEWM1Ddxl0QDg", name: "Cultura Agora" }
    ];

    async function checkLiveStatus(channelId) {
        const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
        try {
            const response = await fetch(rssUrl);
            const text = await response.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, "text/xml");
            
            // O primeiro <entry> é o vídeo mais recente
            const entry = xml.querySelector("entry");
            if (!entry) return null;

            const videoId = entry.querySelector("yt\\:videoId")?.textContent || entry.querySelector("videoId")?.textContent;
            const title = entry.querySelector("title")?.textContent;
            const published = entry.querySelector("published")?.textContent;
            const channelName = xml.querySelector("title")?.textContent;
            const thumbnail = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
            
            // Verifica se o vídeo está AO VIVO e foi publicado há menos de 2 horas
            if (videoId && published) {
                const publishedDate = new Date(published);
                const now = new Date();
                const diffMinutes = (now - publishedDate) / (1000 * 60);
                // Considera AO VIVO se foi publicado nos últimos 120 minutos (2 horas)
                if (diffMinutes <= 120) {
                    return {
                        isLive: true,
                        videoId: videoId,
                        title: title,
                        channelName: channelName,
                        thumbnail: thumbnail,
                        publishedAt: publishedDate
                    };
                }
            }
            return null;
        } catch (error) {
            console.warn(`Erro no canal ${channelId}:`, error);
            return null;
        }
    }

    async function fetchAllLives() {
        const container = document.getElementById("liveContainer");
        container.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Verificando lives via RSS...</div>`;
        
        let liveResults = [];
        for (const channel of CHANNELS) {
            const liveData = await checkLiveStatus(channel.id);
            if (liveData && liveData.isLive) {
                liveResults.push({
                    ...liveData,
                    customName: channel.name
                });
            }
            // Pequena pausa para evitar bloqueios
            await new Promise(r => setTimeout(r, 100));
        }

        if (liveResults.length === 0) {
            // Fallback: imagens locais (coloque img1.png, img2.png, img3.png na mesma pasta)
            const fallbackImages = ["img1.png", "img2.png", "img3.png"];
            let fallbackHtml = fallbackImages.map(img => `
                <div class="event-card">
                    <img class="card-banner" src="${img}" onerror="this.src='https://placehold.co/600x400/667eea/white?text=Vaaamos'">
                    <div class="card-content">
                        <div class="card-title">Evento em breve</div>
                        <div class="datetime-highlight">📅 Programação cultural</div>
                    </div>
                </div>
            `).join('');
            container.innerHTML = fallbackHtml;
            return;
        }

        // Exibe as lives encontradas
        container.innerHTML = liveResults.map(live => `
            <div class="event-card">
                <img class="card-banner" src="${live.thumbnail}" onerror="this.src='https://placehold.co/600x400/667eea/white?text=Vaaamos'">
                <div class="card-content">
                    <div class="card-title">${escapeHtml(live.title)}</div>
                    <div class="channel-name"><i class="fab fa-youtube"></i> ${escapeHtml(live.customName)}</div>
                    <div class="datetime-highlight">🔴 AO VIVO AGORA</div>
                    <a href="https://www.youtube.com/watch?v=${live.videoId}" target="_blank" class="event-link">Assistir ao vivo</a>
                </div>
            </div>
        `).join('');
    }

    // Atualiza lives a cada 2 minutos
    fetchAllLives();
    setInterval(fetchAllLives, 120000);

    // ==================== 3. EVENTOS LOCAIS (LIMITE DE 3) ====================
    let manualEvents = [];
    const LIMITE_EVENTOS = 3;
    const ALERTA_EMAIL = "lambelambeapp@gmail.com";

    function loadEvents() {
        const stored = localStorage.getItem("vaaamos_events");
        manualEvents = stored ? JSON.parse(stored) : [];
        renderManualEvents();
    }

    function saveEvents() {
        localStorage.setItem("vaaamos_events", JSON.stringify(manualEvents));
        renderManualEvents();
    }

    function getDeviceId() {
        let id = localStorage.getItem("deviceId");
        if (!id) {
            id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem("deviceId", id);
        }
        return id;
    }

    function countUserEvents() {
        const deviceId = getDeviceId();
        return manualEvents.filter(ev => ev.createdBy === deviceId).length;
    }

    function addManualEvent(eventData) {
        const userCount = countUserEvents();
        if (userCount >= LIMITE_EVENTOS) {
            showToast(`❌ Limite de ${LIMITE_EVENTOS} eventos atingido. Contato: ${ALERTA_EMAIL}`, "orange");
            return false;
        }
        if (userCount >= 2) { // Aviso a partir do 3º evento
            showToast(`⚠️ Você já tem ${userCount} eventos. Para mais, contate: ${ALERTA_EMAIL}`, "#f4a261");
        }

        let banner = eventData.bannerUrl && eventData.bannerUrl.trim() !== "" ? eventData.bannerUrl : "subvam.png";
        manualEvents.push({
            id: Date.now(),
            title: eventData.title,
            bannerUrl: banner,
            datetime: eventData.datetime,
            city: eventData.city,
            address: eventData.address || "",
            description: eventData.description,
            link: eventData.link,
            createdBy: getDeviceId(),
            keepByAdmin: false
        });
        manualEvents.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
        saveEvents();
        showToast("✅ Evento adicionado!", "green");
        return true;
    }

    function deleteManualEvent(id) {
        manualEvents = manualEvents.filter(ev => ev.id !== id);
        saveEvents();
        showToast("🗑️ Evento removido", "red");
    }

    function formatDate(iso) {
        try {
            return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        } catch (e) { return iso; }
    }

    function openMap(endereco, cidade) {
        let q = endereco || cidade;
        if (q) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank');
    }

    function renderManualEvents() {
        const container = document.getElementById("manualEventsContainer");
        if (!manualEvents.length) {
            container.innerHTML = `<div class="empty-state">Nenhum evento local cadastrado.</div>`;
            return;
        }

        const deviceId = getDeviceId();
        container.innerHTML = manualEvents.map(ev => {
            const isOwner = ev.createdBy === deviceId;
            return `
                <div class="event-card">
                    <img class="card-banner" src="${ev.bannerUrl}" onerror="this.onerror=null; this.src='https://placehold.co/600x400/667eea/white?text=Vaaamos'">
                    <div class="card-content">
                        <div class="card-title">
                            ${escapeHtml(ev.title)}
                            ${isOwner ? `<button class="btn-icon btn-delete" onclick="deleteManualEvent(${ev.id})" style="background:none; border:none; color:#e63946; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                        <div style="font-size:0.7rem; cursor:pointer; color:#2c7da0;" onclick="openMap('${escapeHtml(ev.address)}','${escapeHtml(ev.city)}')"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(ev.city)}</div>
                        <div class="datetime-highlight">⏰ ${formatDate(ev.datetime)}</div>
                        <div class="desc">${escapeHtml(ev.description)}</div>
                        <a href="${ev.link}" target="_blank" class="event-link">Assistir</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    function showToast(msg, color = "#2c3e50") {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = color;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) || ''; }

    // ==================== 4. FORMULÁRIO ====================
    document.getElementById("eventForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("eventTitle").value.trim();
        let bannerUrl = document.getElementById("eventBanner").value.trim();
        const datetime = document.getElementById("eventDatetime").value;
        const city = document.getElementById("eventCity").value.trim();
        const address = document.getElementById("eventAddress").value.trim();
        const description = document.getElementById("eventDesc").value.trim();
        const link = document.getElementById("eventLink").value.trim();

        if (!title || !datetime || !city || !description || !link) {
            showToast("Preencha todos os campos obrigatórios!", "orange");
            return;
        }
        if (new Date(datetime) <= new Date()) {
            showToast("❌ Data/hora futura obrigatória.", "red");
            return;
        }

        addManualEvent({ title, bannerUrl, datetime, city, address, description, link });
        e.target.reset();
    });

    window.deleteManualEvent = deleteManualEvent;
    loadEvents();
</script>
</body>
</html>
