<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dédalo | Modo Clássico / Casual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #666666;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 0 16px;
            overflow-y: auto;
        }
        .game-container {
            background: rgba(20, 28, 38, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 15px 20px 19px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 150, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            max-width: 100%;
            overflow-y: visible;
            max-height: none;
            margin-top: 0;
            position: relative;
        }
        /* Barra superior */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .timer-panel, .best-panel {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 100, 0.6);
            border-radius: 48px;
            padding: 4px 18px;
            text-align: center;
            min-width: 95px;
        }
        .timer-label, .best-label {
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: #c0b090;
        }
        .timer-value {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            line-height: 1.2;
        }
        .best-value {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 1rem;
            font-weight: bold;
            color: #FFD966;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            line-height: 1.2;
        }
        /* Toggle switch moderno */
        .mode-switch {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 100, 0.6);
            border-radius: 48px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .mode-switch span {
            font-size: 0.65rem;
            color: #FFE5B4;
            font-weight: 500;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2c3e46;
            transition: 0.2s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: #FFE5B4;
            transition: 0.2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #FF8C42;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        /* Botão reset */
        .reset-btn {
            background: rgba(160, 65, 45, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 100, 0.6);
            border-radius: 48px;
            padding: 4px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .reset-btn:active {
            transform: translateY(2px);
            background: rgba(180, 75, 55, 0.95);
        }
        .reset-icon {
            font-size: 1.3rem;
            font-weight: bold;
            color: #FFE5B4;
        }
        .reset-label {
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: #ffd7a0;
        }
        canvas {
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 215, 150, 0.25);
            background-color: #1e2a32;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        /* D-pad (modo clássico) */
        .dpad-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 6px;
        }
        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .dpad-row {
            display: flex;
            gap: 18px;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(30, 40, 52, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 120, 0.7);
            border-radius: 60px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 2px 4px black;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.15);
            transition: 0.05s linear;
            cursor: pointer;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
            background: rgba(50, 65, 82, 0.95);
        }
        footer {
            text-align: center;
            font-size: 0.65rem;
            color: #ccb;
            margin-top: 12px;
            opacity: 0.8;
        }
        @media (max-width: 560px) {
            .timer-panel, .best-panel { padding: 2px 10px; min-width: 75px; }
            .timer-value { font-size: 1rem; }
            .best-value { font-size: 0.85rem; }
            .ctrl-btn { width: 55px; height: 55px; font-size: 24px; }
            .dpad-row { gap: 12px; }
            footer { margin-top: 8px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="top-bar">
            <div class="timer-panel">
                <div class="timer-label">⏱️ TEMPO</div>
                <div class="timer-value" id="timerDisplay">0.0 s</div>
            </div>
            <div class="best-panel">
                <div class="best-label">🏆 MELHOR</div>
                <div class="best-value" id="bestDisplay">---</div>
            </div>
            <label class="mode-switch">
                <span>🎮 CLÁSSICO</span>
                <div class="switch">
                    <input type="checkbox" id="modeToggle">
                    <span class="slider"></span>
                </div>
                <span>🖐️ CASUAL</span>
            </label>
            <div class="reset-btn" id="btnReset">
                <div class="reset-icon">⟳</div>
                <div class="reset-label">NOVO</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div class="dpad-wrapper" id="dpadWrapper">
            <div class="dpad">
                <div class="dpad-row"><div class="ctrl-btn" id="btnUp">▲</div></div>
                <div class="dpad-row">
                    <div class="ctrl-btn" id="btnLeft">◀</div>
                    <div class="ctrl-btn" id="btnDown">▼</div>
                    <div class="ctrl-btn" id="btnRight">▶</div>
                </div>
            </div>
        </div>

        <footer>✨ aberturas nas bordas teletransportam para o lado oposto ✨</footer>
    </div>
</div>

<script>
    (function(){
        // ---------- CONFIGURAÇÕES GERAIS ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const SIZE = 600;
        canvas.width = SIZE;
        canvas.height = SIZE;
        
        const BALL_RADIUS = 13;
        const TARGET_RADIUS = 20;
        
        let ballX = SIZE/2, ballY = SIZE/2;
        let velocityX = 0, velocityY = 0;
        let victory = false;
        let victoryTimer = null;
        let isFalling = false;
        
        let gameStarted = false;
        let startTime = null;
        let currentTime = 0;
        
        let walls = [];
        const targetCenter = { x: SIZE/2, y: SIZE/2 };
        
        // Melhor tempo persistente
        let bestTime = null;
        const bestDisplay = document.getElementById('bestDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        
        // Modo de controle: false = clássico (D-pad+física), true = casual (arrasto)
        let casualMode = false;
        const modeToggle = document.getElementById('modeToggle');
        const dpadWrapper = document.getElementById('dpadWrapper');
        
        function formatTime(seconds) {
            if (seconds === null) return "---";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }
        
        function loadBestTime() {
            const stored = localStorage.getItem('dedaloBestTime');
            if (stored !== null) {
                bestTime = parseFloat(stored);
                bestDisplay.innerText = formatTime(bestTime);
            } else {
                bestTime = null;
                bestDisplay.innerText = "---";
            }
        }
        function saveBestTime(timeSec) {
            if (bestTime === null || timeSec < bestTime) {
                bestTime = timeSec;
                localStorage.setItem('dedaloBestTime', bestTime);
                bestDisplay.innerText = formatTime(bestTime);
            }
        }
        
        // ---------- GERADOR DFS (mesmo da Versão 1) ----------
        const CELL_SIZE = 46;
        const WALL_THICK = 10;
        const GRID_W = Math.floor(SIZE / CELL_SIZE);
        const GRID_H = GRID_W;
        const OFFSET_X = (SIZE - GRID_W * CELL_SIZE) / 2;
        const OFFSET_Y = (SIZE - GRID_H * CELL_SIZE) / 2;
        
        let cells = [];
        let wallsGrid = [];
        
        function initDFS() {
            cells = Array(GRID_H).fill().map(() => Array(GRID_W).fill(false));
            wallsGrid = Array(GRID_H).fill().map(() => Array(GRID_W).fill().map(() => ({ right: true, bottom: true })));
            const startX = Math.floor(GRID_W/2);
            const startY = Math.floor(GRID_H/2);
            dfsCarve(startX, startY);
        }
        
        function dfsCarve(x, y) {
            cells[y][x] = true;
            const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
            for (let i = dirs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
            }
            for (let [dx, dy] of dirs) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && !cells[ny][nx]) {
                    if (dx === 1) wallsGrid[y][x].right = false;
                    else if (dx === -1) wallsGrid[y][nx].right = false;
                    else if (dy === 1) wallsGrid[y][x].bottom = false;
                    else if (dy === -1) wallsGrid[ny][x].bottom = false;
                    dfsCarve(nx, ny);
                }
            }
        }
        
        let openings = { top: 0, bottom: 0, left: 0, right: 0 };
        
        function generateRandomOpenings() {
            openings = {
                top: Math.floor(Math.random() * GRID_W),
                bottom: Math.floor(Math.random() * GRID_W),
                left: Math.floor(Math.random() * GRID_H),
                right: Math.floor(Math.random() * GRID_H)
            };
        }
        
        function buildWallsFromDFS() {
            walls = [];
            const addWall = (x, y, w, h, type) => {
                if (w <= 0 || h <= 0) return;
                walls.push({ x, y, w, h, type });
            };
            for (let row = 0; row < GRID_H; row++) {
                for (let col = 0; col < GRID_W; col++) {
                    const cx = OFFSET_X + col * CELL_SIZE;
                    const cy = OFFSET_Y + row * CELL_SIZE;
                    if (wallsGrid[row][col].right) {
                        let type = Math.random() < 0.3 ? 'light' : 'dark';
                        addWall(cx + CELL_SIZE, cy, WALL_THICK, CELL_SIZE, type);
                    }
                    if (wallsGrid[row][col].bottom) {
                        let type = Math.random() < 0.3 ? 'light' : 'dark';
                        addWall(cx, cy + CELL_SIZE, CELL_SIZE, WALL_THICK, type);
                    }
                }
            }
            for (let col = 0; col < GRID_W; col++) {
                if (col !== openings.top) addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y, CELL_SIZE, WALL_THICK, 'dark');
                if (col !== openings.bottom) addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y + GRID_H*CELL_SIZE - WALL_THICK, CELL_SIZE, WALL_THICK, 'dark');
            }
            for (let row = 0; row < GRID_H; row++) {
                if (row !== openings.left) addWall(OFFSET_X, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 'dark');
                if (row !== openings.right) addWall(OFFSET_X + GRID_W*CELL_SIZE - WALL_THICK, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 'dark');
            }
            walls = walls.filter(w => Math.hypot(w.x + w.w/2 - targetCenter.x, w.y + w.h/2 - targetCenter.y) > TARGET_RADIUS + 12);
        }
        
        function generateNewMaze() {
            initDFS();
            generateRandomOpenings();
            buildWallsFromDFS();
        }
        
        function getOpeningPosition(side) {
            switch(side) {
                case 'top': return { x: OFFSET_X + openings.top * CELL_SIZE + CELL_SIZE/2, y: OFFSET_Y + 5 };
                case 'bottom': return { x: OFFSET_X + openings.bottom * CELL_SIZE + CELL_SIZE/2, y: OFFSET_Y + GRID_H*CELL_SIZE - 5 };
                case 'left': return { x: OFFSET_X + 5, y: OFFSET_Y + openings.left * CELL_SIZE + CELL_SIZE/2 };
                case 'right': return { x: OFFSET_X + GRID_W*CELL_SIZE - 5, y: OFFSET_Y + openings.right * CELL_SIZE + CELL_SIZE/2 };
            }
        }
        
        function randomSpawn() {
            const sides = ['top', 'bottom', 'left', 'right'];
            const chosen = sides[Math.floor(Math.random() * 4)];
            const pos = getOpeningPosition(chosen);
            ballX = pos.x;
            ballY = pos.y;
            for (let attempt = 0; attempt < 5; attempt++) {
                let collides = false;
                for (let w of walls) {
                    if (ballX + BALL_RADIUS > w.x && ballX - BALL_RADIUS < w.x + w.w &&
                        ballY + BALL_RADIUS > w.y && ballY - BALL_RADIUS < w.y + w.h) {
                        collides = true;
                        break;
                    }
                }
                if (!collides) break;
                ballX += (Math.random() - 0.5) * 15;
                ballY += (Math.random() - 0.5) * 15;
            }
        }
        
        // ---------- TELEPORTE (comum a ambos os modos) ----------
        function handleTeleport() {
            if (victory) return;
            const tolerance = BALL_RADIUS * 1.5;
            if (ballX + BALL_RADIUS < 0) {
                const openingY = OFFSET_Y + openings.left * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballY - openingY) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('right');
                    ballX = target.x;
                    ballY = target.y;
                } else {
                    ballX = BALL_RADIUS;
                }
                velocityX = 0; velocityY = 0;
            }
            if (ballX - BALL_RADIUS > SIZE) {
                const openingY = OFFSET_Y + openings.right * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballY - openingY) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('left');
                    ballX = target.x;
                    ballY = target.y;
                } else {
                    ballX = SIZE - BALL_RADIUS;
                }
                velocityX = 0; velocityY = 0;
            }
            if (ballY + BALL_RADIUS < 0) {
                const openingX = OFFSET_X + openings.top * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballX - openingX) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('bottom');
                    ballX = target.x;
                    ballY = target.y;
                } else {
                    ballY = BALL_RADIUS;
                }
                velocityX = 0; velocityY = 0;
            }
            if (ballY - BALL_RADIUS > SIZE) {
                const openingX = OFFSET_X + openings.bottom * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballX - openingX) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('top');
                    ballX = target.x;
                    ballY = target.y;
                } else {
                    ballY = SIZE - BALL_RADIUS;
                }
                velocityX = 0; velocityY = 0;
            }
        }
        
        // ---------- MODO CLÁSSICO (física + colisão) ----------
        let leftPressed = false, rightPressed = false, upPressed = false, downPressed = false;
        const ACC = 400;
        const MAX_SPEED = 500;
        const DRAG = 0.98;
        
        function circleRectCollision(cx, cy, r, rect) {
            let closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
            let closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
            let dx = cx - closestX, dy = cy - closestY;
            return dx*dx + dy*dy < r*r;
        }
        
        function handleCollisionsClassic() {
            for (let w of walls) {
                if (circleRectCollision(ballX, ballY, BALL_RADIUS, w)) {
                    let closestX = Math.max(w.x, Math.min(ballX, w.x + w.w));
                    let closestY = Math.max(w.y, Math.min(ballY, w.y + w.h));
                    let dx = ballX - closestX, dy = ballY - closestY;
                    let dist = Math.hypot(dx, dy);
                    if (dist < BALL_RADIUS) {
                        let angle = Math.atan2(dy, dx);
                        let correction = BALL_RADIUS - dist;
                        ballX += Math.cos(angle) * correction;
                        ballY += Math.sin(angle) * correction;
                        if (w.type === 'light') {
                            velocityX = -velocityX * 1.3;
                            velocityY = -velocityY * 1.3;
                        } else {
                            if (Math.abs(dx) > Math.abs(dy)) velocityX *= -0.5;
                            else velocityY *= -0.5;
                        }
                    }
                }
            }
        }
        
        function updatePhysicsClassic(delta) {
            if (victory) {
                velocityX = 0; velocityY = 0;
                return;
            }
            let ax = 0, ay = 0;
            if (leftPressed) ax = -ACC;
            if (rightPressed) ax = ACC;
            if (upPressed) ay = -ACC;
            if (downPressed) ay = ACC;
            let moving = (ax !== 0 || ay !== 0);
            if (moving && !gameStarted && !victory) {
                gameStarted = true;
                startTime = performance.now() / 1000;
            }
            velocityX += ax * delta;
            velocityY += ay * delta;
            let spd = Math.hypot(velocityX, velocityY);
            if (spd > MAX_SPEED) {
                velocityX = velocityX / spd * MAX_SPEED;
                velocityY = velocityY / spd * MAX_SPEED;
            }
            velocityX *= DRAG;
            velocityY *= DRAG;
            if (Math.abs(velocityX) < 0.2) velocityX = 0;
            if (Math.abs(velocityY) < 0.2) velocityY = 0;
            ballX += velocityX * delta;
            ballY += velocityY * delta;
            handleCollisionsClassic();
            handleTeleport();
            checkWin();
        }
        
        // ---------- MODO CASUAL (arrasto direto) ----------
        function isCollidingWithWall(x, y) {
            for (let w of walls) {
                let closestX = Math.max(w.x, Math.min(x, w.x + w.w));
                let closestY = Math.max(w.y, Math.min(y, w.y + w.h));
                let dx = x - closestX, dy = y - closestY;
                if (dx*dx + dy*dy < BALL_RADIUS * BALL_RADIUS) {
                    return true;
                }
            }
            return false;
        }
        
        function tryMoveBallTo(desiredX, desiredY) {
            if (victory) return;
            if (!isCollidingWithWall(desiredX, desiredY)) {
                ballX = desiredX;
                ballY = desiredY;
                if (!gameStarted && !victory) {
                    gameStarted = true;
                    startTime = performance.now() / 1000;
                }
            } else {
                // tenta recuo radial simples
                for (let ang = 0; ang < 360; ang += 10) {
                    let rad = ang * Math.PI/180;
                    let testX = desiredX + Math.cos(rad) * 5;
                    let testY = desiredY + Math.sin(rad) * 5;
                    if (!isCollidingWithWall(testX, testY)) {
                        ballX = testX;
                        ballY = testY;
                        break;
                    }
                }
            }
            handleTeleport();
            ballX = Math.min(Math.max(ballX, BALL_RADIUS), SIZE - BALL_RADIUS);
            ballY = Math.min(Math.max(ballY, BALL_RADIUS), SIZE - BALL_RADIUS);
            checkWin();
        }
        
        // Eventos de arrasto (modo casual)
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(Math.max(canvasX, BALL_RADIUS), SIZE - BALL_RADIUS);
            canvasY = Math.min(Math.max(canvasY, BALL_RADIUS), SIZE - BALL_RADIUS);
            return { x: canvasX, y: canvasY };
        }
        
        function onDragStart(e) {
            if (!casualMode) return;
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            tryMoveBallTo(x, y);
        }
        
        function onDragMove(e) {
            if (!casualMode) return;
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            tryMoveBallTo(x, y);
        }
        
        function onDragEnd(e) {
            if (!casualMode) return;
            e.preventDefault();
        }
        
        // Ativar/desativar modos
        function setMode(isCasual) {
            casualMode = isCasual;
            // Mostra/esconde D-pad
            dpadWrapper.style.display = casualMode ? 'none' : 'flex';
            // Remove eventos de teclado se não for clássico
            if (casualMode) {
                // desliga teclado
                leftPressed = rightPressed = upPressed = downPressed = false;
            } else {
                // garante que o canvas não capture arrasto
            }
        }
        
        modeToggle.addEventListener('change', (e) => {
            setMode(e.target.checked);
            resetGame(false); // reinicia sem gerar novo labirinto, apenas reposiciona
        });
        
        // ---------- EFEITOS DE VITÓRIA (queda e fogos) ----------
        function startFallingEffect(callback) {
            if (isFalling) return;
            isFalling = true;
            let step = 0;
            const origR = BALL_RADIUS;
            function anim() {
                if (step < 10) {
                    const scale = 1 - (step/10)*0.8;
                    const r = origR * scale;
                    ctx.save();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(ballX, ballY, r, 0, Math.PI*2);
                    ctx.fillStyle = "#7a8a9a";
                    ctx.fill();
                    ctx.restore();
                    step++;
                    requestAnimationFrame(anim);
                } else {
                    isFalling = false;
                    if (callback) callback();
                }
            }
            anim();
        }
        
        function startFireworks() {
            const particles = [];
            const cx = targetCenter.x, cy = targetCenter.y;
            for (let i=0;i<6;i++) {
                const a = Math.random() * Math.PI*2;
                const r = 40 + Math.random()*60;
                const x = cx + Math.cos(a)*r;
                const y = cy + Math.sin(a)*r - 40;
                particles.push({ x, y, vx: (Math.random()-0.5)*2, vy: -7, life:1, exploded:false });
            }
            function update() {
                for(let i=particles.length-1;i>=0;i--) {
                    const p = particles[i];
                    if(!p.exploded) {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                        if(p.vy >=0 || p.y<50) {
                            p.exploded = true;
                            for(let s=0;s<22;s++) {
                                const a2 = Math.random()*Math.PI*2;
                                const sp = Math.random()*5+2;
                                particles.push({
                                    x: p.x, y: p.y, vx: Math.cos(a2)*sp, vy: Math.sin(a2)*sp,
                                    life:1, exploded:true, color: `hsl(${Math.random()*360},100%,60%)`
                                });
                            }
                            particles.splice(i,1);
                        }
                    } else {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                        p.life -= 0.02;
                        if(p.life<=0 || p.y>SIZE+50) particles.splice(i,1);
                    }
                }
                for(let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.exploded?3*p.life:4, 0, Math.PI*2);
                    ctx.fillStyle = p.color || "#ffaa66";
                    ctx.fill();
                }
                if(particles.length>0) requestAnimationFrame(update);
            }
            update();
        }
        
        function checkWin() {
            if (victory) return;
            const dist = Math.hypot(ballX - targetCenter.x, ballY - targetCenter.y);
            if (dist < BALL_RADIUS + 5) {
                victory = true;
                const elapsed = currentTime;
                saveBestTime(elapsed);
                startFallingEffect(() => startFireworks());
                if (victoryTimer) clearTimeout(victoryTimer);
                victoryTimer = setTimeout(() => {
                    resetGame(true);
                    victory = false;
                    gameStarted = false;
                    startTime = null;
                    currentTime = 0;
                    timerDisplay.innerText = "0.0 s";
                }, 3500);
            }
        }
        
        function resetGame(newMaze=true) {
            if(victoryTimer) clearTimeout(victoryTimer);
            victory = false;
            gameStarted = false;
            startTime = null;
            currentTime = 0;
            timerDisplay.innerText = "0.0 s";
            if(newMaze) generateNewMaze();
            randomSpawn();
            velocityX = 0; velocityY = 0;
            leftPressed = rightPressed = upPressed = downPressed = false;
        }
        
        function updateTimerDisplay() {
            if (!victory && gameStarted && startTime) {
                currentTime = (performance.now() / 1000) - startTime;
                timerDisplay.innerText = currentTime.toFixed(1) + " s";
            } else if (!gameStarted) {
                timerDisplay.innerText = "0.0 s";
            }
            requestAnimationFrame(updateTimerDisplay);
        }
        
        // ---------- LOOP PRINCIPAL ----------
        let lastFrame = 0;
        function gameLoop(now) {
            if(!lastFrame) lastFrame = now;
            let delta = Math.min(0.033, (now-lastFrame)/1000);
            if(delta>0.01) {
                if (!casualMode) {
                    updatePhysicsClassic(delta);
                } else {
                    // No modo casual, a física é substituída pelo arrasto; só teleporte e verificação de vitória
                    // Já chamamos checkWin dentro do arrasto, mas garantimos:
                    handleTeleport();
                    checkWin();
                }
                draw();
                // Atualiza tempo manualmente (já chamado no loop)
                if (gameStarted && !victory && startTime) {
                    currentTime = (performance.now()/1000) - startTime;
                    timerDisplay.innerText = currentTime.toFixed(1) + " s";
                }
            }
            lastFrame = now;
            requestAnimationFrame(gameLoop);
        }
        
        // Desenho (mesmo das versões anteriores)
        function draw() {
            ctx.clearRect(0,0,SIZE,SIZE);
            ctx.fillStyle = "#1e2a32";
            ctx.fillRect(0,0,SIZE,SIZE);
            for(let w of walls) {
                if(w.type === 'dark') {
                    ctx.fillStyle = "#2d5a3b";
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.fillStyle = "#1f3e2a";
                    ctx.fillRect(w.x+2, w.y+2, w.w-4, w.h-4);
                } else {
                    ctx.fillStyle = "#8bc34a";
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.fillStyle = "#6a9e3a";
                    ctx.fillRect(w.x+2, w.y+2, w.w-4, w.h-4);
                }
                ctx.strokeStyle = "#1e2a1a";
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            }
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = "#8B0000";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS-5, 0, Math.PI*2);
            ctx.fillStyle = "#FF4500";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS-10, 0, Math.PI*2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, 5, 0, Math.PI*2);
            ctx.fillStyle = "#FFF8DC";
            ctx.fill();
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 8;
            const grad = ctx.createRadialGradient(ballX-4, ballY-4, 4, ballX, ballY, BALL_RADIUS);
            grad.addColorStop(0, "#f4f8ff");
            grad.addColorStop(0.5, "#b5c4d4");
            grad.addColorStop(1, "#7a8a9a");
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(ballX-3, ballY-4, 4, 0, Math.PI*2);
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }
        
        // ---------- INICIALIZAÇÃO ----------
        loadBestTime();
        generateNewMaze();
        randomSpawn();
        updateTimerDisplay();
        
        // Configura modo padrão (clássico)
        setMode(false);
        modeToggle.checked = false;
        
        // Eventos de teclado (apenas no modo clássico)
        window.addEventListener('keydown', (e) => {
            if (casualMode) return;
            const k = e.key;
            if(k === 'ArrowLeft' || k === 'a') { leftPressed=true; e.preventDefault(); }
            else if(k === 'ArrowRight' || k === 'd') { rightPressed=true; e.preventDefault(); }
            else if(k === 'ArrowUp' || k === 'w') { upPressed=true; e.preventDefault(); }
            else if(k === 'ArrowDown' || k === 's') { downPressed=true; e.preventDefault(); }
            else if(k === 'r') { resetGame(true); e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            if (casualMode) return;
            const k = e.key;
            if(k === 'ArrowLeft' || k === 'a') leftPressed=false;
            else if(k === 'ArrowRight' || k === 'd') rightPressed=false;
            else if(k === 'ArrowUp' || k === 'w') upPressed=false;
            else if(k === 'ArrowDown' || k === 's') downPressed=false;
        });
        
        // Botões D-pad (apenas no modo clássico)
        const attach = (btn, dir) => {
            if(!btn) return;
            const set = (active) => {
                if (casualMode) return;
                if(dir==='up') upPressed=active;
                if(dir==='down') downPressed=active;
                if(dir==='left') leftPressed=active;
                if(dir==='right') rightPressed=active;
            };
            btn.addEventListener('mousedown', (e)=>{e.preventDefault(); set(true);});
            btn.addEventListener('mouseup', ()=>set(false));
            btn.addEventListener('mouseleave', ()=>set(false));
            btn.addEventListener('touchstart', (e)=>{e.preventDefault(); set(true);});
            btn.addEventListener('touchend', ()=>set(false));
            btn.addEventListener('touchcancel', ()=>set(false));
        };
        attach(document.getElementById('btnUp'), 'up');
        attach(document.getElementById('btnDown'), 'down');
        attach(document.getElementById('btnLeft'), 'left');
        attach(document.getElementById('btnRight'), 'right');
        
        // Reset button
        const resetBtn = document.getElementById('btnReset');
        if(resetBtn) {
            resetBtn.addEventListener('click', ()=>resetGame(true));
            resetBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); resetGame(true);});
        }
        
        // Eventos de arrasto (modo casual)
        canvas.addEventListener('touchstart', onDragStart, { passive: false });
        canvas.addEventListener('touchmove', onDragMove, { passive: false });
        canvas.addEventListener('touchend', onDragEnd);
        canvas.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', (e) => {
            if (casualMode && e.buttons === 1) onDragMove(e);
        });
        window.addEventListener('mouseup', onDragEnd);
        
        document.body.addEventListener('touchmove', e=>{ if(e.target===canvas) e.preventDefault(); }, {passive:false});
        
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
