<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dédalo | Aberturas e Teletransporte</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #666666; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; font-family: system-ui, sans-serif; padding: 10px; overflow-y: auto; }
        .game-container { background: rgba(20, 28, 38, 0.85); backdrop-filter: blur(12px); border-radius: 48px; padding: 15px 20px 19px; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1); border: 1px solid rgba(255,215,150,0.4); display: flex; flex-direction: column; align-items: center; width: fit-content; max-width: 100%; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
        .panel { background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,200,100,0.6); border-radius: 48px; padding: 4px 18px; text-align: center; min-width: 95px; }
        .label { font-size: 0.6rem; letter-spacing: 1px; color: #c0b090; text-transform: uppercase; }
        .value { font-family: 'Courier New', monospace; font-size: 1.2rem; font-weight: bold; color: #FFE5B4; }
        .mode-switch { background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,200,100,0.6); border-radius: 48px; padding: 4px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.65rem; font-weight: bold; color: #FFE5B4; }
        .switch { position: relative; width: 44px; height: 22px; background: #2c3e46; border-radius: 22px; transition: 0.2s; }
        .switch::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #FFE5B4; border-radius: 50%; transition: 0.2s; }
        input:checked + .switch { background: #FF8C42; }
        input:checked + .switch::before { transform: translateX(22px); }
        .btn { background: #a0412d; border: 1px solid #ffc864; border-radius: 48px; padding: 4px 14px; color: #FFE5B4; cursor: pointer; font-size: 0.65rem; font-weight: bold; }
        canvas { background: #1e2a32; border-radius: 32px; box-shadow: 0 12px 28px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,215,150,0.25); width: 100%; height: auto; touch-action: none; display: block; margin-bottom: 20px; }
        .dpad { display: grid; grid-template-areas: ". up ." "left down right"; gap: 12px; margin-top: 0; margin-bottom: 6px; }
        .ctrl-btn { width: 65px; height: 65px; background: rgba(30,40,52,0.9); border: 1px solid #ffc878; border-radius: 60px; display: flex; align-items: center; justify-content: center; color: #FFE5B4; font-size: 28px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.3); transition: 0.05s; }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
        footer { text-align: center; font-size: 0.65rem; color: #ccb; margin-top: 8px; opacity: 0.8; }
        input[type="checkbox"] { display: none; }
        @media (max-width: 560px) {
            .ctrl-btn { width: 55px; height: 55px; font-size: 24px; }
            .dpad { gap: 8px; }
            .value { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="top-bar">
        <div class="panel"><div class="label">Tempo</div><div class="value" id="timer">0.0 s</div></div>
        <div class="panel"><div class="label">Melhor</div><div class="value" id="best">---</div></div>
        <label class="mode-switch">
            CLÁSSICO <input type="checkbox" id="modeToggle"><div class="switch"></div> CASUAL
        </label>
        <button class="btn" id="resetBtn">NOVO</button>
    </div>
    <canvas id="canvas" width="600" height="600"></canvas>
    <div class="dpad" id="dpad">
        <div class="ctrl-btn" style="grid-area: up" id="btnUp">▲</div>
        <div class="ctrl-btn" style="grid-area: left" id="btnLeft">◀</div>
        <div class="ctrl-btn" style="grid-area: down" id="btnDown">▼</div>
        <div class="ctrl-btn" style="grid-area: right" id="btnRight">▶</div>
    </div>
    <footer>✨ aberturas nas bordas teletransportam para o lado oposto ✨</footer>
</div>

<script>
    (function(){
        // ---------- CONFIGURAÇÕES ----------
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const SIZE = 600;
        canvas.width = SIZE;
        canvas.height = SIZE;
        
        const BALL_RADIUS = 12;
        const TARGET_RADIUS = 20;
        
        // Variáveis da bola e estado
        let ball = { x: SIZE/2, y: SIZE/2, vx: 0, vy: 0 };
        let walls = [];
        let target = { x: SIZE/2, y: SIZE/2 };
        let game = {
            started: false,
            victory: false,
            startTime: 0,
            bestTime: localStorage.getItem('dedaloBestTime') ? parseFloat(localStorage.getItem('dedaloBestTime')) : null,
            casualMode: false
        };
        
        // Dados do labirinto (aberturas e grid)
        let openings = { top: 0, bottom: 0, left: 0, right: 0 };
        let OFFSET_X = 0, OFFSET_Y = 0, GRID_W = 0, GRID_H = 0, CELL_SIZE = 46, WALL_THICK = 10;
        
        // Controles de teclado
        let keys = {};
        
        // Arrasto (modo casual)
        let dragActive = false;
        let dragX = 0, dragY = 0;
        
        // Elementos DOM
        const timerEl = document.getElementById('timer');
        const bestEl = document.getElementById('best');
        const modeToggle = document.getElementById('modeToggle');
        const resetBtn = document.getElementById('resetBtn');
        const dpadDiv = document.getElementById('dpad');
        
        // Atualiza exibição do melhor tempo
        function updateBestDisplay() {
            if (game.bestTime !== null) {
                const mins = Math.floor(game.bestTime / 60);
                const secs = Math.floor(game.bestTime % 60);
                bestEl.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            } else {
                bestEl.innerText = "---";
            }
        }
        updateBestDisplay();
        
        // ---------- GERADOR DE LABIRINTO (DFS com aberturas) ----------
        function generateMaze() {
            const GRID_W = Math.floor(SIZE / CELL_SIZE);
            const GRID_H = GRID_W;
            OFFSET_X = (SIZE - GRID_W * CELL_SIZE) / 2;
            OFFSET_Y = (SIZE - GRID_H * CELL_SIZE) / 2;
            
            // Inicializa células e paredes internas
            let cells = Array(GRID_H).fill().map(() => Array(GRID_W).fill(false));
            let wallsGrid = Array(GRID_H).fill().map(() => Array(GRID_W).fill().map(() => ({ right: true, bottom: true })));
            
            function carve(x, y) {
                cells[y][x] = true;
                const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
                for (let i = dirs.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
                }
                for (let [dx, dy] of dirs) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && !cells[ny][nx]) {
                        if (dx === 1) wallsGrid[y][x].right = false;
                        else if (dx === -1) wallsGrid[y][nx].right = false;
                        else if (dy === 1) wallsGrid[y][x].bottom = false;
                        else if (dy === -1) wallsGrid[ny][x].bottom = false;
                        carve(nx, ny);
                    }
                }
            }
            carve(Math.floor(GRID_W/2), Math.floor(GRID_H/2));
            
            // Gera aberturas aleatórias em cada borda
            openings = {
                top: Math.floor(Math.random() * GRID_W),
                bottom: Math.floor(Math.random() * GRID_W),
                left: Math.floor(Math.random() * GRID_H),
                right: Math.floor(Math.random() * GRID_H)
            };
            
            // Converte para lista de paredes
            let newWalls = [];
            const addWall = (x, y, w, h, type) => {
                if (w <= 0 || h <= 0) return;
                newWalls.push({ x, y, w, h, type });
            };
            
            // Paredes internas
            for (let row = 0; row < GRID_H; row++) {
                for (let col = 0; col < GRID_W; col++) {
                    const cx = OFFSET_X + col * CELL_SIZE;
                    const cy = OFFSET_Y + row * CELL_SIZE;
                    if (wallsGrid[row][col].right) {
                        let type = Math.random() < 0.3 ? 1 : 0; // 1 = repulsiva (verde claro)
                        addWall(cx + CELL_SIZE, cy, WALL_THICK, CELL_SIZE, type);
                    }
                    if (wallsGrid[row][col].bottom) {
                        let type = Math.random() < 0.3 ? 1 : 0;
                        addWall(cx, cy + CELL_SIZE, CELL_SIZE, WALL_THICK, type);
                    }
                }
            }
            
            // Bordas (apenas onde não há abertura)
            // Topo
            for (let col = 0; col < GRID_W; col++) {
                if (col !== openings.top) {
                    addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y, CELL_SIZE, WALL_THICK, 0);
                }
            }
            // Base
            for (let col = 0; col < GRID_W; col++) {
                if (col !== openings.bottom) {
                    addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y + GRID_H*CELL_SIZE - WALL_THICK, CELL_SIZE, WALL_THICK, 0);
                }
            }
            // Esquerda
            for (let row = 0; row < GRID_H; row++) {
                if (row !== openings.left) {
                    addWall(OFFSET_X, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 0);
                }
            }
            // Direita
            for (let row = 0; row < GRID_H; row++) {
                if (row !== openings.right) {
                    addWall(OFFSET_X + GRID_W*CELL_SIZE - WALL_THICK, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 0);
                }
            }
            
            // Remove paredes próximas ao alvo central
            newWalls = newWalls.filter(w => {
                const centerX = w.x + w.w/2;
                const centerY = w.y + w.h/2;
                return Math.hypot(centerX - SIZE/2, centerY - SIZE/2) > TARGET_RADIUS + 12;
            });
            
            walls = newWalls;
        }
        
        // Posição das aberturas (centro da lacuna)
        function getOpeningPosition(side) {
            const GRID_W = Math.floor(SIZE / CELL_SIZE);
            const GRID_H = GRID_W;
            switch(side) {
                case 'top': return { x: OFFSET_X + openings.top * CELL_SIZE + CELL_SIZE/2, y: OFFSET_Y + 3 };
                case 'bottom': return { x: OFFSET_X + openings.bottom * CELL_SIZE + CELL_SIZE/2, y: OFFSET_Y + GRID_H*CELL_SIZE - 3 };
                case 'left': return { x: OFFSET_X + 3, y: OFFSET_Y + openings.left * CELL_SIZE + CELL_SIZE/2 };
                case 'right': return { x: OFFSET_X + GRID_W*CELL_SIZE - 3, y: OFFSET_Y + openings.right * CELL_SIZE + CELL_SIZE/2 };
                default: return { x: 0, y: 0 };
            }
        }
        
        // Spawn inicial: escolhe uma abertura aleatória
        function randomSpawn() {
            const sides = ['top', 'bottom', 'left', 'right'];
            const side = sides[Math.floor(Math.random() * 4)];
            const pos = getOpeningPosition(side);
            ball.x = pos.x;
            ball.y = pos.y;
            ball.vx = 0;
            ball.vy = 0;
        }
        
        // ---------- COLISÃO COM PAREDES (genérica) ----------
        function resolveCollision(circle, r) {
            for (let w of walls) {
                let cx = Math.max(w.x, Math.min(circle.x, w.x + w.w));
                let cy = Math.max(w.y, Math.min(circle.y, w.y + w.h));
                let dx = circle.x - cx, dy = circle.y - cy;
                let dist = Math.hypot(dx, dy);
                if (dist < r) {
                    let overlap = r - dist;
                    if (dist === 0) {
                        circle.x -= 1;
                        dx = -1;
                        dist = 1;
                    }
                    circle.x += (dx / dist) * overlap;
                    circle.y += (dy / dist) * overlap;
                    // Aplica repulsão (modo clássico) ou apenas bloqueio (casual)
                    if (!game.casualMode) {
                        if (w.type === 1) {
                            ball.vx *= -1.2;
                            ball.vy *= -1.2;
                        } else {
                            if (Math.abs(dx) > Math.abs(dy)) ball.vx *= -0.5;
                            else ball.vy *= -0.5;
                        }
                    } else {
                        // No modo casual, apenas reposiciona sem impulso
                        ball.vx = 0;
                        ball.vy = 0;
                    }
                }
            }
        }
        
        // ---------- TELEPORTE NAS ABERTURAS ----------
        function handleTeleport() {
            if (game.victory) return;
            const tolerance = BALL_RADIUS * 1.2;
            const GRID_W = Math.floor(SIZE / CELL_SIZE);
            const GRID_H = GRID_W;
            
            // Sair pela esquerda
            if (ball.x + BALL_RADIUS < 0) {
                const openingY = OFFSET_Y + openings.left * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ball.y - openingY) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('right');
                    ball.x = target.x;
                    ball.y = target.y;
                    ball.vx = Math.abs(ball.vx);
                } else {
                    ball.x = BALL_RADIUS;
                    ball.vx = 0;
                }
            }
            // Sair pela direita
            if (ball.x - BALL_RADIUS > SIZE) {
                const openingY = OFFSET_Y + openings.right * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ball.y - openingY) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('left');
                    ball.x = target.x;
                    ball.y = target.y;
                    ball.vx = -Math.abs(ball.vx);
                } else {
                    ball.x = SIZE - BALL_RADIUS;
                    ball.vx = 0;
                }
            }
            // Sair pelo topo
            if (ball.y + BALL_RADIUS < 0) {
                const openingX = OFFSET_X + openings.top * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ball.x - openingX) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('bottom');
                    ball.x = target.x;
                    ball.y = target.y;
                    ball.vy = Math.abs(ball.vy);
                } else {
                    ball.y = BALL_RADIUS;
                    ball.vy = 0;
                }
            }
            // Sair pela base
            if (ball.y - BALL_RADIUS > SIZE) {
                const openingX = OFFSET_X + openings.bottom * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ball.x - openingX) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('top');
                    ball.x = target.x;
                    ball.y = target.y;
                    ball.vy = -Math.abs(ball.vy);
                } else {
                    ball.y = SIZE - BALL_RADIUS;
                    ball.vy = 0;
                }
            }
        }
        
        // ---------- MODO CLÁSSICO (física) ----------
        function updateClassic(dt) {
            let ax = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
            let ay = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
            let moving = (ax !== 0 || ay !== 0);
            if (moving && !game.started && !game.victory) {
                game.started = true;
                game.startTime = performance.now();
            }
            const ACC = 1200;
            ball.vx += ax * ACC * dt;
            ball.vy += ay * ACC * dt;
            ball.vx *= 0.95;
            ball.vy *= 0.95;
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            
            resolveCollision(ball, BALL_RADIUS);
            handleTeleport();
        }
        
        // ---------- MODO CASUAL (arrasto contínuo) ----------
        function updateCasual(dt) {
            if (dragActive) {
                if (!game.started && !game.victory) {
                    game.started = true;
                    game.startTime = performance.now();
                }
                // Movimento passo a passo para evitar atravessar paredes
                let dx = dragX - ball.x;
                let dy = dragY - ball.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 1) {
                    let steps = Math.ceil(dist / 2);
                    for (let i = 0; i < steps; i++) {
                        let moveX = (dx / dist) * Math.min(2, dist/steps);
                        let moveY = (dy / dist) * Math.min(2, dist/steps);
                        ball.x += moveX;
                        ball.y += moveY;
                        resolveCollision(ball, BALL_RADIUS);
                    }
                }
            }
            handleTeleport();
        }
        
        // ---------- LÓGICA DE VITÓRIA ----------
        function checkVictory() {
            if (game.victory) return;
            const dist = Math.hypot(ball.x - target.x, ball.y - target.y);
            if (dist < BALL_RADIUS + 5) {
                game.victory = true;
                const elapsed = (performance.now() - game.startTime) / 1000;
                if (game.bestTime === null || elapsed < game.bestTime) {
                    game.bestTime = elapsed;
                    localStorage.setItem('dedaloBestTime', elapsed);
                    updateBestDisplay();
                }
                timerEl.innerText = elapsed.toFixed(1) + " s";
                // Efeito de queda e fogos (simples)
                setTimeout(() => {
                    resetGame(true);
                }, 2000);
            }
        }
        
        // ---------- RESET DO JOGO ----------
        function resetGame(newMaze = true) {
            game.victory = false;
            game.started = false;
            game.startTime = 0;
            timerEl.innerText = "0.0 s";
            if (newMaze) {
                generateMaze();
            }
            randomSpawn();
            ball.vx = 0;
            ball.vy = 0;
            dragActive = false;
        }
        
        // ---------- RENDERIZAÇÃO ----------
        function draw() {
            ctx.clearRect(0, 0, SIZE, SIZE);
            ctx.fillStyle = "#1e2a32";
            ctx.fillRect(0, 0, SIZE, SIZE);
            
            // Paredes
            for (let w of walls) {
                ctx.fillStyle = w.type === 1 ? "#8bc34a" : "#2d5a3b";
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = w.type === 1 ? "#6a9e3a" : "#1f3e2a";
                ctx.fillRect(w.x+2, w.y+2, w.w-4, w.h-4);
                ctx.strokeStyle = "#1e2a1a";
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            }
            
            // Alvo central
            ctx.beginPath();
            ctx.arc(target.x, target.y, TARGET_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = "#8B0000";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(target.x, target.y, TARGET_RADIUS-5, 0, Math.PI*2);
            ctx.fillStyle = "#FF4500";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(target.x, target.y, TARGET_RADIUS-10, 0, Math.PI*2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(target.x, target.y, 5, 0, Math.PI*2);
            ctx.fillStyle = "#FFF8DC";
            ctx.fill();
            
            // Bola
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 8;
            const grad = ctx.createRadialGradient(ball.x-4, ball.y-4, 4, ball.x, ball.y, BALL_RADIUS);
            grad.addColorStop(0, "#f4f8ff");
            grad.addColorStop(0.5, "#b5c4d4");
            grad.addColorStop(1, "#7a8a9a");
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(ball.x-3, ball.y-4, 4, 0, Math.PI*2);
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }
        
        // ---------- LOOP PRINCIPAL ----------
        let lastTimestamp = 0;
        function gameLoop(now) {
            if (!lastTimestamp) lastTimestamp = now;
            let dt = Math.min(0.033, (now - lastTimestamp) / 1000);
            if (dt > 0.01) {
                if (!game.victory) {
                    if (game.casualMode) {
                        updateCasual(dt);
                    } else {
                        updateClassic(dt);
                    }
                    checkVictory();
                    if (game.started && !game.victory) {
                        const elapsed = (performance.now() - game.startTime) / 1000;
                        timerEl.innerText = elapsed.toFixed(1) + " s";
                    }
                }
                draw();
            }
            lastTimestamp = now;
            requestAnimationFrame(gameLoop);
        }
        
        // ---------- EVENTOS DE ENTRADA ----------
        window.addEventListener('keydown', (e) => {
            if (game.casualMode) return;
            const k = e.key;
            if (k === 'ArrowLeft' || k === 'a' || k === 'ArrowRight' || k === 'd' || k === 'ArrowUp' || k === 'w' || k === 'ArrowDown' || k === 's') {
                keys[k] = true;
                e.preventDefault();
            } else if (k === 'r') {
                resetGame(true);
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key;
            delete keys[k];
        });
        
        // Botões D-pad
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        
        function attachButton(btn, key) {
            if (!btn) return;
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('mouseup', () => { delete keys[key]; });
            btn.addEventListener('mouseleave', () => { delete keys[key]; });
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', () => { delete keys[key]; });
            btn.addEventListener('touchcancel', () => { delete keys[key]; });
        }
        attachButton(btnUp, 'ArrowUp');
        attachButton(btnDown, 'ArrowDown');
        attachButton(btnLeft, 'ArrowLeft');
        attachButton(btnRight, 'ArrowRight');
        
        // Arrasto no canvas (modo casual)
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;
            x = Math.min(Math.max(x, BALL_RADIUS), SIZE - BALL_RADIUS);
            y = Math.min(Math.max(y, BALL_RADIUS), SIZE - BALL_RADIUS);
            return { x, y };
        }
        
        canvas.addEventListener('touchstart', (e) => { if (game.casualMode) { e.preventDefault(); const p = getCanvasCoords(e); dragActive = true; dragX = p.x; dragY = p.y; } });
        canvas.addEventListener('touchmove', (e) => { if (game.casualMode) { e.preventDefault(); const p = getCanvasCoords(e); dragX = p.x; dragY = p.y; } });
        canvas.addEventListener('touchend', () => { dragActive = false; });
        canvas.addEventListener('mousedown', (e) => { if (game.casualMode) { e.preventDefault(); const p = getCanvasCoords(e); dragActive = true; dragX = p.x; dragY = p.y; } });
        window.addEventListener('mousemove', (e) => { if (game.casualMode && dragActive) { const p = getCanvasCoords(e); dragX = p.x; dragY = p.y; } });
        window.addEventListener('mouseup', () => { dragActive = false; });
        
        // Alternância de modo
        modeToggle.addEventListener('change', (e) => {
            game.casualMode = e.target.checked;
            dpadDiv.style.display = game.casualMode ? 'none' : 'grid';
            resetGame(false);
        });
        
        // Botão reset
        resetBtn.addEventListener('click', () => resetGame(true));
        resetBtn.addEventListener('touchstart', (e) => { e.preventDefault(); resetGame(true); });
        
        // Inicialização
        generateMaze();
        randomSpawn();
        game.casualMode = false;
        modeToggle.checked = false;
        dpadDiv.style.display = 'grid';
        
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
