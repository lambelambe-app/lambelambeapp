<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Labirinto Metálico | Bola ao Centro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            padding: 16px;
            margin: 0;
        }

        /* Container principal - responsivo e elegante */
        .game-container {
            background: rgba(10, 20, 28, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 20px 20px 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255, 255, 255, 0.05);
            cursor: pointer;
            width: 100%;
            height: auto;
        }

        /* Painel de controle touch / desktop */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .dpad-row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .ctrl-btn {
            background: rgba(25, 35, 45, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 150, 0.5);
            border-radius: 60px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255,255,255,0.2);
            transition: all 0.05s linear;
            cursor: pointer;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            background: rgba(45, 60, 75, 0.95);
        }

        .reset-btn {
            background: rgba(200, 80, 60, 0.9);
            border-color: #ffbc7a;
            width: 80px;
            font-size: 28px;
            backdrop-filter: blur(8px);
        }

        .reset-btn:active {
            transform: translateY(4px);
        }

        .status {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 60px;
            color: #FFE5B4;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.9rem;
            text-align: center;
            border: 1px solid rgba(255, 220, 140, 0.5);
            margin-top: 16px;
            display: inline-block;
            width: auto;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width: 560px) {
            .ctrl-btn {
                width: 55px;
                height: 55px;
                font-size: 28px;
            }
            .dpad-row {
                gap: 12px;
            }
            .game-container {
                padding: 12px;
            }
            .status {
                font-size: 0.75rem;
                padding: 4px 16px;
            }
        }

        @media (max-width: 420px) {
            .ctrl-btn {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #9aaebf;
            margin-top: 16px;
            opacity: 0.7;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div>
    <div class="game-container">
        <div id="gameCanvas"></div>
        <div class="controls">
            <div class="dpad">
                <div class="dpad-row">
                    <div class="ctrl-btn" id="btnUp">▲</div>
                </div>
                <div class="dpad-row">
                    <div class="ctrl-btn" id="btnLeft">◀</div>
                    <div class="ctrl-btn" id="btnDown">▼</div>
                    <div class="ctrl-btn" id="btnRight">▶</div>
                </div>
            </div>
            <div class="ctrl-btn reset-btn" id="btnReset">⟳</div>
        </div>
        <div class="info-panel">
            <div class="status" id="gameStatus">✨ mova a bola até o centro ✨</div>
        </div>
        <footer>Toque nos botões ou use as setas do teclado</footer>
    </div>
</div>

<script>
    (function() {
        // ======================= CONFIGURAÇÕES DO JOGO ========================
        // Tamanho fixo do labirinto (600x600)
        const MAZE_SIZE = 600;
        const BALL_RADIUS = 14;
        const HOLE_RADIUS = 16;
        
        // Pontos de spawn aleatórios (nas bordas, nas aberturas do labirinto)
        const SPAWN_POINTS = [
            { x: 32, y: MAZE_SIZE / 2 },        // esquerda (abertura)
            { x: MAZE_SIZE - 32, y: MAZE_SIZE / 2 }, // direita
            { x: MAZE_SIZE / 2, y: 32 },        // topo
            { x: MAZE_SIZE / 2, y: MAZE_SIZE - 32 }  // base
        ];
        
        // Velocidade e física da bola (aceleração e arrasto)
        const ACC_FORCE = 380;
        const MAX_SPEED = 480;
        const DRAG_AIR = 0.98;      // atrito linear
        
        // Variáveis de controle de direção (teclado + botões)
        let moveLeft = false;
        let moveRight = false;
        let moveUp = false;
        let moveDown = false;
        
        // Referências globais para a cena
        let gameScene = null;
        let currentGame = null;
        
        // Estado de vitória (evita múltiplas triggers)
        let victoryActive = false;
        
        // ======================= CLASSE PRINCIPAL DO JOGO (CENA PHASER) =======================
        class MazeGameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'MazeGame' });
            }
            
            preload() {
                // Criar texturas proceduralmente (design clean sem assets externos)
                this.createTextures();
            }
            
            createTextures() {
                // Textura da bola metálica (gradiente radial + brilho)
                const ballGraphics = this.make.graphics({ x: 0, y: 0, add: false });
                ballGraphics.clear();
                // sombra suave
                ballGraphics.beginPath();
                ballGraphics.arc(BALL_RADIUS, BALL_RADIUS, BALL_RADIUS, 0, Math.PI * 2);
                ballGraphics.fillStyle(0x000000, 0.25);
                ballGraphics.fill();
                // corpo metálico
                ballGraphics.beginPath();
                ballGraphics.arc(BALL_RADIUS-2, BALL_RADIUS-2, BALL_RADIUS-1, 0, Math.PI * 2);
                const gradient = ballGraphics.createLinearGradient(4, 4, BALL_RADIUS*1.2, BALL_RADIUS*1.2);
                gradient.addColorStop(0, '#e0e8f0');
                gradient.addColorStop(0.5, '#9aaec0');
                gradient.addColorStop(1, '#4e6278');
                ballGraphics.fillStyle(gradient);
                ballGraphics.fill();
                // brilho especular
                ballGraphics.beginPath();
                ballGraphics.arc(BALL_RADIUS-4, BALL_RADIUS-5, 5, 0, Math.PI * 2);
                ballGraphics.fillStyle(0xffffff, 0.5);
                ballGraphics.fill();
                ballGraphics.generateTexture('metalBall', BALL_RADIUS*2, BALL_RADIUS*2);
                
                // Textura do buraco (centro) - aspecto escuro com anel
                const holeGraphics = this.make.graphics({ x: 0, y: 0, add: false });
                holeGraphics.clear();
                holeGraphics.beginPath();
                holeGraphics.arc(HOLE_RADIUS, HOLE_RADIUS, HOLE_RADIUS, 0, Math.PI*2);
                holeGraphics.fillStyle(0x111820);
                holeGraphics.fill();
                holeGraphics.beginPath();
                holeGraphics.arc(HOLE_RADIUS, HOLE_RADIUS, HOLE_RADIUS-3, 0, Math.PI*2);
                holeGraphics.fillStyle(0x2a3a44);
                holeGraphics.fill();
                holeGraphics.beginPath();
                holeGraphics.arc(HOLE_RADIUS, HOLE_RADIUS, HOLE_RADIUS-6, 0, Math.PI*2);
                holeGraphics.fillStyle(0x050a0f);
                holeGraphics.fill();
                holeGraphics.generateTexture('hole', HOLE_RADIUS*2, HOLE_RADIUS*2);
                
                // Textura parede elegante (com bevel)
                const wallGraphics = this.make.graphics({ x: 0, y: 0, add: false });
                wallGraphics.fillStyle(0x2c3e44);
                wallGraphics.fillRect(0, 0, 20, 20);
                wallGraphics.fillStyle(0x1e2e36);
                wallGraphics.fillRect(2, 2, 16, 16);
                wallGraphics.generateTexture('wallTile', 20, 20);
            }
            
            create() {
                victoryActive = false;
                // Define fundo com grid suave
                this.cameras.main.setBackgroundColor('#101f2b');
                
                // Grupo de paredes estáticas (física)
                this.walls = this.physics.add.staticGroup();
                
                // ========== 1. Construção do Labirinto elegante ==========
                // Método: desenhar bordas + paredes internas estratégicas garantindo caminho viável
                this.buildMaze();
                
                // ========== 2. Buraco no centro ==========
                this.hole = this.add.sprite(MAZE_SIZE/2, MAZE_SIZE/2, 'hole');
                this.hole.setDisplaySize(HOLE_RADIUS*2, HOLE_RADIUS*2);
                this.physics.add.existing(this.hole, false);
                this.hole.body.setCircle(HOLE_RADIUS);
                this.hole.body.setImmovable(true);
                this.hole.body.setEnable(false);  // sem colisão física só overlap
                
                // ========== 3. Bola metálica (jogador) ==========
                this.ball = this.physics.add.sprite(MAZE_SIZE/2, MAZE_SIZE/2, 'metalBall');
                this.ball.setDisplaySize(BALL_RADIUS*2, BALL_RADIUS*2);
                this.ball.setCircle(BALL_RADIUS);
                this.ball.setCollideWorldBounds(false);
                this.ball.setBounce(0.25);
                this.ball.setDrag(DRAG_AIR);
                this.ball.setMaxVelocity(MAX_SPEED, MAX_SPEED);
                
                // Colisão com paredes
                this.physics.add.collider(this.ball, this.walls, null, null, this);
                
                // Overlap com buraco (vitória)
                this.physics.add.overlap(this.ball, this.hole, this.winGame, null, this);
                
                // Spawn inicial aleatório
                this.randomSpawn();
                
                // Ajustes visuais: brilho na bola (efeito de brilho)
                this.ball.setPipeline('Light2D');
                
                // Adicionar pequena luz ambiente (efeito clean)
                this.lights.enable();
                this.lights.setAmbientColor(0x335566);
                const light = this.lights.addLight(MAZE_SIZE/2, MAZE_SIZE/2, 180, 0xffaa77, 0.4);
                this.lights.addLight(100, 100, 120, 0x88aaff, 0.3);
                this.lights.addLight(500, 500, 120, 0x88aaff, 0.3);
                
                // Animações sutis no buraco
                this.tweens.add({
                    targets: this.hole,
                    scaleX: 1.05,
                    scaleY: 1.05,
                    duration: 1200,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
            }
            
            buildMaze() {
                // Paredes bem estruturadas: bordas com aberturas + caminho desafiador porém justo
                const wallWidth = 18;
                
                // --- Borda superior (com abertura no centro) ---
                this.addWallRect(0, 0, MAZE_SIZE, wallWidth);
                this.addWallRect(0, 0, wallWidth, MAZE_SIZE);
                this.addWallRect(MAZE_SIZE - wallWidth, 0, wallWidth, MAZE_SIZE);
                this.addWallRect(0, MAZE_SIZE - wallWidth, MAZE_SIZE, wallWidth);
                
                // Remover pequenas seções das bordas para criar as 4 entradas (spawn points)
                // Limpeza das aberturas nas bordas (usando overrides: recortar usando objetos vazios? melhor criar paredes segmentadas)
                // Para maior elegância, recriamos as bordas com cortes:
                this.walls.clear(true); // reseta grupo e recria com precisão
                
                // Recria paredes de borda com aberturas estrategicas
                // Superior: duas partes (esquerda e direita da abertura)
                this.addWallRect(0, 0, MAZE_SIZE/2 - 42, wallWidth);
                this.addWallRect(MAZE_SIZE/2 + 38, 0, MAZE_SIZE/2 - 38, wallWidth);
                // Inferior:
                this.addWallRect(0, MAZE_SIZE - wallWidth, MAZE_SIZE/2 - 42, wallWidth);
                this.addWallRect(MAZE_SIZE/2 + 38, MAZE_SIZE - wallWidth, MAZE_SIZE/2 - 38, wallWidth);
                // Esquerda:
                this.addWallRect(0, 0, wallWidth, MAZE_SIZE/2 - 42);
                this.addWallRect(0, MAZE_SIZE/2 + 38, wallWidth, MAZE_SIZE/2 - 38);
                // Direita:
                this.addWallRect(MAZE_SIZE - wallWidth, 0, wallWidth, MAZE_SIZE/2 - 42);
                this.addWallRect(MAZE_SIZE - wallWidth, MAZE_SIZE/2 + 38, wallWidth, MAZE_SIZE/2 - 38);
                
                // --- LABIRINTO INTERIOR (design que cria caminho sinuoso até o centro) ---
                // Parede vertical esquerda central (bloqueia acesso direto)
                this.addWallRect(140, 80, 16, 220);
                this.addWallRect(140, 340, 16, 180);
                // Parede vertical direita central
                this.addWallRect(440, 100, 16, 200);
                this.addWallRect(440, 340, 16, 180);
                // Parede horizontal superior (cria corredor)
                this.addWallRect(200, 150, 200, 16);
                // Parede horizontal inferior
                this.addWallRect(200, 430, 200, 16);
                // Bloco obstáculo interno esquerdo
                this.addWallRect(70, 220, 60, 16);
                this.addWallRect(70, 360, 60, 16);
                // Bloco obstáculo direito
                this.addWallRect(470, 220, 60, 16);
                this.addWallRect(470, 360, 60, 16);
                // Parede em "L" no quadrante inferior esquerdo
                this.addWallRect(80, 480, 120, 16);
                this.addWallRect(180, 480, 16, 80);
                // Parede no quadrante superior direito 
                this.addWallRect(400, 80, 120, 16);
                this.addWallRect(400, 80, 16, 80);
                
                // Detalhe extra: pequenas ilhas para dificultar linha reta até o centro
                this.addWallRect(280, 240, 40, 16);
                this.addWallRect(280, 340, 40, 16);
                this.addWallRect(340, 280, 16, 60);
                
                // Cria um "anel" interno suave ao redor do centro (não bloqueia totalmente)
                this.addWallRect(240, 260, 120, 12);
                this.addWallRect(240, 328, 120, 12);
                this.addWallRect(260, 272, 12, 56);
                this.addWallRect(328, 272, 12, 56);
                
                // Adiciona estilo visual nas paredes (textura)
                this.walls.getChildren().forEach(wall => {
                    wall.setTexture('wallTile');
                    wall.setDisplaySize(wall.width, wall.height);
                    wall.setAlpha(0.92);
                    wall.setDepth(1);
                });
            }
            
            addWallRect(x, y, w, h) {
                if (w <= 0 || h <= 0) return;
                const wall = this.walls.create(x, y, 'wallTile');
                wall.setOrigin(0, 0);
                wall.displayWidth = w;
                wall.displayHeight = h;
                wall.refreshBody();
                wall.body.updateCenter();
                return wall;
            }
            
            randomSpawn() {
                // Escolhe um ponto de spawn aleatório das bordas
                const randIndex = Math.floor(Math.random() * SPAWN_POINTS.length);
                const spawn = SPAWN_POINTS[randIndex];
                this.ball.setPosition(spawn.x, spawn.y);
                this.ball.setVelocity(0, 0);
                this.ball.setAcceleration(0, 0);
                // Pequeno efeito de "drop" visual
                this.cameras.main.flash(200, 100, 140, 180, false);
            }
            
            winGame() {
                if (victoryActive) return;
                victoryActive = true;
                // Congela movimentos e mostra vitória
                moveLeft = moveRight = moveUp = moveDown = false;
                this.ball.setVelocity(0, 0);
                this.ball.setAcceleration(0, 0);
                const statusDiv = document.getElementById('gameStatus');
                if (statusDiv) statusDiv.innerHTML = '🏆 VITÓRIA! 🏆  Bola no buraco!';
                statusDiv.style.background = "rgba(210, 170, 80, 0.9)";
                // Efeito partículas simples
                this.showVictoryEffect();
                // Reinicia após 1.5 segundos
                this.time.delayedCall(1500, () => {
                    this.resetGame();
                    if (statusDiv) {
                        statusDiv.innerHTML = '✨ mova a bola até o centro ✨';
                        statusDiv.style.background = "rgba(0, 0, 0, 0.6)";
                    }
                    victoryActive = false;
                }, [], this);
            }
            
            showVictoryEffect() {
                // brilho rápido no centro
                this.tweens.add({
                    targets: this.hole,
                    scaleX: 1.35,
                    scaleY: 1.35,
                    duration: 300,
                    yoyo: true,
                    ease: 'Back.Out'
                });
                // criar estrelas / círculos ao redor
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const x = this.hole.x + Math.cos(angle) * 32;
                    const y = this.hole.y + Math.sin(angle) * 32;
                    const spark = this.add.circle(x, y, 4, 0xffcc77, 0.9);
                    this.tweens.add({
                        targets: spark,
                        scaleX: 0.2,
                        scaleY: 2.5,
                        alpha: 0,
                        duration: 500,
                        onComplete: () => spark.destroy()
                    });
                }
            }
            
            resetGame() {
                this.randomSpawn();
                this.ball.setVelocity(0, 0);
                this.ball.setAcceleration(0, 0);
                // garante que flags de movimento sejam resetadas
                moveLeft = moveRight = moveUp = moveDown = false;
                victoryActive = false;
                // pequena animação de confirmação
                this.cameras.main.shake(100, 0.008);
            }
            
            update() {
                if (victoryActive) {
                    // Impede qualquer movimento durante vitória
                    this.ball.setAcceleration(0, 0);
                    this.ball.setVelocity(0, 0);
                    return;
                }
                
                // Aplica aceleração baseada nos inputs (suave e responsivo)
                let accX = 0;
                let accY = 0;
                if (moveLeft) accX = -ACC_FORCE;
                if (moveRight) accX = ACC_FORCE;
                if (moveUp) accY = -ACC_FORCE;
                if (moveDown) accY = ACC_FORCE;
                
                this.ball.setAcceleration(accX, accY);
                
                // Limita velocidade máxima manualmente (setMaxVelocity já cuida, mas reforço)
                if (Math.abs(this.ball.body.velocity.x) > MAX_SPEED) {
                    this.ball.body.velocity.x = Math.sign(this.ball.body.velocity.x) * MAX_SPEED;
                }
                if (Math.abs(this.ball.body.velocity.y) > MAX_SPEED) {
                    this.ball.body.velocity.y = Math.sign(this.ball.body.velocity.y) * MAX_SPEED;
                }
                
                // Pequeno efeito de rotação na bola (estético)
                this.ball.angle += this.ball.body.velocity.x * 0.3;
            }
        }
        
        // ======================= INICIALIZAÇÃO DO PHASER =======================
        const config = {
            type: Phaser.AUTO,
            parent: 'gameCanvas',
            width: MAZE_SIZE,
            height: MAZE_SIZE,
            backgroundColor: '#101f2b',
            scene: MazeGameScene,
            physics: {
                default: 'arcade',
                arcade: {
                    debug: false,
                    gravity: { x: 0, y: 0 },
                    fps: 60
                }
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: MAZE_SIZE,
                height: MAZE_SIZE
            },
            pixelArt: false,
            antialias: true,
            roundPixels: false,
            transparent: false
        };
        
        currentGame = new Phaser.Game(config);
        
        // Aguarda o jogo iniciar e captura referência da cena
        currentGame.events.on('ready', () => {
            setTimeout(() => {
                const scene = currentGame.scene.getScene('MazeGame');
                if (scene) gameScene = scene;
            }, 100);
        });
        
        // ======================= CONTROLES (TECLADO + TOUCH/ BOTÕES) =======================
        function handleKeyboard() {
            window.addEventListener('keydown', (e) => {
                const key = e.key;
                if (key === 'ArrowLeft' || key === 'Left' || key === 'a') {
                    moveLeft = true;
                    e.preventDefault();
                } else if (key === 'ArrowRight' || key === 'Right' || key === 'd') {
                    moveRight = true;
                    e.preventDefault();
                } else if (key === 'ArrowUp' || key === 'Up' || key === 'w') {
                    moveUp = true;
                    e.preventDefault();
                } else if (key === 'ArrowDown' || key === 'Down' || key === 's') {
                    moveDown = true;
                    e.preventDefault();
                } else if (key === 'r' || key === 'R') {
                    if (gameScene && !victoryActive) gameScene.resetGame();
                    e.preventDefault();
                }
            });
            
            window.addEventListener('keyup', (e) => {
                const key = e.key;
                if (key === 'ArrowLeft' || key === 'Left' || key === 'a') moveLeft = false;
                else if (key === 'ArrowRight' || key === 'Right' || key === 'd') moveRight = false;
                else if (key === 'ArrowUp' || key === 'Up' || key === 'w') moveUp = false;
                else if (key === 'ArrowDown' || key === 'Down' || key === 's') moveDown = false;
                e.preventDefault();
            });
        }
        
        function setupTouchAndButtons() {
            const btnUp = document.getElementById('btnUp');
            const btnDown = document.getElementById('btnDown');
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');
            const btnReset = document.getElementById('btnReset');
            
            const activate = (dir, state) => {
                if (dir === 'up') moveUp = state;
                if (dir === 'down') moveDown = state;
                if (dir === 'left') moveLeft = state;
                if (dir === 'right') moveRight = state;
            };
            
            const attach = (btn, dir) => {
                if (!btn) return;
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); activate(dir, true); });
                btn.addEventListener('mouseup', () => activate(dir, false));
                btn.addEventListener('mouseleave', () => activate(dir, false));
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); activate(dir, true); }, {passive: false});
                btn.addEventListener('touchend', (e) => { e.preventDefault(); activate(dir, false); });
                btn.addEventListener('touchcancel', (e) => { activate(dir, false); });
            };
            
            attach(btnUp, 'up');
            attach(btnDown, 'down');
            attach(btnLeft, 'left');
            attach(btnRight, 'right');
            
            if (btnReset) {
                btnReset.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (gameScene && !victoryActive) gameScene.resetGame();
                    else if (gameScene && victoryActive) {
                        // Força reset mesmo se vitória estiver ativa? Melhor aguardar, mas podemos reset rápido
                        if (gameScene.resetGame) gameScene.resetGame();
                    }
                });
                btnReset.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameScene) gameScene.resetGame(); });
            }
        }
        
        // Aguarda o gameScene ser criada
        function waitForScene() {
            const interval = setInterval(() => {
                if (currentGame && currentGame.scene && currentGame.scene.getScene('MazeGame')) {
                    gameScene = currentGame.scene.getScene('MazeGame');
                    clearInterval(interval);
                    // pequena ajuda extra: se quiser iniciar com spawn já aleatório
                    if(gameScene && gameScene.randomSpawn) gameScene.randomSpawn();
                }
            }, 200);
        }
        
        // Inicialização dos controles e assistência
        handleKeyboard();
        setupTouchAndButtons();
        waitForScene();
        
        // Previne scroll em telas touch enquanto usa os botões
        window.addEventListener('touchmove', function(e) {
            if (e.target.closest('.ctrl-btn')) e.preventDefault();
        }, { passive: false });
        
        // Responsividade extra: garantir que o canvas não ultrapasse os limites elegantes
        window.addEventListener('resize', () => {
            if (currentGame && currentGame.scale) currentGame.scale.refresh();
        });
    })();
</script>
</body>
</html>
