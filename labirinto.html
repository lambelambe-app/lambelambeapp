<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dédalo | Teletransporte pelas Aberturas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #666666;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        .game-container {
            background: rgba(20, 28, 38, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 20px 20px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 150, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            max-width: 100%;
            max-height: 95vh;
            overflow-y: auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
            gap: 16px;
        }
        .timer-panel, .best-panel, .reset-btn {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 100, 0.6);
            border-radius: 48px;
            padding: 4px 18px;
            text-align: center;
            min-width: 95px;
        }
        .timer-label, .best-label {
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: #c0b090;
        }
        .timer-value, .best-value {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            line-height: 1.2;
        }
        .best-value {
            color: #FFD966;
        }
        .reset-btn {
            cursor: pointer;
            transition: 0.05s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 4px 14px;
        }
        .reset-btn:active {
            transform: translateY(2px);
            background: rgba(180, 75, 55, 0.95);
        }
        .reset-icon {
            font-size: 1.3rem;
            font-weight: bold;
            color: #FFE5B4;
        }
        .reset-label {
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: #ffd7a0;
        }
        canvas {
            display: block;
            margin: 0 auto 28px auto;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 215, 150, 0.25);
            background-color: #1e2a32;
            cursor: pointer;
            width: 100%;
            height: auto;
        }
        .dpad-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 28px;
        }
        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .dpad-row {
            display: flex;
            gap: 18px;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(30, 40, 52, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 120, 0.7);
            border-radius: 60px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 2px 4px black;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.15);
            transition: 0.05s linear;
            cursor: pointer;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
            background: rgba(50, 65, 82, 0.95);
        }
        footer {
            text-align: center;
            font-size: 0.55rem;
            color: #aaa;
            margin-top: 16px;
            opacity: 0.7;
        }
        @media (max-width: 560px) {
            .ctrl-btn { width: 55px; height: 55px; font-size: 24px; }
            .dpad-row { gap: 12px; }
            .timer-panel, .best-panel, .reset-btn { padding: 2px 10px; min-width: 75px; }
            .timer-value, .best-value { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="top-bar">
            <div class="timer-panel">
                <div class="timer-label">⏱️ TEMPO</div>
                <div class="timer-value" id="timerDisplay">0.0 s</div>
            </div>
            <div class="best-panel">
                <div class="best-label">🏆 MELHOR</div>
                <div class="best-value" id="bestDisplay">---</div>
            </div>
            <div class="reset-btn" id="btnReset">
                <div class="reset-icon">⟳</div>
                <div class="reset-label">NOVO</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div class="dpad-wrapper">
            <div class="dpad">
                <div class="dpad-row"><div class="ctrl-btn" id="btnUp">▲</div></div>
                <div class="dpad-row">
                    <div class="ctrl-btn" id="btnLeft">◀</div>
                    <div class="ctrl-btn" id="btnDown">▼</div>
                    <div class="ctrl-btn" id="btnRight">▶</div>
                </div>
            </div>
        </div>
        <footer>aberturas nas bordas teletransportam para o lado oposto</footer>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const SIZE = 600;
        canvas.width = SIZE;
        canvas.height = SIZE;
        
        const BALL_RADIUS = 13;
        const TARGET_RADIUS = 20;
        
        let ballX = SIZE/2, ballY = SIZE/2;
        let velocityX = 0, velocityY = 0;
        const ACC = 400;
        const MAX_SPEED = 500;
        const DRAG = 0.98;
        
        let leftPressed = false, rightPressed = false, upPressed = false, downPressed = false;
        let victory = false;
        let victoryTimer = null;
        let isFalling = false;
        
        let gameStarted = false;
        let startTime = null;
        let currentTime = 0;
        
        let walls = [];
        const targetCenter = { x: SIZE/2, y: SIZE/2 };
        
        // Melhor tempo (anônimo)
        let bestTime = null;
        const bestDisplay = document.getElementById('bestDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        
        function loadBestTime() {
            const stored = localStorage.getItem('dedaloBestTime');
            if (stored !== null) {
                bestTime = parseFloat(stored);
                bestDisplay.innerText = bestTime.toFixed(2) + " s";
            } else {
                bestTime = null;
                bestDisplay.innerText = "---";
            }
        }
        function saveBestTime(timeSec) {
            if (bestTime === null || timeSec < bestTime) {
                bestTime = timeSec;
                localStorage.setItem('dedaloBestTime', bestTime);
                bestDisplay.innerText = bestTime.toFixed(2) + " s";
            }
        }
        
        // ---------- GERADOR DFS COM ABERTURAS ALEATÓRIAS (POSIÇÕES DAS LACUNAS) ----------
        const CELL_SIZE = 46;
        const WALL_THICK = 10;
        const GRID_W = Math.floor(SIZE / CELL_SIZE);  // 13
        const GRID_H = GRID_W;
        const OFFSET_X = (SIZE - GRID_W * CELL_SIZE) / 2;
        const OFFSET_Y = (SIZE - GRID_H * CELL_SIZE) / 2;
        
        let cells = [];
        let wallsGrid = [];
        
        function initDFS() {
            cells = Array(GRID_H).fill().map(() => Array(GRID_W).fill(false));
            wallsGrid = Array(GRID_H).fill().map(() => Array(GRID_W).fill().map(() => ({ right: true, bottom: true })));
            const startX = Math.floor(GRID_W/2);
            const startY = Math.floor(GRID_H/2);
            dfsCarve(startX, startY);
        }
        
        function dfsCarve(x, y) {
            cells[y][x] = true;
            const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
            for (let i = dirs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
            }
            for (let [dx, dy] of dirs) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && !cells[ny][nx]) {
                    if (dx === 1) wallsGrid[y][x].right = false;
                    else if (dx === -1) wallsGrid[y][nx].right = false;
                    else if (dy === 1) wallsGrid[y][x].bottom = false;
                    else if (dy === -1) wallsGrid[ny][x].bottom = false;
                    dfsCarve(nx, ny);
                }
            }
        }
        
        // Escolhe uma célula aleatória para a abertura em cada borda
        let openings = { top: 0, bottom: 0, left: 0, right: 0 };
        
        function generateRandomOpenings() {
            openings = {
                top: Math.floor(Math.random() * GRID_W),
                bottom: Math.floor(Math.random() * GRID_W),
                left: Math.floor(Math.random() * GRID_H),
                right: Math.floor(Math.random() * GRID_H)
            };
        }
        
        function buildWallsFromDFS() {
            walls = [];
            const addWall = (x, y, w, h, type) => {
                if (w <= 0 || h <= 0) return;
                walls.push({ x, y, w, h, type });
            };
            // Paredes internas (direita e inferior)
            for (let row = 0; row < GRID_H; row++) {
                for (let col = 0; col < GRID_W; col++) {
                    const cx = OFFSET_X + col * CELL_SIZE;
                    const cy = OFFSET_Y + row * CELL_SIZE;
                    if (wallsGrid[row][col].right) {
                        let type = Math.random() < 0.3 ? 'light' : 'dark';
                        addWall(cx + CELL_SIZE, cy, WALL_THICK, CELL_SIZE, type);
                    }
                    if (wallsGrid[row][col].bottom) {
                        let type = Math.random() < 0.3 ? 'light' : 'dark';
                        addWall(cx, cy + CELL_SIZE, CELL_SIZE, WALL_THICK, type);
                    }
                }
            }
            
            // Bordas com aberturas nas posições escolhidas
            // Superior
            for (let col = 0; col < GRID_W; col++) {
                if (col !== openings.top) {
                    addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y, CELL_SIZE, WALL_THICK, 'dark');
                }
            }
            // Inferior
            for (let col = 0; col < GRID_W; col++) {
                if (col !== openings.bottom) {
                    addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y + GRID_H*CELL_SIZE - WALL_THICK, CELL_SIZE, WALL_THICK, 'dark');
                }
            }
            // Esquerda
            for (let row = 0; row < GRID_H; row++) {
                if (row !== openings.left) {
                    addWall(OFFSET_X, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 'dark');
                }
            }
            // Direita
            for (let row = 0; row < GRID_H; row++) {
                if (row !== openings.right) {
                    addWall(OFFSET_X + GRID_W*CELL_SIZE - WALL_THICK, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 'dark');
                }
            }
            
            // Remove paredes muito próximas ao alvo central
            walls = walls.filter(w => Math.hypot(w.x + w.w/2 - targetCenter.x, w.y + w.h/2 - targetCenter.y) > TARGET_RADIUS + 12);
        }
        
        function generateNewMaze() {
            initDFS();
            generateRandomOpenings();
            buildWallsFromDFS();
        }
        
        // Retorna a posição central de uma abertura (para teletransporte)
        function getOpeningPosition(side) {
            switch(side) {
                case 'top':
                    return { x: OFFSET_X + openings.top * CELL_SIZE + CELL_SIZE/2, y: OFFSET_Y + 5 };
                case 'bottom':
                    return { x: OFFSET_X + openings.bottom * CELL_SIZE + CELL_SIZE/2, y: OFFSET_Y + GRID_H*CELL_SIZE - 5 };
                case 'left':
                    return { x: OFFSET_X + 5, y: OFFSET_Y + openings.left * CELL_SIZE + CELL_SIZE/2 };
                case 'right':
                    return { x: OFFSET_X + GRID_W*CELL_SIZE - 5, y: OFFSET_Y + openings.right * CELL_SIZE + CELL_SIZE/2 };
            }
        }
        
        // Spawn inicial: escolhe uma abertura aleatória
        function randomSpawn() {
            const sides = ['top', 'bottom', 'left', 'right'];
            const chosen = sides[Math.floor(Math.random() * 4)];
            const pos = getOpeningPosition(chosen);
            ballX = pos.x;
            ballY = pos.y;
            // Pequena correção para não spawnar colidindo com parede
            for (let attempt = 0; attempt < 5; attempt++) {
                let collides = false;
                for (let w of walls) {
                    if (ballX + BALL_RADIUS > w.x && ballX - BALL_RADIUS < w.x + w.w &&
                        ballY + BALL_RADIUS > w.y && ballY - BALL_RADIUS < w.y + w.h) {
                        collides = true;
                        break;
                    }
                }
                if (!collides) break;
                // Se colidiu, desloca um pouco
                ballX += (Math.random() - 0.5) * 15;
                ballY += (Math.random() - 0.5) * 15;
            }
        }
        
        // ---------- TELEPORTE ATRAVÉS DAS ABERTURAS ----------
        // Verifica se a bola está saindo pela borda na região exata da abertura e aplica teletransporte
        function handleTeleport() {
            if (victory) return;
            const tolerance = BALL_RADIUS * 1.5; // margem de detecção
            
            // Verifica saída pela esquerda (x < 0)
            if (ballX + BALL_RADIUS < 0) {
                const openingY = OFFSET_Y + openings.left * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballY - openingY) < CELL_SIZE/2 + tolerance) {
                    // Teleporta para a abertura direita (lado oposto)
                    const target = getOpeningPosition('right');
                    ballX = target.x;
                    ballY = target.y;
                    // Mantém a velocidade (opcional: inverte X para não ficar preso)
                    velocityX = Math.abs(velocityX);
                } else {
                    // Se não for na abertura, coloca de volta dentro
                    ballX = BALL_RADIUS;
                    velocityX = 0;
                }
            }
            // Verifica saída pela direita (x > SIZE)
            if (ballX - BALL_RADIUS > SIZE) {
                const openingY = OFFSET_Y + openings.right * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballY - openingY) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('left');
                    ballX = target.x;
                    ballY = target.y;
                    velocityX = -Math.abs(velocityX);
                } else {
                    ballX = SIZE - BALL_RADIUS;
                    velocityX = 0;
                }
            }
            // Verifica saída pela superior (y < 0)
            if (ballY + BALL_RADIUS < 0) {
                const openingX = OFFSET_X + openings.top * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballX - openingX) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('bottom');
                    ballX = target.x;
                    ballY = target.y;
                    velocityY = Math.abs(velocityY);
                } else {
                    ballY = BALL_RADIUS;
                    velocityY = 0;
                }
            }
            // Verifica saída pela inferior (y > SIZE)
            if (ballY - BALL_RADIUS > SIZE) {
                const openingX = OFFSET_X + openings.bottom * CELL_SIZE + CELL_SIZE/2;
                if (Math.abs(ballX - openingX) < CELL_SIZE/2 + tolerance) {
                    const target = getOpeningPosition('top');
                    ballX = target.x;
                    ballY = target.y;
                    velocityY = -Math.abs(velocityY);
                } else {
                    ballY = SIZE - BALL_RADIUS;
                    velocityY = 0;
                }
            }
        }
        
        // Colisão com paredes (ignora colisão com as bordas abertas, pois já tratamos teletransporte)
        function circleRectCollision(cx, cy, r, rect) {
            let closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
            let closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
            let dx = cx - closestX, dy = cy - closestY;
            return dx*dx + dy*dy < r*r;
        }
        
        function handleCollisions() {
            for (let w of walls) {
                if (circleRectCollision(ballX, ballY, BALL_RADIUS, w)) {
                    let closestX = Math.max(w.x, Math.min(ballX, w.x + w.w));
                    let closestY = Math.max(w.y, Math.min(ballY, w.y + w.h));
                    let dx = ballX - closestX, dy = ballY - closestY;
                    let dist = Math.hypot(dx, dy);
                    if (dist < BALL_RADIUS) {
                        let angle = Math.atan2(dy, dx);
                        let correction = BALL_RADIUS - dist;
                        ballX += Math.cos(angle) * correction;
                        ballY += Math.sin(angle) * correction;
                        if (w.type === 'light') {
                            velocityX = -velocityX * 1.3;
                            velocityY = -velocityY * 1.3;
                        } else {
                            if (Math.abs(dx) > Math.abs(dy)) velocityX *= -0.5;
                            else velocityY *= -0.5;
                        }
                    }
                }
            }
        }
        
        // Efeitos de queda e fogos
        function startFallingEffect(callback) {
            if (isFalling) return;
            isFalling = true;
            let step = 0;
            const origR = BALL_RADIUS;
            function anim() {
                if (step < 10) {
                    const scale = 1 - (step/10)*0.8;
                    const r = origR * scale;
                    ctx.save();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(ballX, ballY, r, 0, Math.PI*2);
                    ctx.fillStyle = "#7a8a9a";
                    ctx.fill();
                    ctx.restore();
                    step++;
                    requestAnimationFrame(anim);
                } else {
                    isFalling = false;
                    if (callback) callback();
                }
            }
            anim();
        }
        
        function startFireworks() {
            const particles = [];
            const cx = targetCenter.x, cy = targetCenter.y;
            for (let i=0;i<6;i++) {
                const a = Math.random() * Math.PI*2;
                const r = 40 + Math.random()*60;
                const x = cx + Math.cos(a)*r;
                const y = cy + Math.sin(a)*r - 40;
                particles.push({ x, y, vx: (Math.random()-0.5)*2, vy: -7, life:1, exploded:false });
            }
            function update() {
                for(let i=particles.length-1;i>=0;i--) {
                    const p = particles[i];
                    if(!p.exploded) {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                        if(p.vy >=0 || p.y<50) {
                            p.exploded = true;
                            for(let s=0;s<22;s++) {
                                const a2 = Math.random()*Math.PI*2;
                                const sp = Math.random()*5+2;
                                particles.push({
                                    x: p.x, y: p.y, vx: Math.cos(a2)*sp, vy: Math.sin(a2)*sp,
                                    life:1, exploded:true, color: `hsl(${Math.random()*360},100%,60%)`
                                });
                            }
                            particles.splice(i,1);
                        }
                    } else {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                        p.life -= 0.02;
                        if(p.life<=0 || p.y>SIZE+50) particles.splice(i,1);
                    }
                }
                for(let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.exploded?3*p.life:4, 0, Math.PI*2);
                    ctx.fillStyle = p.color || "#ffaa66";
                    ctx.fill();
                }
                if(particles.length>0) requestAnimationFrame(update);
            }
            update();
        }
        
        function checkWin() {
            if (victory) return;
            const dist = Math.hypot(ballX - targetCenter.x, ballY - targetCenter.y);
            if (dist < BALL_RADIUS + 5) {
                victory = true;
                const elapsed = currentTime;
                saveBestTime(elapsed);
                startFallingEffect(() => startFireworks());
                if (victoryTimer) clearTimeout(victoryTimer);
                victoryTimer = setTimeout(() => {
                    resetGame(true);
                    victory = false;
                    gameStarted = false;
                    startTime = null;
                    currentTime = 0;
                    timerDisplay.innerText = "0.0 s";
                }, 3500);
            }
        }
        
        function resetGame(newMaze=true) {
            if(victoryTimer) clearTimeout(victoryTimer);
            victory = false;
            gameStarted = false;
            startTime = null;
            currentTime = 0;
            timerDisplay.innerText = "0.0 s";
            if(newMaze) {
                generateNewMaze();
            }
            randomSpawn();
            velocityX = 0; velocityY = 0;
            leftPressed = rightPressed = upPressed = downPressed = false;
        }
        
        function updateTimerDisplay() {
            if (!victory && gameStarted && startTime) {
                currentTime = (performance.now() / 1000) - startTime;
                timerDisplay.innerText = currentTime.toFixed(1) + " s";
            } else if (!gameStarted) {
                timerDisplay.innerText = "0.0 s";
            }
            requestAnimationFrame(updateTimerDisplay);
        }
        
        function startTimerOnFirstMove() {
            if (!gameStarted && !victory && startTime === null) {
                gameStarted = true;
                startTime = performance.now() / 1000;
                currentTime = 0;
            }
        }
        
        // Física
        let lastTimePhysics = 0;
        function updatePhysics(delta) {
            if(victory) { 
                velocityX = 0; velocityY = 0; 
                return; 
            }
            let ax=0, ay=0;
            let moving = false;
            if(leftPressed) { ax = -ACC; moving = true; }
            if(rightPressed) { ax = ACC; moving = true; }
            if(upPressed) { ay = -ACC; moving = true; }
            if(downPressed) { ay = ACC; moving = true; }
            
            if (moving) startTimerOnFirstMove();
            
            velocityX += ax*delta;
            velocityY += ay*delta;
            let spd = Math.hypot(velocityX, velocityY);
            if(spd > MAX_SPEED) { velocityX = velocityX/spd*MAX_SPEED; velocityY = velocityY/spd*MAX_SPEED; }
            velocityX *= DRAG;
            velocityY *= DRAG;
            if(Math.abs(velocityX)<0.2) velocityX=0;
            if(Math.abs(velocityY)<0.2) velocityY=0;
            ballX += velocityX*delta;
            ballY += velocityY*delta;
            
            handleCollisions();     // colisão com paredes internas
            handleTeleport();       // teletransporte pelas aberturas
            checkWin();
        }
        
        function draw() {
            ctx.clearRect(0,0,SIZE,SIZE);
            ctx.fillStyle = "#1e2a32";
            ctx.fillRect(0,0,SIZE,SIZE);
            
            for(let w of walls) {
                if(w.type === 'dark') {
                    ctx.fillStyle = "#2d5a3b";
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.fillStyle = "#1f3e2a";
                    ctx.fillRect(w.x+2, w.y+2, w.w-4, w.h-4);
                } else {
                    ctx.fillStyle = "#8bc34a";
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.fillStyle = "#6a9e3a";
                    ctx.fillRect(w.x+2, w.y+2, w.w-4, w.h-4);
                }
                ctx.strokeStyle = "#1e2a1a";
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            }
            
            // Desenha o alvo central
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = "#8B0000";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS-5, 0, Math.PI*2);
            ctx.fillStyle = "#FF4500";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS-10, 0, Math.PI*2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, 5, 0, Math.PI*2);
            ctx.fillStyle = "#FFF8DC";
            ctx.fill();
            
            // Bola
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 8;
            const grad = ctx.createRadialGradient(ballX-4, ballY-4, 4, ballX, ballY, BALL_RADIUS);
            grad.addColorStop(0, "#f4f8ff");
            grad.addColorStop(0.5, "#b5c4d4");
            grad.addColorStop(1, "#7a8a9a");
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(ballX-3, ballY-4, 4, 0, Math.PI*2);
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }
        
        let lastFrame = 0;
        function gameLoop(now) {
            if(!lastFrame) lastFrame = now;
            let delta = Math.min(0.033, (now-lastFrame)/1000);
            if(delta>0.01) {
                updatePhysics(delta);
                draw();
            }
            lastFrame = now;
            requestAnimationFrame(gameLoop);
        }
        
        // Inicialização
        loadBestTime();
        generateNewMaze();
        randomSpawn();
        updateTimerDisplay();
        
        // Controles
        window.addEventListener('keydown', (e) => {
            const k = e.key;
            if(k === 'ArrowLeft' || k === 'a') { leftPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'ArrowRight' || k === 'd') { rightPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'ArrowUp' || k === 'w') { upPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'ArrowDown' || k === 's') { downPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'r') { resetGame(true); e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key;
            if(k === 'ArrowLeft' || k === 'a') leftPressed=false;
            else if(k === 'ArrowRight' || k === 'd') rightPressed=false;
            else if(k === 'ArrowUp' || k === 'w') upPressed=false;
            else if(k === 'ArrowDown' || k === 's') downPressed=false;
        });
        
        const attach = (btn, dir) => {
            if(!btn) return;
            const set = (active) => {
                if(dir==='up') upPressed=active;
                if(dir==='down') downPressed=active;
                if(dir==='left') leftPressed=active;
                if(dir==='right') rightPressed=active;
                if(active) startTimerOnFirstMove();
            };
            btn.addEventListener('mousedown', (e)=>{e.preventDefault(); set(true);});
            btn.addEventListener('mouseup', ()=>set(false));
            btn.addEventListener('mouseleave', ()=>set(false));
            btn.addEventListener('touchstart', (e)=>{e.preventDefault(); set(true);});
            btn.addEventListener('touchend', ()=>set(false));
            btn.addEventListener('touchcancel', ()=>set(false));
        };
        attach(document.getElementById('btnUp'), 'up');
        attach(document.getElementById('btnDown'), 'down');
        attach(document.getElementById('btnLeft'), 'left');
        attach(document.getElementById('btnRight'), 'right');
        
        const resetBtn = document.getElementById('btnReset');
        if(resetBtn) {
            resetBtn.addEventListener('click', ()=>resetGame(true));
            resetBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); resetGame(true);});
        }
        
        document.querySelectorAll('.ctrl-btn, .reset-btn').forEach(b => b.addEventListener('touchstart', e=>e.preventDefault()));
        document.body.addEventListener('touchmove', e=>{ if(e.target.closest('.ctrl-btn') || e.target===canvas) e.preventDefault(); }, {passive:false});
        
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
