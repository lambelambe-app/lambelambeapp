<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dédalo | Labirinto Metálico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fundo externo conforme solicitado (#666666) */
        body {
            background: #666666;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Container com efeito vidro escuro (contraste) */
        .game-container {
            background: rgba(20, 28, 38, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 20px 20px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 150, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            max-width: 100%;
            max-height: 95vh;
            overflow-y: auto;
        }

        canvas {
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 215, 150, 0.25);
            background-color: #1e2a32;
            cursor: pointer;
            width: 100%;
            height: auto;
        }

        /* D-pad centralizado */
        .dpad-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 16px;
        }
        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .dpad-row {
            display: flex;
            gap: 18px;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(30, 40, 52, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 120, 0.7);
            border-radius: 60px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 2px 4px black;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.15);
            transition: 0.05s linear;
            cursor: pointer;
        }
        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
            background: rgba(50, 65, 82, 0.95);
        }

        /* Timer + Reset lado a lado (tamanho reduzido) */
        .timer-reset-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            width: 100%;
        }
        .timer-panel {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 100, 0.6);
            border-radius: 48px;
            padding: 4px 18px;
            text-align: center;
        }
        .timer-label {
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: #c0b090;
        }
        .timer-value {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 1.3rem;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            line-height: 1.2;
        }
        .reset-btn {
            background: rgba(160, 65, 45, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid #ffbc7a;
            border-radius: 60px;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #FFE5B4;
            text-shadow: 0 2px 4px black;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.15);
            transition: 0.05s linear;
            cursor: pointer;
        }
        .reset-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
            background: rgba(180, 75, 55, 0.95);
        }

        /* Status em linha única (sem quebra) */
        .status {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 150, 0.6);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #FDE5B4;
            margin-bottom: 16px;
            text-align: center;
            white-space: nowrap;
            overflow-x: auto;
            max-width: 100%;
        }

        .ranking {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 10px 16px;
            margin-top: 8px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 200, 120, 0.4);
        }
        .ranking h3 {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #FFE2B5;
            font-weight: 500;
        }
        .ranking ol {
            padding-left: 24px;
            text-align: left;
            display: inline-block;
            color: #DDD0BC;
            font-size: 0.75rem;
        }
        .ranking li {
            margin: 4px 0;
        }
        .ranking .current-player {
            background: rgba(255, 215, 150, 0.35);
            border-radius: 20px;
            padding-left: 8px;
            margin-left: -8px;
            font-weight: bold;
            color: #FFEBB0;
        }

        .player-input {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 6px 0 4px;
        }
        .player-input input {
            background: rgba(30, 40, 50, 0.9);
            border: 1px solid #FFD28F;
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 0.75rem;
            width: 130px;
            text-align: center;
            color: #FFE5B4;
            outline: none;
        }
        .player-input button {
            background: #2c3e46;
            border: none;
            border-radius: 40px;
            padding: 5px 12px;
            color: #FFE5B4;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
        }

        @media (max-width: 560px) {
            .ctrl-btn { width: 55px; height: 55px; font-size: 24px; }
            .dpad-row { gap: 12px; }
            .reset-btn { width: 55px; height: 55px; font-size: 22px; }
            .timer-value { font-size: 1.1rem; }
            .timer-panel { padding: 2px 12px; }
            .status { font-size: 0.7rem; white-space: normal; } /* fallback para telas muito pequenas */
        }

        footer {
            text-align: center;
            font-size: 0.55rem;
            color: #aaa;
            margin-top: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- D-PAD -->
        <div class="dpad-wrapper">
            <div class="dpad">
                <div class="dpad-row"><div class="ctrl-btn" id="btnUp">▲</div></div>
                <div class="dpad-row">
                    <div class="ctrl-btn" id="btnLeft">◀</div>
                    <div class="ctrl-btn" id="btnDown">▼</div>
                    <div class="ctrl-btn" id="btnRight">▶</div>
                </div>
            </div>
        </div>

        <!-- TIMER + RESET (tamanho reduzido) -->
        <div class="timer-reset-bar">
            <div class="timer-panel">
                <div class="timer-label">⏱️ TEMPO</div>
                <div class="timer-value" id="timerDisplay">0.0 s</div>
            </div>
            <div class="reset-btn" id="btnReset">⟳</div>
        </div>
        
        <div class="status" id="gameStatus">✨ mova a esfera até o centro do alvo ✨</div>
        
        <div class="player-input">
            <input type="text" id="playerName" placeholder="Seu nome" maxlength="12">
            <button id="saveNameBtn">Salvar</button>
        </div>
        
        <div class="ranking" id="rankingDiv">
            <h3>🏆 RANKING (melhor tempo) 🏆</h3>
            <ol id="rankingList"></ol>
        </div>
        <footer>paredes claras: repelem | escuras: bloqueiam | alvo central dourado</footer>
    </div>
</div>

<script>
    (function(){
        // ---------- CONFIGURAÇÕES ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const SIZE = 600;
        canvas.width = SIZE;
        canvas.height = SIZE;
        
        const BALL_RADIUS = 13;
        const TARGET_RADIUS = 20;
        
        let ballX = SIZE/2, ballY = SIZE/2;
        let velocityX = 0, velocityY = 0;
        const ACC = 400;
        const MAX_SPEED = 500;
        const DRAG = 0.98;
        
        let leftPressed = false, rightPressed = false, upPressed = false, downPressed = false;
        let victory = false;
        let victoryTimer = null;
        let isFalling = false;
        
        // Controle do cronômetro: só inicia no primeiro movimento
        let gameStarted = false;      // indica se o jogador já movimentou a bola
        let startTime = null;         // tempo real de início (performance)
        let currentTime = 0;
        let timerInterval = null;
        
        let walls = [];
        const targetCenter = { x: SIZE/2, y: SIZE/2 };
        
        let playerName = localStorage.getItem('playerName') || 'Anônimo';
        let ranking = [];
        
        const timerDisplay = document.getElementById('timerDisplay');
        const nameInput = document.getElementById('playerName');
        nameInput.value = playerName;
        document.getElementById('saveNameBtn').addEventListener('click', () => {
            let newName = nameInput.value.trim();
            if (newName === "") newName = "Anônimo";
            playerName = newName;
            localStorage.setItem('playerName', playerName);
            updateRankingDisplay();
        });
        
        // Ranking local
        function loadRanking() {
            const stored = localStorage.getItem('dedaloRanking');
            if (stored) {
                ranking = JSON.parse(stored);
            } else {
                ranking = [
                    { name: "MestreAço", time: 12.3 },
                    { name: "BolaDeFogo", time: 15.7 },
                    { name: "Labirinteiro", time: 18.2 }
                ];
                saveRanking();
            }
            updateRankingDisplay();
        }
        
        function saveRanking() {
            ranking.sort((a,b) => a.time - b.time);
            ranking = ranking.slice(0, 10);
            localStorage.setItem('dedaloRanking', JSON.stringify(ranking));
        }
        
        function addScoreToRanking(name, timeSec) {
            ranking.push({ name: name, time: parseFloat(timeSec.toFixed(2)) });
            ranking.sort((a,b) => a.time - b.time);
            ranking = ranking.slice(0, 10);
            saveRanking();
            updateRankingDisplay();
        }
        
        function updateRankingDisplay() {
            const list = document.getElementById('rankingList');
            list.innerHTML = '';
            ranking.slice(0,5).forEach((entry, idx) => {
                const li = document.createElement('li');
                li.textContent = `${idx+1}. ${entry.name} - ${entry.time.toFixed(2)}s`;
                if (entry.name === playerName) {
                    li.classList.add('current-player');
                }
                list.appendChild(li);
            });
            if (ranking.length === 0) list.innerHTML = '<li>Nenhum registro</li>';
        }
        
        // ---------- GERADOR DFS COM CAMINHOS LARGOS ----------
        const CELL_SIZE = 46;
        const WALL_THICK = 10;
        const GRID_W = Math.floor(SIZE / CELL_SIZE);
        const GRID_H = GRID_W;
        const OFFSET_X = (SIZE - GRID_W * CELL_SIZE) / 2;
        const OFFSET_Y = (SIZE - GRID_H * CELL_SIZE) / 2;
        
        let cells = [];
        let wallsGrid = [];
        
        function initDFS() {
            cells = Array(GRID_H).fill().map(() => Array(GRID_W).fill(false));
            wallsGrid = Array(GRID_H).fill().map(() => Array(GRID_W).fill().map(() => ({ right: true, bottom: true })));
            const startX = Math.floor(GRID_W/2);
            const startY = Math.floor(GRID_H/2);
            dfsCarve(startX, startY);
            return {
                top: Math.floor(Math.random() * GRID_W),
                bottom: Math.floor(Math.random() * GRID_W),
                left: Math.floor(Math.random() * GRID_H),
                right: Math.floor(Math.random() * GRID_H)
            };
        }
        
        function dfsCarve(x, y) {
            cells[y][x] = true;
            const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
            for (let i = dirs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
            }
            for (let [dx, dy] of dirs) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && !cells[ny][nx]) {
                    if (dx === 1) wallsGrid[y][x].right = false;
                    else if (dx === -1) wallsGrid[y][nx].right = false;
                    else if (dy === 1) wallsGrid[y][x].bottom = false;
                    else if (dy === -1) wallsGrid[ny][x].bottom = false;
                    dfsCarve(nx, ny);
                }
            }
        }
        
        function buildWallsFromDFS(borderOpenings) {
            walls = [];
            const addWall = (x, y, w, h, type) => {
                if (w <= 0 || h <= 0) return;
                walls.push({ x, y, w, h, type });
            };
            for (let row = 0; row < GRID_H; row++) {
                for (let col = 0; col < GRID_W; col++) {
                    const cx = OFFSET_X + col * CELL_SIZE;
                    const cy = OFFSET_Y + row * CELL_SIZE;
                    if (wallsGrid[row][col].right) {
                        let type = Math.random() < 0.3 ? 'light' : 'dark';
                        addWall(cx + CELL_SIZE, cy, WALL_THICK, CELL_SIZE, type);
                    }
                    if (wallsGrid[row][col].bottom) {
                        let type = Math.random() < 0.3 ? 'light' : 'dark';
                        addWall(cx, cy + CELL_SIZE, CELL_SIZE, WALL_THICK, type);
                    }
                }
            }
            // Bordas com aberturas
            for (let col = 0; col < GRID_W; col++) {
                if (col !== borderOpenings.top) addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y, CELL_SIZE, WALL_THICK, 'dark');
                if (col !== borderOpenings.bottom) addWall(OFFSET_X + col*CELL_SIZE, OFFSET_Y + GRID_H*CELL_SIZE - WALL_THICK, CELL_SIZE, WALL_THICK, 'dark');
            }
            for (let row = 0; row < GRID_H; row++) {
                if (row !== borderOpenings.left) addWall(OFFSET_X, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 'dark');
                if (row !== borderOpenings.right) addWall(OFFSET_X + GRID_W*CELL_SIZE - WALL_THICK, OFFSET_Y + row*CELL_SIZE, WALL_THICK, CELL_SIZE, 'dark');
            }
            walls = walls.filter(w => Math.hypot(w.x + w.w/2 - targetCenter.x, w.y + w.h/2 - targetCenter.y) > TARGET_RADIUS + 12);
        }
        
        function generateMazeDFS() {
            const borders = initDFS();
            buildWallsFromDFS(borders);
        }
        
        // Spawn seguro nos pontos de entrada
        function randomSpawn() {
            const points = [
                { x: OFFSET_X + 20, y: targetCenter.y },
                { x: OFFSET_X + GRID_W*CELL_SIZE - 20, y: targetCenter.y },
                { x: targetCenter.x, y: OFFSET_Y + 20 },
                { x: targetCenter.x, y: OFFSET_Y + GRID_H*CELL_SIZE - 20 }
            ];
            for (let attempt = 0; attempt < 15; attempt++) {
                const idx = Math.floor(Math.random() * points.length);
                let sx = points[idx].x, sy = points[idx].y;
                let collides = false;
                for (let w of walls) {
                    if (sx + BALL_RADIUS > w.x && sx - BALL_RADIUS < w.x + w.w &&
                        sy + BALL_RADIUS > w.y && sy - BALL_RADIUS < w.y + w.h) {
                        collides = true;
                        break;
                    }
                }
                if (!collides) { ballX = sx; ballY = sy; return; }
            }
            ballX = targetCenter.x; ballY = targetCenter.y - 50;
        }
        
        // Colisão com repulsão
        function circleRectCollision(cx, cy, r, rect) {
            let closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
            let closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
            let dx = cx - closestX, dy = cy - closestY;
            return dx*dx + dy*dy < r*r;
        }
        
        function handleCollisions() {
            for (let w of walls) {
                if (circleRectCollision(ballX, ballY, BALL_RADIUS, w)) {
                    let closestX = Math.max(w.x, Math.min(ballX, w.x + w.w));
                    let closestY = Math.max(w.y, Math.min(ballY, w.y + w.h));
                    let dx = ballX - closestX, dy = ballY - closestY;
                    let dist = Math.hypot(dx, dy);
                    if (dist < BALL_RADIUS) {
                        let angle = Math.atan2(dy, dx);
                        let correction = BALL_RADIUS - dist;
                        ballX += Math.cos(angle) * correction;
                        ballY += Math.sin(angle) * correction;
                        if (w.type === 'light') {
                            velocityX = -velocityX * 1.3;
                            velocityY = -velocityY * 1.3;
                        } else {
                            if (Math.abs(dx) > Math.abs(dy)) velocityX *= -0.5;
                            else velocityY *= -0.5;
                        }
                    }
                }
            }
            ballX = Math.min(Math.max(ballX, BALL_RADIUS + OFFSET_X), SIZE - BALL_RADIUS - OFFSET_X);
            ballY = Math.min(Math.max(ballY, BALL_RADIUS + OFFSET_Y), SIZE - BALL_RADIUS - OFFSET_Y);
        }
        
        // Efeito de queda da bola
        function startFallingEffect(callback) {
            if (isFalling) return;
            isFalling = true;
            let step = 0;
            const origR = BALL_RADIUS;
            function anim() {
                if (step < 10) {
                    const scale = 1 - (step/10)*0.8;
                    const r = origR * scale;
                    ctx.save();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(ballX, ballY, r, 0, Math.PI*2);
                    ctx.fillStyle = "#7a8a9a";
                    ctx.fill();
                    ctx.restore();
                    step++;
                    requestAnimationFrame(anim);
                } else {
                    isFalling = false;
                    if (callback) callback();
                }
            }
            anim();
        }
        
        // Fogos de artifício
        function startFireworks() {
            const particles = [];
            const cx = targetCenter.x, cy = targetCenter.y;
            for (let i=0;i<6;i++) {
                const a = Math.random() * Math.PI*2;
                const r = 40 + Math.random()*60;
                const x = cx + Math.cos(a)*r;
                const y = cy + Math.sin(a)*r - 40;
                particles.push({ x, y, vx: (Math.random()-0.5)*2, vy: -7, life:1, exploded:false });
            }
            function update() {
                for(let i=particles.length-1;i>=0;i--) {
                    const p = particles[i];
                    if(!p.exploded) {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                        if(p.vy >=0 || p.y<50) {
                            p.exploded = true;
                            for(let s=0;s<22;s++) {
                                const a2 = Math.random()*Math.PI*2;
                                const sp = Math.random()*5+2;
                                particles.push({
                                    x: p.x, y: p.y, vx: Math.cos(a2)*sp, vy: Math.sin(a2)*sp,
                                    life:1, exploded:true, color: `hsl(${Math.random()*360},100%,60%)`
                                });
                            }
                            particles.splice(i,1);
                        }
                    } else {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
                        p.life -= 0.02;
                        if(p.life<=0 || p.y>SIZE+50) particles.splice(i,1);
                    }
                }
                for(let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.exploded?3*p.life:4, 0, Math.PI*2);
                    ctx.fillStyle = p.color || "#ffaa66";
                    ctx.fill();
                }
                if(particles.length>0) requestAnimationFrame(update);
            }
            update();
        }
        
        // Verifica vitória (bola toca o alvo)
        function checkWin() {
            if (victory) return;
            const dist = Math.hypot(ballX - targetCenter.x, ballY - targetCenter.y);
            if (dist < BALL_RADIUS + 5) {
                victory = true;
                const elapsed = currentTime; // tempo já registrado
                addScoreToRanking(playerName, elapsed);
                document.getElementById('gameStatus').innerHTML = `🎉 VITÓRIA! ${elapsed.toFixed(2)}s 🎉`;
                startFallingEffect(() => startFireworks());
                if (victoryTimer) clearTimeout(victoryTimer);
                victoryTimer = setTimeout(() => {
                    resetGame(true);
                    document.getElementById('gameStatus').innerHTML = '✨ mova a esfera até o centro do alvo ✨';
                    victory = false;
                    gameStarted = false;
                    startTime = null;
                    currentTime = 0;
                    timerDisplay.innerText = "0.0 s";
                }, 3500);
            }
        }
        
        // Reinicia todo o jogo (novo labirinto, esfera na entrada, cronômetro parado)
        function resetGame(newMaze=true) {
            if(victoryTimer) clearTimeout(victoryTimer);
            victory = false;
            gameStarted = false;
            startTime = null;
            currentTime = 0;
            timerDisplay.innerText = "0.0 s";
            if(newMaze) generateMazeDFS();
            randomSpawn();
            velocityX = 0; velocityY = 0;
            leftPressed = rightPressed = upPressed = downPressed = false;
        }
        
        // Atualiza o tempo exibido (baseado em performance.now se startTime existir)
        function updateTimerDisplay() {
            if (!victory && gameStarted && startTime) {
                currentTime = (performance.now() / 1000) - startTime;
                timerDisplay.innerText = currentTime.toFixed(1) + " s";
            } else if (!gameStarted) {
                timerDisplay.innerText = "0.0 s";
            }
            requestAnimationFrame(updateTimerDisplay);
        }
        
        // Inicia o cronômetro no primeiro movimento (tecla ou toque)
        function startTimerOnFirstMove() {
            if (!gameStarted && !victory && startTime === null) {
                gameStarted = true;
                startTime = performance.now() / 1000;
                currentTime = 0;
            }
        }
        
        // Física e atualização
        let lastTimePhysics = 0;
        function updatePhysics(delta) {
            if(victory) { 
                velocityX = 0; velocityY = 0; 
                return; 
            }
            let ax=0, ay=0;
            let moving = false;
            if(leftPressed) { ax = -ACC; moving = true; }
            if(rightPressed) { ax = ACC; moving = true; }
            if(upPressed) { ay = -ACC; moving = true; }
            if(downPressed) { ay = ACC; moving = true; }
            
            if (moving) startTimerOnFirstMove();
            
            velocityX += ax*delta;
            velocityY += ay*delta;
            let spd = Math.hypot(velocityX, velocityY);
            if(spd > MAX_SPEED) { velocityX = velocityX/spd*MAX_SPEED; velocityY = velocityY/spd*MAX_SPEED; }
            velocityX *= DRAG;
            velocityY *= DRAG;
            if(Math.abs(velocityX)<0.2) velocityX=0;
            if(Math.abs(velocityY)<0.2) velocityY=0;
            ballX += velocityX*delta;
            ballY += velocityY*delta;
            handleCollisions();
            checkWin();
        }
        
        // Desenho do labirinto, alvo e bola
        function draw() {
            ctx.clearRect(0,0,SIZE,SIZE);
            ctx.fillStyle = "#1e2a32";
            ctx.fillRect(0,0,SIZE,SIZE);
            for(let w of walls) {
                if(w.type === 'dark') {
                    ctx.fillStyle = "#2d5a3b";
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.fillStyle = "#1f3e2a";
                    ctx.fillRect(w.x+2, w.y+2, w.w-4, w.h-4);
                } else {
                    ctx.fillStyle = "#8bc34a";
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.fillStyle = "#6a9e3a";
                    ctx.fillRect(w.x+2, w.y+2, w.w-4, w.h-4);
                }
                ctx.strokeStyle = "#1e2a1a";
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            }
            ctx.shadowBlur = 0;
            // Alvo
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = "#8B0000";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS-5, 0, Math.PI*2);
            ctx.fillStyle = "#FF4500";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, TARGET_RADIUS-10, 0, Math.PI*2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(targetCenter.x, targetCenter.y, 5, 0, Math.PI*2);
            ctx.fillStyle = "#FFF8DC";
            ctx.fill();
            // Bola
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 8;
            const grad = ctx.createRadialGradient(ballX-4, ballY-4, 4, ballX, ballY, BALL_RADIUS);
            grad.addColorStop(0, "#f4f8ff");
            grad.addColorStop(0.5, "#b5c4d4");
            grad.addColorStop(1, "#7a8a9a");
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(ballX-3, ballY-4, 4, 0, Math.PI*2);
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }
        
        // Loop principal
        let lastFrame = 0;
        function gameLoop(now) {
            if(!lastFrame) lastFrame = now;
            let delta = Math.min(0.033, (now-lastFrame)/1000);
            if(delta>0.01) {
                updatePhysics(delta);
                draw();
            }
            lastFrame = now;
            requestAnimationFrame(gameLoop);
        }
        
        // Inicialização
        loadRanking();
        generateMazeDFS();
        randomSpawn();
        updateTimerDisplay();  // inicia a exibição do relógio (0.0)
        
        // Controles de teclado (também disparam o timer)
        window.addEventListener('keydown', (e) => {
            const k = e.key;
            if(k === 'ArrowLeft' || k === 'a') { leftPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'ArrowRight' || k === 'd') { rightPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'ArrowUp' || k === 'w') { upPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'ArrowDown' || k === 's') { downPressed=true; e.preventDefault(); startTimerOnFirstMove();}
            else if(k === 'r') { resetGame(true); e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key;
            if(k === 'ArrowLeft' || k === 'a') leftPressed=false;
            else if(k === 'ArrowRight' || k === 'd') rightPressed=false;
            else if(k === 'ArrowUp' || k === 'w') upPressed=false;
            else if(k === 'ArrowDown' || k === 's') downPressed=false;
        });
        
        // Botões touch (também disparam o timer)
        const attach = (btn, dir) => {
            if(!btn) return;
            const set = (active) => {
                if(dir==='up') upPressed=active;
                if(dir==='down') downPressed=active;
                if(dir==='left') leftPressed=active;
                if(dir==='right') rightPressed=active;
                if(active) startTimerOnFirstMove();
            };
            btn.addEventListener('mousedown', (e)=>{e.preventDefault(); set(true);});
            btn.addEventListener('mouseup', ()=>set(false));
            btn.addEventListener('mouseleave', ()=>set(false));
            btn.addEventListener('touchstart', (e)=>{e.preventDefault(); set(true);});
            btn.addEventListener('touchend', ()=>set(false));
            btn.addEventListener('touchcancel', ()=>set(false));
        };
        attach(document.getElementById('btnUp'), 'up');
        attach(document.getElementById('btnDown'), 'down');
        attach(document.getElementById('btnLeft'), 'left');
        attach(document.getElementById('btnRight'), 'right');
        
        const resetBtn = document.getElementById('btnReset');
        if(resetBtn) {
            resetBtn.addEventListener('click', ()=>resetGame(true));
            resetBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); resetGame(true);});
        }
        
        document.querySelectorAll('.ctrl-btn, .reset-btn').forEach(b => b.addEventListener('touchstart', e=>e.preventDefault()));
        document.body.addEventListener('touchmove', e=>{ if(e.target.closest('.ctrl-btn') || e.target===canvas) e.preventDefault(); }, {passive:false});
        
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
