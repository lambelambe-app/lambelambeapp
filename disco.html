<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Music Chart App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 800px;
            background: #1a252f;
        }
        .search-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 10px;
            background: #0f171e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 10;
            gap: 12px;
            flex-wrap: wrap;
        }
        .select-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .date-label {
            color: #bdc3c7;
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
        }
        .custom-select {
            padding: 10px 12px;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background: #2c3e50;
            border: 2px solid #4a6b8a;
            border-radius: 30px;
            color: #ecf0f1;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            min-width: 80px;
        }
        .custom-select:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 8px rgba(241,196,15,0.6);
        }
        .search-button {
            width: 46px;
            height: 46px;
            background: #e67e22;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .search-button:hover {
            background: #d35400;
            transform: scale(1.05);
        }
        .search-button:active {
            transform: scale(0.95);
        }
        #game-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }
        @media (max-width: 500px) {
            .custom-select {
                font-size: 15px;
                padding: 8px 10px;
                min-width: 68px;
            }
            .date-label {
                font-size: 14px;
            }
            .search-button {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .search-bar {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <!-- Barra de seletores -->
        <div class="search-bar">
            <div class="select-group">
                <label for="monthSelect" class="date-label">Mês</label>
                <select id="monthSelect" class="custom-select">
                    <option value="1">JAN</option>
                    <option value="2">FEV</option>
                    <option value="3">MAR</option>
                    <option value="4">ABR</option>
                    <option value="5">MAI</option>
                    <option value="6">JUN</option>
                    <option value="7">JUL</option>
                    <option value="8">AGO</option>
                    <option value="9">SET</option>
                    <option value="10">OUT</option>
                    <option value="11">NOV</option>
                    <option value="12">DEZ</option>
                </select>
            </div>
            <div class="select-group">
                <label for="yearSelect" class="date-label">Ano</label>
                <select id="yearSelect" class="custom-select">
                    <!-- preenchido dinamicamente -->
                </select>
            </div>
            <button id="searchButton" class="search-button" aria-label="Buscar">➤</button>
        </div>

        <!-- Canvas Phaser -->
        <div id="game-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@2.6.2/build/phaser.min.js"></script>
    <script>
        // ---------- Preencher anos ----------
        (function() {
            var currentYear = new Date().getFullYear();
            var yearSelect = document.getElementById('yearSelect');
            for (var y = currentYear; y >= 1960; y--) {
                var option = document.createElement('option');
                option.value = y;
                option.textContent = y;
                yearSelect.appendChild(option);
            }
            // Define o ano atual como selecionado
            yearSelect.value = currentYear;
        })();

        // ---------- Phaser ----------
        var chartData = [];
        var game;

        game = new Phaser.Game(800, 480, Phaser.CANVAS, 'game-container', {
            preload: preload,
            create: create,
            update: update
        });

        game.scale.scaleMode = Phaser.ScaleManager.SHOW_ALL;
        game.scale.pageAlignHorizontally = true;
        game.scale.pageAlignVertically = true;
        window.addEventListener('resize', function() {
            game.scale.setResizeCallback(function() {
                game.scale.refresh();
            });
        });

        var resultsGroup, scrollUpBtn, scrollDownBtn;
        var currentScrollY = 0;
        var rowHeight = 28;
        var maxVisibleRows = 9;
        var filteredRows = [];
        var messageText;

        function preload() {
            game.load.text('chartscsv', 'charts.csv');
        }

        function create() {
            game.stage.backgroundColor = '#1a252f';

            var csvText = game.cache.getText('chartscsv');
            parseCSV(csvText);

            var title = game.add.text(400, 20, '🎵 MUSIC CHART SEARCH', {
                font: 'bold 22px Arial',
                fill: '#f1c40f'
            });
            title.anchor.setTo(0.5, 0);

            var maskGraphics = game.add.graphics(20, 60);
            maskGraphics.beginFill(0xffffff, 0.05);
            maskGraphics.drawRect(0, 0, 760, 330);
            maskGraphics.endFill();

            resultsGroup = game.add.group();
            resultsGroup.x = 20;
            resultsGroup.y = 60;

            var mask = game.add.graphics(20, 60);
            mask.beginFill(0x000000);
            mask.drawRect(0, 0, 760, 330);
            resultsGroup.mask = mask;

            scrollUpBtn = game.add.text(785, 75, '▲', { font: 'bold 22px Arial', fill: '#3498db' });
            scrollUpBtn.anchor.setTo(0.5, 0);
            scrollUpBtn.inputEnabled = true;
            scrollUpBtn.events.onInputDown.add(scrollUp);

            scrollDownBtn = game.add.text(785, 360, '▼', { font: 'bold 22px Arial', fill: '#3498db' });
            scrollDownBtn.anchor.setTo(0.5, 0);
            scrollDownBtn.inputEnabled = true;
            scrollDownBtn.events.onInputDown.add(scrollDown);

            messageText = game.add.text(400, 440, '', {
                font: '14px Arial',
                fill: '#95a5a6',
                align: 'center'
            });
            messageText.anchor.setTo(0.5, 0);

            // Evento do botão HTML
            document.getElementById('searchButton').addEventListener('click', function() {
                performSearch();
            });

            showMessage('Selecione mês e ano e toque na seta', '#f1c40f');
        }

        function update() {}

        function parseCSV(csv) {
            var lines = csv.split('\n');
            var headers = lines[0].split(',');
            chartData = [];
            for (var i = 1; i < lines.length; i++) {
                var line = lines[i].trim();
                if (line === '') continue;
                var cols = line.split(',');
                if (cols.length >= 8) {
                    chartData.push({
                        year: parseInt(cols[0]),
                        month: parseInt(cols[1]),
                        country: cols[2],
                        rank: parseInt(cols[3]),
                        track_name: cols[4].replace(/^"|"$/g, ''),
                        artist: cols[5].replace(/^"|"$/g, ''),
                        artist_url: cols[6],
                        track_url: cols[7]
                    });
                }
            }
        }

        function performSearch() {
            resultsGroup.removeAll();
            filteredRows = [];
            currentScrollY = 0;
            resultsGroup.y = 60;

            var month = parseInt(document.getElementById('monthSelect').value);
            var year = parseInt(document.getElementById('yearSelect').value);

            if (isNaN(month) || isNaN(year)) {
                showMessage('Selecione mês e ano válidos.', '#e74c3c');
                return;
            }

            var results = chartData.filter(function(entry) {
                return entry.month === month && entry.year === year;
            });

            if (results.length === 0) {
                showMessage('Nenhum resultado para ' + month + '/' + year, '#e74c3c');
                return;
            }

            results.sort(function(a, b) {
                if (a.country < b.country) return -1;
                if (a.country > b.country) return 1;
                return a.rank - b.rank;
            });

            filteredRows = results;

            for (var i = 0; i < results.length; i++) {
                var entry = results[i];
                var yPos = i * rowHeight;

                var infoText = game.add.text(10, yPos, entry.country + ' #' + entry.rank, {
                    font: '13px Arial',
                    fill: '#bdc3c7'
                });

                var artistText = game.add.text(130, yPos, entry.artist, {
                    font: 'bold 13px Arial',
                    fill: '#3498db'
                });
                artistText.inputEnabled = true;
                artistText.events.onInputDown.add(function(item, pointer) {
                    window.open(entry.artist_url, '_blank');
                });

                var trackText = game.add.text(310, yPos, '— ' + entry.track_name, {
                    font: '13px Arial',
                    fill: '#ecf0f1'
                });

                resultsGroup.add(infoText);
                resultsGroup.add(artistText);
                resultsGroup.add(trackText);
            }

            showMessage(results.length + ' músicas encontradas.', '#2ecc71');
        }

        function scrollUp() {
            if (filteredRows.length <= maxVisibleRows) return;
            currentScrollY = Math.min(0, currentScrollY + rowHeight);
            updateScroll();
        }

        function scrollDown() {
            if (filteredRows.length <= maxVisibleRows) return;
            var maxScroll = -(filteredRows.length - maxVisibleRows) * rowHeight;
            currentScrollY = Math.max(maxScroll, currentScrollY - rowHeight);
            updateScroll();
        }

        function updateScroll() {
            resultsGroup.y = 60 + currentScrollY;
        }

        function showMessage(msg, color) {
            if (messageText) {
                messageText.text = msg;
                messageText.fill = color || '#95a5a6';
                game.time.events.removeAll();
                game.time.events.add(4000, function() {
                    if (messageText) messageText.text = '';
                });
            }
        }
    </script>
</body>
</html>
