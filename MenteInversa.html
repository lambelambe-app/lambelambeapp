<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mente Inversa • Análise Cognitiva Interativa</title>
    <style>
        :root {
            --bg: #07090f;
            --surface: #111827;
            --surface2: #1a1f2e;
            --surface3: #222940;
            --text: #e8eaf0;
            --text2: #9ca3b8;
            --accent: #818cf8;
            --accent2: #6366f1;
            --accent3: #a78bfa;
            --cyan: #22d3ee;
            --amber: #f59e0b;
            --red: #f87171;
            --green: #4ade80;
            --pink: #f472b6;
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --radius: 20px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.4);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 30% 20%, #1a1040 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, #0f1a2e 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, #0b0f1c 0%, #07090f 100%);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Screens */
        .screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            animation: fadeUp 0.5s ease;
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }
        @keyframes revealGlow {
            0% {
                box-shadow: 0 0 0px rgba(129, 140, 248, 0);
            }
            50% {
                box-shadow: 0 0 30px rgba(129, 140, 248, 0.5);
            }
            100% {
                box-shadow: 0 0 0px rgba(129, 140, 248, 0);
            }
        }
        @keyframes sparkle {
            0%,
            100% {
                opacity: 0;
                transform: scale(0) translateY(0);
            }
            50% {
                opacity: 1;
                transform: scale(1) translateY(-20px);
            }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-md);
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo .brain {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
        }
        .logo h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(to right, #c7d2fe, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }
        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text2);
        }

        /* Home */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }
        .case-thumb {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .case-thumb:hover {
            border-color: rgba(129, 140, 248, 0.4);
            background: var(--surface2);
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }
        .case-thumb.locked {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .case-thumb .emoji {
            font-size: 2.5rem;
            animation: float 3s infinite ease-in-out;
        }
        .case-thumb h3 {
            margin: 10px 0 4px;
            font-size: 1rem;
            color: #fff;
        }
        .case-thumb .meta {
            font-size: 0.75rem;
            color: var(--text2);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .case-thumb .stars {
            color: var(--amber);
        }
        .badge-lock {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.7rem;
        }

        /* Game screen */
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        @media (max-width: 700px) {
            .game-layout {
                grid-template-columns: 1fr;
            }
        }

        .client-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            min-height: 280px;
        }
        .client-avatar {
            font-size: 5rem;
            transition: all 0.4s;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
            animation: float 4s infinite ease-in-out;
            position: relative;
        }
        .client-avatar.thinking {
            animation: shake 0.6s ease;
        }
        .client-name {
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 8px;
            color: #fff;
        }
        .client-quote {
            font-style: italic;
            color: var(--text2);
            margin-top: 6px;
            font-size: 0.9rem;
            line-height: 1.5;
            min-height: 50px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: var(--radius-xs);
            width: 100%;
        }
        .emotion-bar {
            width: 100%;
            height: 6px;
            background: #1f2937;
            border-radius: 10px;
            margin-top: 12px;
            overflow: hidden;
        }
        .emotion-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.6s ease, background 0.6s;
            background: var(--amber);
            width: 50%;
        }

        .analyst-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .panel-title {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.75rem;
            color: var(--accent3);
            margin-bottom: 4px;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .action-chip {
            padding: 10px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            background: var(--surface3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .action-chip:hover {
            background: #2a3050;
            border-color: rgba(129, 140, 248, 0.5);
        }
        .action-chip:active {
            transform: scale(0.96);
        }
        .action-chip.used {
            opacity: 0.4;
            pointer-events: none;
            text-decoration: line-through;
        }

        .detected-viés {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;
            animation: fadeUp 0.3s ease;
        }
        .detected-viés.confirmed {
            background: rgba(74, 222, 128, 0.15);
            border-color: rgba(74, 222, 128, 0.4);
            color: var(--green);
        }

        .intervention-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .intervention-item {
            padding: 10px 14px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            background: var(--surface3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all var(--transition);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .intervention-item:hover {
            background: #2c334f;
            border-color: var(--cyan);
        }
        .intervention-item.selected {
            border-color: var(--cyan);
            background: rgba(34, 211, 238, 0.12);
            box-shadow: 0 0 14px rgba(34, 211, 238, 0.2);
        }

        .btn {
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: var(--font);
            font-size: 0.9rem;
            transition: all var(--transition);
            letter-spacing: 0.3px;
            width: 100%;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 12px 30px rgba(129, 140, 248, 0.5);
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
        }
        .btn-outline:hover {
            border-color: rgba(255, 255, 255, 0.6);
        }
        .btn-sm {
            width: auto;
            padding: 6px 14px;
            font-size: 0.8rem;
        }

        .clareza-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            padding: 8px 16px;
        }
        .clareza-box .icon {
            font-size: 1.2rem;
        }
        .clareza-box .bar-outer {
            flex: 1;
            height: 8px;
            background: #1f2937;
            border-radius: 10px;
            overflow: hidden;
        }
        .clareza-box .bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            background: var(--amber);
        }
        .clareza-box .value {
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
            padding: 20px;
        }
        .modal {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow-lg);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-emoji {
            font-size: 4rem;
            animation: float 2s infinite;
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 8px 0;
        }
        .modal-text {
            color: var(--text2);
            margin-bottom: 16px;
            line-height: 1.5;
            font-size: 0.9rem;
        }
        .xp-gain {
            display: inline-block;
            background: rgba(129, 140, 248, 0.2);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            color: #c7d2fe;
            margin: 8px 0;
        }
        .stars-display {
            font-size: 2rem;
            letter-spacing: 4px;
        }

        /* Particles */
        .particle {
            position: absolute;
            pointer-events: none;
            font-size: 1.2rem;
            animation: sparkle 1s ease-out forwards;
            z-index: 50;
        }

        /* Journal */
        .journal-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all var(--transition);
        }
        .journal-card:hover {
            background: var(--surface2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @media (max-width: 500px) {
            .header {
                padding: 12px 14px;
            }
            .logo h1 {
                font-size: 1rem;
            }
            .stats {
                gap: 10px;
            }
            .stat-value {
                font-size: 1rem;
            }
            .client-avatar {
                font-size: 3.5rem;
            }
            .action-chip {
                padding: 8px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="appRoot">
        <!-- HOME SCREEN -->
        <div class="screen active" id="homeScreen">
            <div class="header">
                <div class="logo">
                    <div class="brain">🧠</div>
                    <div>
                        <h1>Mente Inversa</h1>
                        <div style="font-size:0.7rem;color:var(--text2);">Central de Análise Cognitiva</div>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item"><div class="stat-value" id="homeLevel">🧭 Iniciante</div><div class="stat-label">Nível</div></div>
                    <div class="stat-item"><div class="stat-value" id="homeXP">0</div><div class="stat-label">XP</div></div>
                    <div class="stat-item"><div class="stat-value" id="homeCasos">0</div><div class="stat-label">Casos</div></div>
                </div>
            </div>

            <div style="color:var(--text2);font-size:0.85rem;display:flex;align-items:center;gap:6px;">📋 Selecione um caso para análise:</div>
            <div class="home-grid" id="caseGrid"></div>

            <button class="btn btn-outline" onclick="openJournal()" style="margin-top:6px;">📓 Diário de Casos Resolvidos</button>
        </div>

        <!-- GAME SCREEN -->
        <div class="screen" id="gameScreen">
            <div class="header">
                <div class="logo">
                    <div class="brain" style="width:36px;height:36px;font-size:18px;">🧠</div>
                    <div>
                        <h1 style="font-size:1rem;">Mente Inversa</h1>
                        <div style="font-size:0.65rem;color:var(--text2);" id="gameCaseTitle">Análise em andamento</div>
                    </div>
                </div>
                <div class="clareza-box">
                    <span class="icon">💡</span>
                    <div class="bar-outer"><div class="bar-inner" id="clarezaBar" style="width:60%;"></div></div>
                    <span class="value" id="clarezaValue">6/10</span>
                </div>
            </div>

            <div class="game-layout">
                <!-- Client panel -->
                <div class="client-panel" id="clientPanel">
                    <div class="client-avatar" id="clientAvatar">🤔</div>
                    <div class="client-name" id="clientName">Cliente</div>
                    <div class="client-quote" id="clientQuote">"..."</div>
                    <div class="emotion-bar"><div class="emotion-fill" id="emotionFill" style="width:50%;"></div></div>
                    <div style="font-size:0.7rem;color:var(--text2);margin-top:4px;">Nível de Resistência</div>
                </div>

                <!-- Analyst panel -->
                <div class="analyst-panel">
                    <div class="panel-title">🔍 Investigações</div>
                    <div class="action-buttons" id="investigationActions"></div>

                    <div class="panel-title" style="margin-top:8px;">📌 Vieses Detectados</div>
                    <div id="detectedViésesContainer" style="display:flex;flex-wrap:wrap;gap:6px;min-height:30px;"></div>

                    <div class="panel-title" style="margin-top:8px;">💊 Intervenção (Antídoto)</div>
                    <div class="intervention-list" id="interventionList"></div>

                    <button class="btn btn-primary" id="btnResolve" onclick="resolveCase()" disabled>
                        ✅ Aplicar Intervenção e Concluir
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="exitToHome()" style="margin-top:4px;">🏠 Sair</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal overlay -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        (function() {
            // ===================== DATA =====================
            const viesesDB = {
                confirmacao: { nome: 'Viés de Confirmação', emoji: '🔎', desc: 'Buscar evidências que confirmem crenças.' },
                disponibilidade: { nome: 'Viés de Disponibilidade', emoji: '📺', desc: 'Superestimar eventos vívidos.' },
                ancoragem: { nome: 'Ancoragem', emoji: '⚓', desc: 'Prender-se à primeira informação.' },
                aversao_perda: { nome: 'Aversão à Perda', emoji: '💔', desc: 'Pesar perdas mais que ganhos.' },
                custo_afundado: { nome: 'Custo Afundado', emoji: '🕳️', desc: 'Continuar investindo no erro.' },
                atribuicao: { nome: 'Erro de Atribuição', emoji: '🎭', desc: 'Julgar pessoas, ignorar contexto.' },
                manada: { nome: 'Efeito Manada', emoji: '🐑', desc: 'Seguir a maioria sem crítica.' },
                otimismo: { nome: 'Viés do Otimismo', emoji: '🌞', desc: 'Subestimar riscos pessoais.' },
                enquadramento: { nome: 'Efeito Enquadramento', emoji: '🖼️', desc: 'Mudar decisão pela forma da mensagem.' },
                retrospeccao: { nome: 'Viés da Retrospecção', emoji: '⏪', desc: 'Achar que já sabia depois.' },
                agrupamento: { nome: 'Ilusão de Agrupamento', emoji: '🎲', desc: 'Ver padrões em aleatoriedade.' },
                autoconveniencia: { nome: 'Viés Autoconveniente', emoji: '🛡️', desc: 'Sucesso meu, fracasso do acaso.' },
                falso_consenso: { nome: 'Falso Consenso', emoji: '🤝', desc: 'Superestimar concordância.' },
                status_quo: { nome: 'Status Quo', emoji: '🏠', desc: 'Resistência à mudança.' },
            };

            const antidotosDB = {
                advogado_diabo: { nome: 'Advogado do Diabo', emoji: '😈', desc: 'Argumentar contra si mesmo.',
                    neutraliza: ['confirmacao', 'manada'] },
                pre_mortem: { nome: 'Pré-Mortem', emoji: '🔮', desc: 'Simular falha antecipadamente.',
                neutraliza: ['otimismo', 'agrupamento'] },
                pergunta_invertida: { nome: 'Pergunta Invertida', emoji: '🪞', desc: 'Reformular pelo oposto.',
                    neutraliza: ['enquadramento', 'ancoragem'] },
                diario: { nome: 'Diário de Decisões', emoji: '📓', desc: 'Registrar previsões antes.',
                    neutraliza: ['retrospeccao', 'autoconveniencia'] },
                troca_perspectiva: { nome: 'Troca de Perspectiva', emoji: '👁️', desc: 'Ver como outro.',
                    neutraliza: ['atribuicao', 'falso_consenso'] },
                evidencias_contrarias: { nome: 'Evidências Contrárias', emoji: '📋',
                    desc: 'Listar fatos opostos.', neutraliza: ['confirmacao', 'disponibilidade'] },
                ponto_externo: { nome: 'Ponto de Vista Externo', emoji: '🌐', desc: 'Usar dados estatísticos.',
                    neutraliza: ['custo_afundado', 'otimismo'] },
                reenquadre_zero: { nome: 'Reenquadre do Zero', emoji: '🔄',
                    desc: 'Decisão como se nada tivesse sido investido.', neutraliza: ['custo_afundado',
                        'aversao_perda', 'status_quo'
                    ] },
                amplie_amostra: { nome: 'Amplie a Amostra', emoji: '📊', desc: 'Buscar dados além do óbvio.',
                    neutraliza: ['disponibilidade', 'agrupamento'] },
            };

            // Cada caso tem fases de diálogo e investigações que revelam vieses
            const casos = [{
                id: 'caso1',
                nivelMin: 1,
                titulo: 'O novo colega "incompetente"',
                emoji: '👩‍💼',
                cliente: 'Maria',
                avatar: '👩‍💼',
                viesesReais: ['confirmacao', 'atribuicao'],
                antidotoCorreto: 'evidencias_contrarias',
                xpBase: 10,
                falasIniciais: [
                    'Antônio entrou há um mês e já vi vários erros.',
                    'Ele não tem o perfil para este time.',
                    'Ontem ele atrasou a planilha, como sempre.'
                ],
                investigacoes: [
                    { id: 'perguntar_acertos', label: 'Perguntar sobre acertos de Antônio', revela: 'confirmacao',
                        custoClareza: 0 },
                    { id: 'contexto_atraso', label: 'Questionar contexto do atraso', revela: 'atribuicao',
                    custoClareza: 0 },
                    { id: 'feedback_outros', label: 'Checar opinião de outros colegas', revela: null, custoClareza: -
                            1 },
                ],
                fraseFinal: 'Percebi que ignorei os acertos dele e nem perguntei o motivo do atraso...'
            }, {
                id: 'caso2',
                nivelMin: 1,
                titulo: 'Medo de voar pós-noticiário',
                emoji: '✈️',
                cliente: 'Carlos',
                avatar: '👨‍🦰',
                viesesReais: ['disponibilidade'],
                antidotoCorreto: 'amplie_amostra',
                xpBase: 8,
                falasIniciais: [
                    'Cancelei o voo. Você viu o acidente na TV?',
                    'Dirigir 14 horas é mais seguro, tenho certeza.',
                ],
                investigacoes: [
                    { id: 'estatisticas', label: 'Mostrar estatísticas de segurança', revela: 'disponibilidade',
                        custoClareza: 0 },
                    { id: 'emocao_imediata', label: 'Perguntar sobre o medo recente', revela: 'disponibilidade',
                        custoClareza: 0 },
                ],
                fraseFinal: 'É verdade... a TV exagerou o perigo na minha mente.'
            }, {
                id: 'caso3',
                nivelMin: 2,
                titulo: 'A aposta que dobra',
                emoji: '📉',
                cliente: 'Investidor',
                avatar: '👨‍💼',
                viesesReais: ['custo_afundado', 'aversao_perda'],
                antidotoCorreto: 'reenquadre_zero',
                xpBase: 15,
                falasIniciais: [
                    'Já coloquei R$50 mil nessa ação, não posso vender agora.',
                    'Se eu vender, o prejuízo se concretiza.',
                    'Vou comprar mais para baixar o preço médio.'
                ],
                investigacoes: [
                    { id: 'pergunta_zero', label: 'Perguntar: compraria hoje?', revela: 'custo_afundado',
                    custoClareza: 0 },
                    { id: 'dor_perda', label: 'Explorar sentimento de perda', revela: 'aversao_perda', custoClareza: 0 },
                ],
                fraseFinal: 'Entendi... meu apego ao passado está turvando a decisão.'
            }, {
                id: 'caso4',
                nivelMin: 3,
                titulo: 'Debate político polarizado',
                emoji: '🗣️',
                cliente: 'Amanda',
                avatar: '👩‍🎤',
                viesesReais: ['confirmacao', 'falso_consenso', 'autoconveniencia'],
                antidotoCorreto: 'evidencias_contrarias',
                xpBase: 20,
                falasIniciais: [
                    'Todos os meus amigos pensam como eu.',
                    'Quem discorda está mal-informado.',
                    'Quando eu erro, é porque a fonte era ruim.'
                ],
                investigacoes: [
                    { id: 'checar_fontes', label: 'Questionar fontes diversas', revela: 'confirmacao', custoClareza: 0 },
                    { id: 'amostra_real', label: 'Verificar se há discordância real', revela: 'falso_consenso',
                        custoClareza: 0 },
                    { id: 'autoanalise', label: 'Pedir autoavaliação de erros', revela: 'autoconveniencia',
                    custoClareza: 0 },
                ],
                fraseFinal: 'Estou presa em uma bolha... preciso ouvir outros lados.'
            }];

            // ===================== STATE =====================
            const state = {
                nivel: 1,
                xp: 0,
                casosResolvidos: 0,
                clareza: 6,
                maxClareza: 10,
                casoAtual: null,
                viesesDetectados: [],
                investigacoesUsadas: [],
                antidotoSelecionado: null,
                caseResolved: false,
                // diário
                journal: [],
            };

            function getNivel(xp) {
                if (xp >= 80) return { nome: '🧙 Mestre', nivel: 4 };
                if (xp >= 40) return { nome: '♟️ Estrategista', nivel: 3 };
                if (xp >= 15) return { nome: '🔎 Analista', nivel: 2 };
                return { nome: '🧭 Iniciante', nivel: 1 };
            }

            function updateNivel() {
                const n = getNivel(state.xp);
                state.nivel = n.nivel;
                return n;
            }

            // ===================== UI HELPERS =====================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            function showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                const el = document.getElementById(id);
                if (el) el.classList.add('active');
            }

            function updateHeaderStats() {
                const nivel = getNivel(state.xp);
                $('#homeLevel').textContent = nivel.nome;
                $('#homeXP').textContent = state.xp;
                $('#homeCasos').textContent = state.casosResolvidos;
            }

            function updateClarezaUI() {
                const bar = $('#clarezaBar');
                const val = $('#clarezaValue');
                if (!bar || !val) return;
                const pct = (state.clareza / state.maxClareza) * 100;
                bar.style.width = pct + '%';
                val.textContent = state.clareza + '/' + state.maxClareza;
                if (state.clareza <= 3) bar.style.background = 'var(--red)';
                else if (state.clareza <= 6) bar.style.background = 'var(--amber)';
                else bar.style.background = 'var(--green)';
                val.style.color = bar.style.background;
            }

            function spawnParticles(emoji, x, y) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = emoji;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }

            function showModal(emoji, title, text, xpGain, buttons) {
                const overlay = $('#modalOverlay');
                const content = $('#modalContent');
                overlay.style.display = 'flex';
                content.innerHTML = `
              <div class="modal-emoji">${emoji}</div>
              <div class="modal-title">${title}</div>
              <div class="modal-text">${text}</div>
              ${xpGain > 0 ? `<div class="xp-gain">+${xpGain} XP</div>` : ''}
              <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                ${buttons.map(b => `<button class="btn ${b.cls || 'btn-primary'}" onclick="${b.action}" style="flex:1;min-width:90px;">${b.label}</button>`).join('')}
              </div>
            `;
            }

            function hideModal() {
                $('#modalOverlay').style.display = 'none';
            }

            // ===================== HOME =====================
            function renderHomeGrid() {
                const grid = $('#caseGrid');
                grid.innerHTML = casos.map(c => {
                    const locked = c.nivelMin > state.nivel;
                    const completed = state.journal.find(j => j.casoId === c.id);
                    const stars = completed ? '⭐'.repeat(completed.stars) : '';
                    return `
                <div class="case-thumb ${locked ? 'locked' : ''}" onclick="${locked ? '' : `startCase('${c.id}')`}">
                  ${locked ? '<span class="badge-lock">🔒 Nv.' + c.nivelMin + '</span>' : ''}
                  <div class="emoji">${c.emoji}</div>
                  <h3>${c.titulo}</h3>
                  <div class="meta">
                    <span>${c.cliente}</span>
                    ${stars ? `<span class="stars">${stars}</span>` : '<span style="color:var(--text2);">Novo</span>'}
                  </div>
                </div>
              `;
                }).join('');
            }

            // ===================== GAME =====================
            function startCase(casoId) {
                const caso = casos.find(c => c.id === casoId);
                if (!caso) return;
                state.casoAtual = caso;
                state.clareza = 6;
                state.viesesDetectados = [];
                state.investigacoesUsadas = [];
                state.antidotoSelecionado = null;
                state.caseResolved = false;
                // Inicializa citação com primeira fala
                $('#clientAvatar').textContent = caso.avatar;
                $('#clientName').textContent = caso.cliente;
                $('#clientQuote').textContent = '"' + caso.falasIniciais[0] + '"';
                $('#emotionFill').style.width = '50%';
                $('#emotionFill').style.background = 'var(--amber)';
                $('#gameCaseTitle').textContent = caso.titulo;
                updateClarezaUI();
                renderInvestigations();
                renderDetectedViéses();
                renderInterventions();
                $('#btnResolve').disabled = true;
                showScreen('gameScreen');
            }

            function renderInvestigations() {
                const container = $('#investigationActions');
                const caso = state.casoAtual;
                container.innerHTML = caso.investigacoes.map(inv => {
                    const used = state.investigacoesUsadas.includes(inv.id);
                    return `<span class="action-chip ${used ? 'used' : ''}" onclick="${used ? '' : `investigate('${inv.id}')`}">
                🔎 ${inv.label}
              </span>`;
                }).join('');
            }

            function investigate(invId) {
                if (state.caseResolved) return;
                const caso = state.casoAtual;
                const inv = caso.investigacoes.find(i => i.id === invId);
                if (!inv || state.investigacoesUsadas.includes(invId)) return;

                state.investigacoesUsadas.push(invId);
                renderInvestigations();

                // Efeito no cliente
                const avatar = $('#clientAvatar');
                avatar.classList.add('thinking');
                setTimeout(() => avatar.classList.remove('thinking'), 600);

                // Se revela viés e ainda não foi detectado
                if (inv.revela && !state.viesesDetectados.includes(inv.revela)) {
                    state.viesesDetectados.push(inv.revela);
                    spawnParticles('💡', window.innerWidth / 2, window.innerHeight / 2);
                    renderDetectedViéses();
                }

                // Custo de clareza opcional
                if (inv.custoClareza && inv.custoClareza < 0) {
                    state.clareza = Math.max(0, state.clareza + inv.custoClareza);
                    updateClarezaUI();
                }

                // Atualizar fala do cliente (próxima ou reação)
                const falasRestantes = caso.falasIniciais.filter((_, i) => !state.investigacoesUsadas.includes(
                    `fala_${i}`));
                if (falasRestantes.length > 0) {
                    $('#clientQuote').textContent = '"' + falasRestantes[Math.floor(Math.random() *
                        falasRestantes.length)] + '"';
                } else if (state.viesesDetectados.length >= caso.viesesReais.length) {
                    $('#clientQuote').textContent = '"' + caso.fraseFinal + '"';
                    $('#emotionFill').style.width = '20%';
                    $('#emotionFill').style.background = 'var(--green)';
                }

                // Se todos vieses detectados, habilitar resolução
                verificarResolucao();
            }

            function renderDetectedViéses() {
                const container = $('#detectedViésesContainer');
                const caso = state.casoAtual;
                container.innerHTML = state.viesesDetectados.map(vId => {
                    const v = viesesDB[vId];
                    const isReal = caso.viesesReais.includes(vId);
                    return `<span class="detected-viés ${isReal ? 'confirmed' : ''}">${v?.emoji || '❓'} ${v?.nome || vId}</span>`;
                }).join('');
            }

            function renderInterventions() {
                const container = $('#interventionList');
                const caso = state.casoAtual;
                // Mostrar apenas antídotos que neutralizam algum viés do caso ou detectado
                const antidotosRelevantes = Object.entries(antidotosDB).filter(([id, a]) =>
                    a.neutraliza.some(v => caso.viesesReais.includes(v) || state.viesesDetectados.includes(v))
                );
                container.innerHTML = antidotosRelevantes.map(([id, a]) => `
              <div class="intervention-item ${state.antidotoSelecionado === id ? 'selected' : ''}" onclick="selectAntidoto('${id}')">
                <span>${a.emoji}</span>
                <div>
                  <div style="font-weight:600;">${a.nome}</div>
                  <div style="font-size:0.7rem;color:var(--text2);">${a.desc}</div>
                </div>
              </div>
            `).join('');
            }

            function selectAntidoto(id) {
                state.antidotoSelecionado = id;
                document.querySelectorAll('.intervention-item').forEach(el => el.classList.remove('selected'));
                const selected = document.querySelector(`.intervention-item[onclick="selectAntidoto('${id}')"]`);
                if (selected) selected.classList.add('selected');
                verificarResolucao();
            }

            function verificarResolucao() {
                const caso = state.casoAtual;
                const todosDetectados = caso.viesesReais.every(v => state.viesesDetectados.includes(v));
                const btn = $('#btnResolve');
                btn.disabled = !(todosDetectados && state.antidotoSelecionado);
                if (todosDetectados && !state.antidotoSelecionado) {
                    btn.textContent = '⚠️ Selecione um antídoto';
                } else if (!todosDetectados) {
                    btn.textContent = '🔍 Continue investigando...';
                } else {
                    btn.textContent = '✅ Aplicar Intervenção e Concluir';
                }
            }

            function resolveCase() {
                if (state.caseResolved || !state.casoAtual) return;
                const caso = state.casoAtual;
                const antidotoId = state.antidotoSelecionado;
                const viesesCorretos = caso.viesesReais;
                const viesesDetectados = state.viesesDetectados.filter(v => viesesCorretos.includes(v));
                const acertosVieses = viesesDetectados.length;
                const totalVieses = viesesCorretos.length;
                const antidotoCorreto = caso.antidotoCorreto === antidotoId;

                let deltaClareza = 0;
                if (acertosVieses === totalVieses) deltaClareza += 2;
                else if (acertosVieses >= 1) deltaClareza += 0;
                else deltaClareza -= 1;

                if (antidotoCorreto) deltaClareza += 2;
                else deltaClareza -= 2;

                state.clareza = Math.max(0, Math.min(state.maxClareza, state.clareza + deltaClareza));
                updateClarezaUI();

                const stars = state.clareza >= 9 ? 3 : state.clareza >= 6 ? 2 : state.clareza >= 3 ? 1 : 0;
                const xpGanho = Math.floor(caso.xpBase * (stars / 3)) + (antidotoCorreto ? 5 : 0);
                state.xp += xpGanho;
                state.casosResolvidos++;
                state.caseResolved = true;
                updateNivel();
                updateHeaderStats();

                // Salvar no diário
                const existing = state.journal.findIndex(j => j.casoId === caso.id);
                const entry = {
                    casoId: caso.id,
                    titulo: caso.titulo,
                    stars: stars,
                    data: new Date().toLocaleDateString(),
                    cliente: caso.cliente,
                };
                if (existing >= 0 && state.journal[existing].stars < stars) state.journal[existing] = entry;
                else if (existing < 0) state.journal.push(entry);

                // Animação
                $('#emotionFill').style.width = (100 - stars * 25) + '%';
                $('#emotionFill').style.background = stars >= 2 ? 'var(--green)' : 'var(--red)';
                $('#clientQuote').textContent = '"' + (stars >= 2 ? caso.fraseFinal :
                    'Ainda não me convenceu...') + '"';

                const emoji = stars >= 2 ? '🎉' : '🧐';
                const titulo = stars >= 2 ? 'Análise Concluída!' : 'Análise Parcial';
                const texto = `
              Vieses detectados: ${acertosVieses}/${totalVieses}<br>
              Antídoto: ${antidotoCorreto ? '✅ Correto' : '❌ Incorreto'}<br>
              Clareza final: ${state.clareza}/10
            `;
                showModal(emoji, titulo, texto, xpGanho, [
                    { label: '📋 Menu', cls: 'btn-outline', action: 'hideModal();exitToHome();' },
                ]);
            }

            function exitToHome() {
                state.casoAtual = null;
                state.antidotoSelecionado = null;
                state.viesesDetectados = [];
                state.investigacoesUsadas = [];
                state.caseResolved = false;
                updateHeaderStats();
                renderHomeGrid();
                showScreen('homeScreen');
            }

            function openJournal() {
                const entries = state.journal.slice().reverse();
                const texto = entries.length > 0 ?
                    entries.map(e =>
                        `⭐ ${e.stars}/3 — ${e.titulo} (${e.cliente}) em ${e.data}`).join('<br>') :
                    'Nenhum caso resolvido ainda.';
                showModal('📓', 'Diário de Casos', texto, 0, [
                    { label: 'Fechar', cls: 'btn-outline', action: 'hideModal()' },
                ]);
            }

            // ===================== INIT =====================
            function init() {
                updateNivel();
                updateHeaderStats();
                renderHomeGrid();
                updateClarezaUI();
                showScreen('homeScreen');
                // Fechar modal ao clicar fora
                $('#modalOverlay').addEventListener('click', function(e) {
                    if (e.target === this) hideModal();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') hideModal();
                });
                console.log('🧠 Mente Inversa — Análise Cognitiva Interativa carregada.');
            }

            // Expor funções globais
            window.startCase = startCase;
            window.investigate = investigate;
            window.selectAntidoto = selectAntidoto;
            window.resolveCase = resolveCase;
            window.exitToHome = exitToHome;
            window.openJournal = openJournal;
            window.hideModal = hideModal;

            init();
        })();
    </script>
</body>
</html>
