<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mente Inversa • Detetive de Vieses</title>
    <style>
        :root {
            --bg: #0a0c14;
            --surface: #141824;
            --surface2: #1d2133;
            --surface3: #262d42;
            --text: #eaeef5;
            --text2: #8b90a5;
            --accent: #7c8cf8;
            --accent2: #5b6cf0;
            --red: #f87171;
            --green: #4ade80;
            --amber: #fbbf24;
            --cyan: #22d3ee;
            --pink: #f472b6;
            --radius: 18px;
            --radius-sm: 10px;
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 30% 20%, #12183a 0%, transparent 60%),
                              radial-gradient(ellipse at 70% 80%, #1a1f30 0%, transparent 60%);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .screen {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeUp 0.5s ease;
        }
        .screen.active { display: flex; }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(25px); }
            to { opacity:1; transform:translateY(0); }
        }
        @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
        @keyframes shake { 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); } }
        @keyframes handcuff { 0%{ transform:rotate(0) scale(0); opacity:0; } 50%{ transform:rotate(15deg) scale(1.3); opacity:1; } 100%{ transform:rotate(0) scale(1); opacity:1; } }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 20px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .logo span { font-size: 1.5rem; }
        .stats {
            display: flex;
            gap: 16px;
        }
        .stat {
            text-align: center;
        }
        .stat .val {
            font-weight: 700;
            color: #fff;
        }
        .stat .lbl {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text2);
            letter-spacing: 0.5px;
        }
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .case-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.05);
            transition: all var(--transition);
        }
        .case-card:hover {
            border-color: var(--accent);
            background: var(--surface2);
            transform: translateY(-4px);
        }
        .case-card.locked {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .case-emoji { font-size: 2.5rem; }
        .case-title { font-weight: 600; margin: 8px 0 4px; }
        .case-meta { font-size: 0.75rem; color: var(--text2); }
        .btn {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            font-size: 0.9rem;
            transition: all var(--transition);
            letter-spacing: 0.3px;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 6px 20px rgba(124,140,248,0.3);
        }
        .btn-primary:hover { box-shadow: 0 10px 28px rgba(124,140,248,0.5); transform: translateY(-2px); }
        .btn-primary:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .btn-outline:hover { border-color: rgba(255,255,255,0.5); }
        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 650px) { .game-area { grid-template-columns: 1fr; } }
        .panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .suspect-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .suspect-avatar {
            font-size: 4.5rem;
            animation: pulse 4s infinite ease-in-out;
            position: relative;
        }
        .suspect-name {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .suspect-speech {
            font-style: italic;
            color: var(--text2);
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: var(--radius-sm);
            min-height: 50px;
            width: 100%;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .clue-board {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px;
        }
        .clue {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--amber);
            animation: fadeUp 0.3s;
        }
        .strategy-hand {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .strategy-card {
            background: var(--surface3);
            border: 1px solid rgba(124,140,248,0.25);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .strategy-card:hover {
            background: #313b5a;
            border-color: var(--accent);
        }
        .strategy-card.used {
            opacity: 0.3;
            pointer-events: none;
            text-decoration: line-through;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .accuse-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            from { transform:scale(0.85); opacity:0; }
            to { transform:scale(1); opacity:1; }
        }
        .modal-emoji { font-size: 3.5rem; }
        .stars { font-size: 2rem; letter-spacing: 4px; }
    </style>
</head>
<body>
<div class="app" id="appRoot">
    <!-- HOME -->
    <div class="screen active" id="homeScreen">
        <div class="header">
            <div class="logo"><span>🕵️</span> Mente Inversa</div>
            <div class="stats">
                <div class="stat"><div class="val" id="homeLevel">🧭 Iniciante</div><div class="lbl">Patente</div></div>
                <div class="stat"><div class="val" id="homeXP">0</div><div class="lbl">XP</div></div>
                <div class="stat"><div class="val" id="homeSolved">0</div><div class="lbl">Casos</div></div>
            </div>
        </div>
        <div class="home-grid" id="caseGrid"></div>
    </div>

    <!-- GAME -->
    <div class="screen" id="gameScreen">
        <div class="header">
            <div class="logo"><span>🕵️</span> <span id="gameTitle">Investigação</span></div>
            <div class="stats">
                <div class="stat"><div class="val" id="insightVal">5</div><div class="lbl">🔥 Insight</div></div>
                <div class="stat"><div class="val" id="progressVal">0/2</div><div class="lbl">Pistas</div></div>
            </div>
        </div>
        <div class="game-area">
            <div class="panel suspect-area">
                <div class="suspect-avatar" id="suspectAvatar">👤</div>
                <div class="suspect-name" id="suspectName">Suspeito</div>
                <div class="suspect-speech" id="suspectSpeech">"..."</div>
                <div style="font-size:0.7rem;color:var(--text2);">Os vieses são os ladrões. Encontre-os.</div>
            </div>
            <div class="panel">
                <div style="font-weight:600;">🔍 Mural de Pistas</div>
                <div class="clue-board" id="clueBoard">Nenhuma pista ainda.</div>
                <div style="font-weight:600;">⚔️ Estratagemas (Arte da Guerra)</div>
                <div class="strategy-hand" id="strategyHand"></div>
                <div class="action-btns">
                    <button class="btn btn-primary" id="btnInvestigate" onclick="investigate()">🔎 Interrogar (-1 Insight)</button>
                    <button class="btn btn-outline" id="btnAccuse" onclick="openAccuse()">🚨 Acusar</button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal" id="modalContent"></div>
</div>

<script>
(() => {
    // VIÉSES (os ladrões)
    const vieses = {
        confirmacao: { nome: 'Viés de Confirmação', emoji: '🔎', dica: 'Só lembra dos erros, ignora acertos.' },
        disponibilidade: { nome: 'Viés de Disponibilidade', emoji: '📺', dica: 'Superestima evento recente e vívido.' },
        ancoragem: { nome: 'Ancoragem', emoji: '⚓', dica: 'Preso ao primeiro número que ouviu.' },
        aversao_perda: { nome: 'Aversão à Perda', emoji: '💔', dica: 'Sente mais a perda do que o ganho.' },
        custo_afundado: { nome: 'Custo Afundado', emoji: '🕳️', dica: 'Continua porque já investiu muito.' },
        atribuicao: { nome: 'Erro de Atribuição', emoji: '🎭', dica: 'Julga os outros, ignora a situação.' },
        manada: { nome: 'Efeito Manada', emoji: '🐑', dica: 'Segue a maioria sem pensar.' },
        otimismo: { nome: 'Viés do Otimismo', emoji: '🌞', dica: 'Acha que com ele nunca acontece.' },
    };

    // ANTÍDOTOS (polícia)
    const antidotos = {
        evidencias_contrarias: { nome: 'Evidências Contrárias', emoji: '📋', neutraliza: ['confirmacao','disponibilidade'] },
        amplie_amostra: { nome: 'Amplie a Amostra', emoji: '📊', neutraliza: ['disponibilidade','manada'] },
        pergunta_invertida: { nome: 'Pergunta Invertida', emoji: '🪞', neutraliza: ['enquadramento','ancoragem'] },
        reenquadre_zero: { nome: 'Reenquadre do Zero', emoji: '🔄', neutraliza: ['custo_afundado','aversao_perda'] },
        troca_perspectiva: { nome: 'Troca de Perspectiva', emoji: '👁️', neutraliza: ['atribuicao','autoconveniencia'] },
        diario: { nome: 'Diário de Decisões', emoji: '📓', neutraliza: ['retrospeccao','autoconveniencia'] },
        advogado_diabo: { nome: 'Advogado do Diabo', emoji: '😈', neutraliza: ['confirmacao','manada'] },
    };

    // ESTRATAGEMAS (Arte da Guerra)
    const estrategemas = [
        { id: 'conhece_inimigo', nome: 'Conhece o Inimigo', emoji: '📖', desc: 'Revela uma pista crucial.', acao: (state) => { forceClue(state); return true; } },
        { id: 'ataque_surpresa', nome: 'Ataque Surpresa', emoji: '⚡', desc: 'Revela imediatamente um viés oculto.', acao: (state) => { revealRandomVies(state); return true; } },
        { id: 'enganar_inimigo', nome: 'Enganar o Inimigo', emoji: '🃏', desc: 'Descarta uma pista falsa (se houver).', acao: (state) => { removeFalseClue(state); return true; } },
        { id: 'terreno_vantajoso', nome: 'Terreno Vantajoso', emoji: '⛰️', desc: '+2 Insight', acao: (state) => { state.insight = Math.min(10, state.insight+2); updateUI(); return true; } },
    ];

    // CASOS
    const casos = [
        { id:1, nivel:1, titulo:'O colega "incompetente"', cliente:'Maria', avatar:'👩‍💼', viesesReais:['confirmacao','atribuicao'], antidotoCorreto:'evidencias_contrarias',
          falas:['Antônio errou de novo.','Ele não se encaixa aqui.','Ontem atrasou a entrega.'],
          dicasReais:['Ela só fala dos erros de Antônio.','Ela nunca perguntou o motivo do atraso.'],
          dicasFalsas:['Ela acha que todos concordam.'] },
        { id:2, nivel:1, titulo:'Medo de voar', cliente:'Carlos', avatar:'👨‍🦰', viesesReais:['disponibilidade'], antidotoCorreto:'amplie_amostra',
          falas:['Depois daquele acidente na TV...','Prefiro dirigir 14h.'],
          dicasReais:['Ele cancelou o voo após o noticiário.'],
          dicasFalsas:['Ele sempre teve medo de altura.'] },
        { id:3, nivel:2, titulo:'Aposta dobrada', cliente:'Investidor', avatar:'👨‍💼', viesesReais:['custo_afundado','aversao_perda'], antidotoCorreto:'reenquadre_zero',
          falas:['Já perdi muito, não posso vender.','Vou comprar mais pra diluir.'],
          dicasReais:['Ele se recusa a realizar o prejuízo.','A dor da perda paralisa.'],
          dicasFalsas:['Ele acha que a ação vai subir amanhã.'] },
        { id:4, nivel:3, titulo:'Bolha política', cliente:'Amanda', avatar:'👩‍🎤', viesesReais:['confirmacao','manada'], antidotoCorreto:'advogado_diabo',
          falas:['Todo mundo pensa assim.','Quem discorda está errado.'],
          dicasReais:['Ela só lê sites que concordam com ela.','Ela segue influencers que pensam igual.'],
          dicasFalsas:['Ela é muito inteligente.'] },
    ];

    // STATE
    const state = {
        casoAtual: null,
        insight: 5,
        viesesDetectados: [],
        pistasColetadas: [],
        pistasFalsasRestantes: [],
        dicasReaisRestantes: [],
        estrategemasMao: [],
        estrategemasUsadas: [],
        acusacaoFeita: false,
        // global
        xp: 0,
        casosResolvidos: 0,
        nivel: 1,
    };

    function getNivel(xp) {
        if (xp>=60) return {nome:'🧙 Mestre', lvl:4};
        if (xp>=30) return {nome:'♟️ Estrategista', lvl:3};
        if (xp>=10) return {nome:'🔎 Detetive', lvl:2};
        return {nome:'🧭 Recruta', lvl:1};
    }

    function updateGlobal() {
        const info = getNivel(state.xp);
        state.nivel = info.lvl;
        document.getElementById('homeLevel').textContent = info.nome;
        document.getElementById('homeXP').textContent = state.xp;
        document.getElementById('homeSolved').textContent = state.casosResolvidos;
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function renderHome() {
        const grid = document.getElementById('caseGrid');
        grid.innerHTML = casos.map(c=>{
            const locked = c.nivel > state.nivel;
            return `<div class="case-card ${locked?'locked':''}" onclick="${locked?'':`startCase(${c.id})`}">
                <div class="case-emoji">${c.avatar}</div>
                <div class="case-title">${c.titulo}</div>
                <div class="case-meta">${c.cliente} ${locked?`🔒 Nv.${c.nivel}`:''}</div>
            </div>`;
        }).join('');
    }

    function startCase(id) {
        const caso = casos.find(c=>c.id===id);
        if (!caso) return;
        state.casoAtual = caso;
        state.insight = 5;
        state.viesesDetectados = [];
        state.pistasColetadas = [];
        state.pistasFalsasRestantes = [...caso.dicasFalsas];
        state.dicasReaisRestantes = [...caso.dicasReais];
        state.estrategemasMao = [...estrategemas];
        state.estrategemasUsadas = [];
        state.acusacaoFeita = false;

        document.getElementById('suspectAvatar').textContent = caso.avatar;
        document.getElementById('suspectName').textContent = caso.cliente;
        document.getElementById('suspectSpeech').textContent = '"'+caso.falas[0]+'"';
        document.getElementById('gameTitle').textContent = caso.titulo;
        updateGameUI();
        showScreen('gameScreen');
    }

    function updateGameUI() {
        document.getElementById('insightVal').textContent = state.insight;
        document.getElementById('progressVal').textContent = state.viesesDetectados.length+'/'+state.casoAtual.viesesReais.length;
        renderClueBoard();
        renderStrategyHand();
    }

    function renderClueBoard() {
        const board = document.getElementById('clueBoard');
        if (state.pistasColetadas.length===0) {
            board.innerHTML = '<span style="color:var(--text2);font-size:0.85rem;">Nenhuma pista ainda.</span>';
            return;
        }
        board.innerHTML = state.pistasColetadas.map(p=>`<span class="clue">${p}</span>`).join('');
    }

    function renderStrategyHand() {
        const hand = document.getElementById('strategyHand');
        hand.innerHTML = state.estrategemasMao.map(e=>{
            const used = state.estrategemasUsadas.includes(e.id);
            return `<div class="strategy-card ${used?'used':''}" onclick="${used?'':`useEstrategema('${e.id}')`}">
                ${e.emoji} ${e.nome}
            </div>`;
        }).join('');
    }

    function forceClue(st) {
        if (st.dicasReaisRestantes.length>0) {
            const clue = st.dicasReaisRestantes.shift();
            st.pistasColetadas.push(clue);
        } else if (st.dicasFalsasRestantes.length>0) {
            const clue = st.dicasFalsasRestantes.shift();
            st.pistasColetadas.push(clue);
        }
    }

    function revealRandomVies(st) {
        const aindaNaoDetectados = st.casoAtual.viesesReais.filter(v=>!st.viesesDetectados.includes(v));
        if (aindaNaoDetectados.length>0) {
            const v = aindaNaoDetectados[Math.floor(Math.random()*aindaNaoDetectados.length)];
            st.viesesDetectados.push(v);
        }
    }

    function removeFalseClue(st) {
        const falseClue = st.pistasColetadas.find(p=>st.casoAtual.dicasFalsas.includes(p));
        if (falseClue) {
            st.pistasColetadas = st.pistasColetadas.filter(p=>p!==falseClue);
            st.pistasFalsasRestantes.push(falseClue);
        }
    }

    function useEstrategema(id) {
        if (state.insight <=0 || state.acusacaoFeita) return;
        const estrat = state.estrategemasMao.find(e=>e.id===id);
        if (!estrat || state.estrategemasUsadas.includes(id)) return;
        state.estrategemasUsadas.push(id);
        estrat.acao(state);
        updateGameUI();
    }

    function investigate() {
        if (state.insight <=0 || state.acusacaoFeita || !state.casoAtual) return;
        state.insight--;
        // Lógica: chance de pista real ou falsa
        const totalRestante = state.dicasReaisRestantes.length + state.pistasFalsasRestantes.length;
        if (totalRestante===0) {
            // sem pistas, mas pode revelar viés aleatório
            if (Math.random()<0.3) revealRandomVies(state);
        } else {
            const rand = Math.random();
            if (rand < 0.7 && state.dicasReaisRestantes.length>0) {
                const clue = state.dicasReaisRestantes.shift();
                state.pistasColetadas.push(clue);
                // tenta deduzir viés automaticamente (o jogador que analise, mas podemos dar uma chance)
            } else if (state.pistasFalsasRestantes.length>0) {
                const clue = state.pistasFalsasRestantes.shift();
                state.pistasColetadas.push(clue);
            } else if (state.dicasReaisRestantes.length>0) {
                const clue = state.dicasReaisRestantes.shift();
                state.pistasColetadas.push(clue);
            }
        }
        // atualiza fala do suspeito
        const falas = state.casoAtual.falas;
        document.getElementById('suspectSpeech').textContent = '"'+falas[Math.floor(Math.random()*falas.length)]+'"';
        updateGameUI();
    }

    function openAccuse() {
        if (state.acusacaoFeita || state.insight<=0) return;
        const modal = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        const viesesOptions = Object.entries(vieses).map(([id,v])=>`<option value="${id}">${v.emoji} ${v.nome}</option>`).join('');
        const antidotosOptions = Object.entries(antidotos).map(([id,a])=>`<option value="${id}">${a.emoji} ${a.nome}</option>`).join('');
        content.innerHTML = `
            <div class="modal-emoji">🚨</div>
            <h3>Acusação Formal</h3>
            <p style="color:var(--text2);">Selecione o viés criminoso e o antídoto policial.</p>
            <div style="text-align:left;">
                <label>Viés suspeito:</label>
                <select id="accuseVies" style="width:100%;padding:8px;margin:8px 0;background:var(--surface3);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;">${viesesOptions}</select>
                <label>Antídoto:</label>
                <select id="accuseAntidoto" style="width:100%;padding:8px;margin:8px 0;background:var(--surface3);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;">${antidotosOptions}</select>
            </div>
            <button class="btn btn-primary" onclick="confirmAccuse()" style="margin-top:12px;">🔒 Decretar Prisão</button>
            <button class="btn btn-outline" onclick="closeModal()" style="margin-top:8px;">Cancelar</button>
        `;
        modal.style.display = 'flex';
    }

    function confirmAccuse() {
        const viesId = document.getElementById('accuseVies').value;
        const antidotoId = document.getElementById('accuseAntidoto').value;
        closeModal();
        if (!state.casoAtual) return;
        const caso = state.casoAtual;
        const acertouVies = caso.viesesReais.includes(viesId);
        const acertouAntidoto = caso.antidotoCorreto === antidotoId;
        // resultado
        const capture = acertouVies && acertouAntidoto;
        state.acusacaoFeita = true;
        let xpGanho = 0;
        let stars = 0;
        if (capture) {
            xpGanho = 20;
            stars = 3;
            state.xp += xpGanho;
            state.casosResolvidos++;
            updateGlobal();
            showResultModal('🎉', 'Caso Resolvido!', `Você capturou o viés ${vieses[viesId].nome} com ${antidotos[antidotoId].nome}.`, stars, xpGanho);
        } else {
            // falha reduz insight e revela pistas extras
            state.insight = Math.max(0, state.insight-2);
            if (acertouVies && !acertouAntidoto) {
                showResultModal('🤔', 'Prisão parcial', 'O viés estava certo, mas o antídoto falhou. Tente outro.', 1, 0);
            } else if (!acertouVies && acertouAntidoto) {
                showResultModal('🤔', 'Algemas erradas', 'Antídoto certo, mas o viés acusado não estava presente.', 1, 0);
            } else {
                showResultModal('❌', 'Inocente!', 'Nenhum dos dois estava correto.', 0, 0);
            }
            state.acusacaoFeita = false; // permite tentar de novo
        }
        updateGameUI();
    }

    function showResultModal(emoji, title, text, stars, xp) {
        const modal = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        content.innerHTML = `
            <div class="modal-emoji">${emoji}</div>
            <h3>${title}</h3>
            <p>${text}</p>
            ${stars>0?`<div class="stars">${'⭐'.repeat(stars)}</div>`:''}
            ${xp>0?`<div style="color:var(--accent);font-weight:700;">+${xp} XP</div>`:''}
            <button class="btn btn-primary" onclick="closeModal();exitToHome();">🏠 Encerrar Caso</button>
        `;
        modal.style.display = 'flex';
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function exitToHome() {
        state.casoAtual = null;
        updateGlobal();
        renderHome();
        showScreen('homeScreen');
    }

    // Inicialização
    window.startCase = startCase;
    window.investigate = investigate;
    window.useEstrategema = useEstrategema;
    window.openAccuse = openAccuse;
    window.confirmAccuse = confirmAccuse;
    window.closeModal = closeModal;
    window.exitToHome = exitToHome;

    updateGlobal();
    renderHome();
    showScreen('homeScreen');
})();
</script>
</body>
</html>
