    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --glass: rgba(18,18,18,0.75);
            --border: rgba(255,255,255,0.08);
            --text: #fff;
            --text2: rgba(255,255,255,0.6);
            --text3: rgba(255,255,255,0.35);
            --accent: #4ade80;
            --warn: #fbbf24;
            --danger: #ef4444;
            --radius: 20px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Inter',system-ui,sans-serif;
            background:var(--bg);
            color:var(--text);
            height:100vh;height:100dvh;
            display:flex;flex-direction:column;
            overflow:hidden;
            -webkit-tap-highlight-color:transparent;
            user-select:none;
        }
        .top-nav{
            display:flex;align-items:center;justify-content:space-between;
            padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));
            background:var(--glass);backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);z-index:10;
        }
        .top-nav h1{font-size:1.1rem;font-weight:600;letter-spacing:-0.01em;}
        .nav-btn{background:none;border:none;color:var(--text2);font-size:1.2rem;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
        .main-content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
        .screen{display:none;animation:fadeIn 0.3s;}
        .screen.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .card{
            background:var(--glass);backdrop-filter:blur(20px);
            border:1px solid var(--border);border-radius:var(--radius);
            padding:20px;margin-bottom:16px;
        }
        .card-dark{background:rgba(10,10,10,0.8);}
        .greeting{font-size:0.8rem;color:var(--text3);margin-bottom:4px;}
        .user-name-input{
            background:transparent;border:none;color:var(--text);
            font-size:1.4rem;font-weight:600;width:100%;outline:none;
            font-family:inherit;
            background:linear-gradient(135deg,#4ade80,#22d3bb);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            caret-color:var(--accent);
        }
        .user-name-input::placeholder{color:var(--text3);-webkit-text-fill-color:var(--text3);}
        .stat-row{display:flex;justify-content:space-around;align-items:center;margin:16px 0;}
        .stat-val{font-size:2rem;font-weight:700;font-family:'SF Mono','Fira Code',monospace;}
        .stat-lab{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;}
        .divider{width:1px;height:40px;background:var(--border);}
        .slider-section{margin:16px 0;}
        .slider-label{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;}
        input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,#4ade80,#fbbf24,#ef4444);outline:none;margin:8px 0;}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:pointer;}
        .btn{
            display:flex;align-items:center;justify-content:center;gap:8px;
            width:100%;padding:16px;border:none;border-radius:var(--radius);
            background:var(--accent);color:#000;font-weight:700;
            font-size:0.95rem;letter-spacing:0.03em;cursor:pointer;
            transition:all 0.2s;
        }
        .btn:active{transform:scale(0.98);opacity:0.9;}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
        .btn-sm{padding:10px 16px;font-size:0.8rem;width:auto;display:inline-flex;}
        .bottom-nav{
            display:flex;justify-content:space-around;align-items:center;
            padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));
            background:var(--glass);backdrop-filter:blur(20px);
            border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:10;
        }
        .bottom-nav-item{
            display:flex;flex-direction:column;align-items:center;gap:4px;
            background:none;border:none;color:var(--text3);cursor:pointer;
            padding:8px 16px;border-radius:12px;transition:0.2s;
        }
        .bottom-nav-item.active{color:var(--accent);}
        .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;letter-spacing:0.05em;}
        .badge-green{background:var(--accent);color:#000;}
        .badge-yellow{background:var(--warn);color:#000;}
        .badge-red{background:var(--danger);}
        .map-container{height:300px;border-radius:12px;margin:16px 0;overflow:hidden;background:#1a1a1a;position:relative;}
        .map-gps-status{
            position:absolute;top:10px;left:50%;transform:translateX(-50%);
            background:rgba(0,0,0,0.7);color:var(--warn);padding:6px 12px;
            border-radius:20px;font-size:0.7rem;z-index:1000;
            backdrop-filter:blur(10px);transition:all 0.3s;white-space:nowrap;
        }
        .map-gps-status.ready{color:var(--accent);}
        .toast{
            position:fixed;bottom:100px;left:20px;right:20px;z-index:200;
            padding:14px 20px;border-radius:12px;text-align:center;
            font-size:0.85rem;font-weight:500;animation:slideUp 0.3s;
        }
        .toast.success{background:var(--accent);color:#000;}
        .toast.error{background:var(--danger);}
        .toast.info{background:rgba(255,255,255,0.9);color:#000;}
        @keyframes slideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
        .hidden{display:none!important;}
        .text-accent{color:var(--accent);}
        .text-warn{color:var(--warn);}
        .text-danger{color:var(--danger);}
        .mt-8{margin-top:8px;}
        .mb-8{margin-bottom:8px;}
        .flex-between{display:flex;justify-content:space-between;align-items:center;}
        .link{color:var(--accent);text-decoration:underline;cursor:pointer;font-size:0.8rem;}
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="top-nav">
        <button class="nav-btn" onclick="editProfile()" title="Perfil">👤</button>
        <h1>MindPace</h1>
        <button class="nav-btn" onclick="resetApp()" title="Reiniciar">↺</button>
    </div>

    <main class="main-content" id="mainContent">
        <!-- Dashboard -->
        <div class="screen active" id="dashboardScreen">
            <div class="card">
                <p class="greeting" id="greeting"></p>
                <input type="text" class="user-name-input" id="userNameInput" placeholder="Corredor" maxlength="30" autocomplete="off">
            </div>

            <div class="card" id="nextWorkoutCard">
                <div class="flex-between mb-8">
                    <span class="badge badge-green">HOJE</span>
                    <span style="font-size:0.9rem;color:var(--text2);" id="workoutType">Corrida Leve</span>
                </div>
                <div class="stat-row" id="workoutStats">
                    <div><div class="stat-val" id="dist">5.0</div><div class="stat-lab">km</div></div>
                    <div class="divider"></div>
                    <div><div class="stat-val" id="pace">6:00</div><div class="stat-lab">/km</div></div>
                    <div class="divider"></div>
                    <div><div class="stat-val" id="dur">30</div><div class="stat-lab">min</div></div>
                </div>
                <div class="slider-section">
                    <div class="slider-label">Sensação de Hoje (ajusta o ritmo)</div>
                    <input type="range" id="intensitySlider" min="0.5" max="1.5" step="0.05" value="1.0" oninput="updateIntensity(this.value)">
                    <div style="display:flex;justify-content:space-between;font-size:0.6rem;color:var(--text3);">
                        <span>Fácil</span><span>Normal</span><span>Intenso</span>
                    </div>
                </div>
                <button class="btn" onclick="startRun()" id="startRunBtn">▶ INICIAR CORRIDA</button>
            </div>

            <!-- Painel de datasets Kaggle -->
            <div class="card card-dark">
                <h3 style="font-size:0.8rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">📡 Dados Externos (Kaggle)</h3>
                <div id="kaggleInfo" style="font-size:0.8rem;color:var(--text2);"></div>
                <div class="flex-between mt-8">
                    <a class="link" onclick="promptDatasetURL('marathon')">+ Dataset Maratona</a>
                    <a class="link" onclick="promptDatasetURL('injury')">+ Dataset Lesões</a>
                </div>
            </div>

            <div class="card card-dark">
                <h3 style="font-size:0.8rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">Sua Semana</h3>
                <div id="weeklyBars" style="display:flex;gap:6px;align-items:flex-end;height:80px;"></div>
            </div>
        </div>

        <!-- Tela de Corrida -->
        <div class="screen" id="runScreen">
            <div class="map-container" id="map">
                <div class="map-gps-status" id="gpsStatus">🔍 Obtendo sinal GPS...</div>
            </div>
            <div class="card" style="text-align:center;">
                <div class="stat-val" id="runDist">0.00</div><div class="stat-lab">km</div>
                <div class="stat-row">
                    <div><div class="stat-val" id="runPace" style="font-size:1.5rem;">--</div><div class="stat-lab">/km</div></div>
                    <div><div class="stat-val" id="runTime" style="font-size:1.5rem;">00:00</div><div class="stat-lab">tempo</div></div>
                </div>
                <div style="display:flex;gap:12px;justify-content:center;margin-top:12px;">
                    <button class="btn btn-sm btn-outline" id="pauseResumeBtn" onclick="togglePause()">⏸ Pausar</button>
                    <button class="btn btn-sm btn-outline" onclick="manualLocate()" title="Centralizar na minha posição">📍</button>
                    <button class="btn btn-sm btn-outline" onclick="stopRun()" style="border-color:var(--danger);color:var(--danger);">⏹ Parar</button>
                </div>
            </div>
        </div>

        <!-- Tela de Metas -->
        <div class="screen" id="planScreen">
            <h2 style="margin-bottom:16px;">Planejar Meta</h2>
            <div class="card">
                <label class="slider-label">Distância Alvo</label>
                <select id="goalDist" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:#fff;margin-bottom:12px;">
                    <option value="5">5 km</option>
                    <option value="10" selected>10 km</option>
                    <option value="21.1">Meia Maratona (21.1 km)</option>
                    <option value="42.195">Maratona (42.195 km)</option>
                </select>
                <label class="slider-label">Tempo Desejado (min)</label>
                <input type="number" id="goalTime" value="60" min="10" max="600" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:#fff;margin-bottom:12px;">
                <label class="slider-label">Semanas até a prova</label>
                <input type="range" id="goalWeeks" min="4" max="24" value="12" oninput="document.getElementById('weeksDisp').textContent=this.value+' semanas'">
                <span id="weeksDisp" style="color:var(--accent);font-size:0.8rem;">12 semanas</span>
                <button class="btn mt-8" onclick="generatePlan()">GERAR PLANO</button>
            </div>
            <div id="planPreview" class="card card-dark hidden"></div>
        </div>

        <!-- Histórico -->
        <div class="screen" id="historyScreen">
            <h2 style="margin-bottom:16px;">Histórico</h2>
            <div id="historyList"></div>
        </div>

        <!-- Modal de Perfil -->
        <div id="profileModal" class="modal hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:center;justify-content:center;">
            <div class="card" style="width:90%;max-width:350px;">
                <h3 style="margin-bottom:12px;">Perfil</h3>
                <label>Pace 5K (min/km)</label>
                <input type="number" id="profilePace" step="0.1" style="width:100%;padding:8px;background:#1a1a1a;border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:12px;">
                <label>Km semanais atuais</label>
                <input type="number" id="profileKm" min="10" max="200" style="width:100%;padding:8px;background:#1a1a1a;border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:12px;">
                <label>Dias de descanso/semana</label>
                <input type="number" id="profileRest" min="0" max="7" style="width:100%;padding:8px;background:#1a1a1a;border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:12px;">
                <button class="btn" onclick="saveProfile()">SALVAR</button>
                <button class="btn btn-sm btn-outline mt-8" onclick="document.getElementById('profileModal').classList.add('hidden')">Cancelar</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="bottom-nav-item active" data-screen="dashboard" onclick="switchScreen('dashboard')">🏠 Início</button>
        <button class="bottom-nav-item" data-screen="plan" onclick="switchScreen('plan')">🎯 Metas</button>
        <button class="bottom-nav-item" data-screen="history" onclick="switchScreen('history')">📊 Histórico</button>
    </nav>

    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================
        // SERVICE WORKER
        // ============================================
        if('serviceWorker' in navigator){
            window.addEventListener('load',()=>{
                navigator.serviceWorker.register(
                    URL.createObjectURL(new Blob([`
                        self.addEventListener('install',e=>{self.skipWaiting();});
                        self.addEventListener('activate',e=>{clients.claim();});
                        self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});
                    `],{type:'application/javascript'}))
                );
            });
        }

        // ============================================
        // APP STATE
        // ============================================
        const APP_KEY = 'mindpace_v1';
        let appData = {
            userName: '',
            profile: { pace5k:6.0, restDays:2, intensity:1.0, weeklyKm:30 },
            plan: { active:false, weeks:[], goalDist:10, goalTime:60, weeksToRace:12, createdAt:null },
            logs: [],
            datasets: { marathon: null, injury: null, lastUpdate: null }
        };
        let currentRun = null;
        let map = null;
        let routeLine = null;
        let currentMarker = null;
        let userPosition = null;

        function loadData(){
            const s = localStorage.getItem(APP_KEY);
            if(s) try{ const parsed = JSON.parse(s); appData = {...appData, ...parsed}; }catch(e){}
        }
        function saveData(){
            localStorage.setItem(APP_KEY, JSON.stringify(appData));
        }

        // ============================================
        // NOME DO USUÁRIO (ENTER PARA SALVAR)
        // ============================================
        function setupUserNameInput(){
            const input = document.getElementById('userNameInput');
            input.value = appData.userName || '';
            input.addEventListener('keydown', function(e){
                if(e.key === 'Enter'){
                    e.preventDefault();
                    input.blur();
                    saveUserName(input.value.trim());
                }
            });
            input.addEventListener('blur', function(){
                saveUserName(input.value.trim());
            });
        }
        function saveUserName(name){
            if(name !== appData.userName){
                appData.userName = name;
                saveData();
                if(name) showToast('Nome salvo, ' + name + '!', 'success');
            }
        }

        // ============================================
        // ENGINE (DATASETS EXTERNOS)
        // ============================================
        class PredictionEngine {
            constructor() { this.marathonModel = null; this.injuryModel = null; }

            trainMarathon(data) {
                if(data.length < 3) return;
                const X = data.map(d => [d.km4week, d.sp4week]);
                const y = data.map(d => d.marathonTime);
                let sumX0=0, sumX1=0, sumY=0, sumX0X0=0, sumX1X1=0, sumX0X1=0, sumX0Y=0, sumX1Y=0;
                const n = X.length;
                for(let i=0; i<n; i++){
                    const [x0, x1] = X[i];
                    const yi = y[i];
                    sumX0 += x0; sumX1 += x1; sumY += yi;
                    sumX0X0 += x0*x0; sumX1X1 += x1*x1; sumX0X1 += x0*x1;
                    sumX0Y += x0*yi; sumX1Y += x1*yi;
                }
                const det = (n*sumX0X0*sumX1X1 + 2*sumX0*sumX1*sumX0X1 - n*sumX0X1*sumX0X1 - sumX0*sumX0*sumX1X1 - sumX1*sumX1*sumX0X0);
                if(Math.abs(det) < 0.001) return;
                const intercept = (sumY*sumX0X0*sumX1X1 + sumX0*sumX1X1*sumX1Y + sumX1*sumX0X1*sumX0Y - sumX1*sumX0X0*sumX1Y - sumX0*sumX0X1*sumY - sumX1X1*sumX0Y*sumX0) / det;
                const coefKm = (n*sumX1X1*sumX0Y + sumX1*sumX0X1*sumY + sumX0*sumX0X1*sumX1Y - sumX1*sumX1X1*sumX0Y - sumX0*sumX0X1*sumY - n*sumX0X1*sumX1Y) / det;
                const coefSpeed = (n*sumX0X0*sumX1Y + sumX0*sumX0X1*sumY + sumX1*sumX0X1*sumX0Y - sumX1*sumX0X0*sumX0Y - sumX0*sumX0X1*sumY - n*sumX0X1*sumX0Y) / det;
                this.marathonModel = { coefKm, coefSpeed, intercept };
            }

            predictMarathonTime(kmPerWeek, avgSpeed) {
                if(!this.marathonModel) return Math.round(320 - 1.2*kmPerWeek - 8.5*avgSpeed);
                const {coefKm, coefSpeed, intercept} = this.marathonModel;
                return Math.max(180, Math.min(300, Math.round(intercept + coefKm*kmPerWeek + coefSpeed*avgSpeed)));
            }

            trainInjury(data) {
                if(data.length < 5) return;
                let restW = -15, kmW = 10, exertW = 12, bias = -5;
                const lr = 0.005;
                for(let iter=0; iter<200; iter++){
                    let gB=0, gR=0, gK=0, gE=0;
                    for(const d of data){
                        const z = bias + restW*d.restDays + kmW*d.kmZ5 + exertW*d.avgExertion;
                        const pred = 1/(1+Math.exp(-z));
                        const err = pred - d.injured;
                        gB += err; gR += err*d.restDays; gK += err*d.kmZ5; gE += err*d.avgExertion;
                    }
                    bias -= lr*gB/data.length;
                    restW -= lr*gR/data.length;
                    kmW -= lr*gK/data.length;
                    exertW -= lr*gE/data.length;
                }
                this.injuryModel = { restDaysWeight:restW, kmZ5Weight:kmW, exertionWeight:exertW, bias };
            }

            injuryRisk(restDays, kmHighIntensity, avgExertion) {
                if(!this.injuryModel){
                    let score = 0;
                    if(restDays<1) score+=35; else if(restDays<2) score+=15;
                    if(kmHighIntensity>8) score+=30; else if(kmHighIntensity>5) score+=15;
                    if(avgExertion>8) score+=35; else if(avgExertion>6) score+=15;
                    return Math.min(100, score);
                }
                const {restDaysWeight, kmZ5Weight, exertionWeight, bias} = this.injuryModel;
                const z = bias + restDaysWeight*restDays + kmZ5Weight*kmHighIntensity + exertionWeight*avgExertion;
                return Math.min(100, Math.round(100/(1+Math.exp(-z))));
            }
        }
        const engine = new PredictionEngine();

        // ============================================
        // CARREGAMENTO DE DATASETS
        // ============================================
        async function fetchDataset(url, type) {
            try {
                showToast(`Carregando dataset ${type}...`, 'info');
                const response = await fetch(url);
                if(!response.ok) throw new Error('HTTP '+response.status);
                const csv = await response.text();
                const data = parseCSV(csv, type);
                if(data.length === 0) throw new Error('Formato inválido');
                appData.datasets[type] = data;
                appData.datasets.lastUpdate = new Date().toISOString();
                saveData();
                if(type === 'marathon') engine.trainMarathon(data);
                if(type === 'injury') engine.trainInjury(data);
                showToast(`Dataset ${type} carregado (${data.length} registos)`, 'success');
                updateKaggleInfo();
                return true;
            } catch(e) {
                showToast(`Erro: ${e.message}`, 'error');
                return false;
            }
        }
        function parseCSV(csv, type) {
            const lines = csv.split('\n').filter(l => l.trim());
            if(lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
            const data = [];
            for(let i=1; i<lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim().replace(/"/g,''));
                if(values.length !== headers.length) continue;
                const obj = {};
                for(let j=0; j<headers.length; j++) obj[headers[j]] = parseFloat(values[j]) || values[j];
                if(type === 'marathon' && obj.km4week !== undefined && obj.sp4week !== undefined && obj.marathonTime !== undefined) {
                    data.push({km4week:+obj.km4week, sp4week:+obj.sp4week, marathonTime:+obj.marathonTime});
                } else if(type === 'injury' && obj.restDays !== undefined && obj.kmZ5 !== undefined && obj.avgExertion !== undefined && obj.injured !== undefined) {
                    data.push({restDays:+obj.restDays, kmZ5:+obj.kmZ5, avgExertion:+obj.avgExertion, injured:+obj.injured});
                }
            }
            return data;
        }
        function updateKaggleInfo() {
            const infoDiv = document.getElementById('kaggleInfo');
            let html = '';
            const marathonData = appData.datasets.marathon;
            const injuryData = appData.datasets.injury;
            if(marathonData) {
                const pred = engine.predictMarathonTime(appData.profile.weeklyKm, 60/appData.profile.pace5k);
                html += `📊 Maratona Prevista: <b>${pred} min</b><br>`;
            } else html += `📊 Dataset Maratona: <a class="link" onclick="promptDatasetURL('marathon')">carregar</a><br>`;
            if(injuryData) {
                const risk = engine.injuryRisk(appData.profile.restDays, 4, 6);
                html += `⚠️ Risco de Lesão: <b>${risk}%</b><br>`;
            } else html += `⚠️ Dataset Lesões: <a class="link" onclick="promptDatasetURL('injury')">carregar</a><br>`;
            html += `🗺️ GPS real ativo.`;
            infoDiv.innerHTML = html;
        }
        function promptDatasetURL(type) {
            const url = prompt(`URL do CSV público para "${type}":`);
            if(url) fetchDataset(url, type);
        }

        // ============================================
        // GPS & MAPA
        // ============================================
        function initMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-8.0100, -34.8549], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            routeLine = L.polyline([], { color: '#4ade80', weight: 4 }).addTo(map);
            map.locate({ setView: true, maxZoom: 16, timeout: 10000 });
            map.on('locationfound', (e) => {
                userPosition = e.latlng;
                const gpsStatus = document.getElementById('gpsStatus');
                if(gpsStatus){ gpsStatus.textContent = '📍 GPS pronto'; gpsStatus.classList.add('ready'); }
                if(!currentRun) map.setView(e.latlng, 16);
            });
            map.on('locationerror', () => {
                document.getElementById('gpsStatus').textContent = '⚠️ GPS indisponível';
                showToast('Ative o GPS do dispositivo.', 'error');
            });
        }
        function manualLocate() {
            if(map){
                document.getElementById('gpsStatus').textContent = '🔍 Procurando...';
                document.getElementById('gpsStatus').classList.remove('ready');
                map.locate({ setView: true, maxZoom: 16 });
            }
        }
        function startRun() {
            if(!navigator.geolocation) { alert('Geolocalização não suportada.'); return; }
            const workout = getTodayWorkout();
            const plannedDist = workout ? workout.dist : 5;
            currentRun = {
                startTime: Date.now(),
                paused: false,
                positions: [],
                distance: 0,
                plannedDist: plannedDist,
                watchId: null
            };
            switchScreen('run');
            initMap();
            routeLine.setLatLngs([]);
            if(currentMarker) map.removeLayer(currentMarker);
            currentMarker = null;
            document.getElementById('gpsStatus').textContent = '🔍 Aguardando GPS...';
            document.getElementById('gpsStatus').classList.remove('ready');
            if(userPosition) map.setView(userPosition, 16);
            else map.locate({ setView: true, maxZoom: 16 });
            if(currentRun.watchId) navigator.geolocation.clearWatch(currentRun.watchId);
            currentRun.watchId = navigator.geolocation.watchPosition(
                pos => {
                    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    userPosition = latlng;
                    document.getElementById('gpsStatus').textContent = '📍 GPS ativo';
                    document.getElementById('gpsStatus').classList.add('ready');
                    if(currentRun.paused) return;
                    if(currentRun.positions.length > 0) {
                        const last = currentRun.positions[currentRun.positions.length-1];
                        const d = haversine(last.lat, last.lng, latlng.lat, latlng.lng);
                        if(d > 0.002) {
                            currentRun.distance += d;
                            currentRun.positions.push({ lat: latlng.lat, lng: latlng.lng, time: Date.now() });
                            routeLine.addLatLng([latlng.lat, latlng.lng]);
                            if(currentMarker) currentMarker.setLatLng([latlng.lat, latlng.lng]);
                            else currentMarker = L.circleMarker([latlng.lat, latlng.lng], { radius: 6, color: 'white', fillColor: '#4ade80', fillOpacity: 1 }).addTo(map);
                            map.panTo([latlng.lat, latlng.lng], { animate: true, duration: 0.5 });
                            updateRunDisplay();
                        }
                    } else {
                        currentRun.positions.push({ lat: latlng.lat, lng: latlng.lng, time: Date.now() });
                        routeLine.addLatLng([latlng.lat, latlng.lng]);
                        currentMarker = L.circleMarker([latlng.lat, latlng.lng], { radius: 6, color: 'white', fillColor: '#4ade80', fillOpacity: 1 }).addTo(map);
                        map.setView([latlng.lat, latlng.lng], 16);
                    }
                },
                err => {
                    console.warn('Erro GPS:', err);
                    document.getElementById('gpsStatus').textContent = '⚠️ Erro no GPS';
                    showToast('Erro na localização. Verifique as permissões.', 'error');
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
            );
            document.getElementById('startRunBtn').disabled = false;
        }
        function togglePause() {
            if(!currentRun) return;
            currentRun.paused = !currentRun.paused;
            document.getElementById('pauseResumeBtn').textContent = currentRun.paused ? '▶ Retomar' : '⏸ Pausar';
        }
        function stopRun() {
            if(!currentRun) return;
            if(currentRun.watchId) navigator.geolocation.clearWatch(currentRun.watchId);
            const dist = currentRun.distance;
            const dur = Math.floor((Date.now() - currentRun.startTime)/1000);
            const pace = dist > 0.05 ? (dur/60)/dist : 0;
            appData.logs.unshift({
                date: new Date().toISOString(),
                distance: dist,
                duration: dur,
                pace: pace,
                intensity: appData.profile.intensity
            });
            saveData();
            showToast(`Corrida salva: ${dist.toFixed(2)}km em ${formatTime(dur)}`);
            currentRun = null;
            switchScreen('dashboard');
            updateDashboard();
            updateHistory();
        }
        function updateRunDisplay() {
            if(!currentRun) return;
            const dist = currentRun.distance;
            const elapsed = Math.floor((Date.now() - currentRun.startTime)/1000);
            const pace = dist > 0.05 ? (elapsed/60)/dist : 0;
            document.getElementById('runDist').textContent = dist.toFixed(2);
            document.getElementById('runPace').textContent = dist > 0.05 ? formatPace(pace) : '--';
            document.getElementById('runTime').textContent = formatTime(elapsed);
        }

        // ============================================
        // PLANEJAMENTO
        // ============================================
        function getTodayWorkout() {
            if(!appData.plan.active || !appData.plan.weeks.length) return null;
            const elapsed = Math.floor((Date.now() - new Date(appData.plan.createdAt).getTime())/(86400000));
            const weekIdx = Math.floor(elapsed/7);
            if(weekIdx >= appData.plan.weeks.length) return null;
            const week = appData.plan.weeks[weekIdx];
            const dow = new Date().getDay();
            let type='easy', dist=week.easyRun;
            if(dow===5||dow===6){ dist=week.longRun; type='longo'; }
            else if(dow===2){ dist=week.speedWork; type='velocidade'; }
            return {dist, type};
        }
        function generatePlan() {
            const dist = parseFloat(document.getElementById('goalDist').value);
            const time = parseInt(document.getElementById('goalTime').value);
            const weeks = parseInt(document.getElementById('goalWeeks').value);
            appData.plan = { active:true, goalDist:dist, goalTime:time, weeksToRace:weeks, createdAt: new Date().toISOString(), weeks:[] };
            const targetPace = time/dist;
            const maxLongRun = dist * 0.75;
            for(let w=1; w<=weeks; w++){
                const p = w/weeks;
                const weekDist = (20 + p*40) * (dist/10);
                const longRun = Math.round(maxLongRun * p);
                const easyRuns = Math.round((weekDist - longRun) * 0.6 / 3);
                const speedWork = Math.round((weekDist - longRun) * 0.4);
                appData.plan.weeks.push({ week:w, totalKm:Math.round(weekDist), longRun, easyRun:easyRuns, speedWork, targetPace: targetPace * (1 - p*0.15) });
            }
            saveData();
            document.getElementById('planPreview').classList.remove('hidden');
            document.getElementById('planPreview').innerHTML = `
                <h3 style="color:var(--accent);">Plano ${weeks} semanas</h3>
                <p style="font-size:0.8rem;">Meta: ${dist}km em ${time}min</p>
                ${appData.plan.weeks.slice(0,6).map(w=>`
                    <div style="font-size:0.75rem;display:flex;justify-content:space-between;margin-top:4px;">
                        <span>S${w.week}</span><span>${w.totalKm}km</span><span>Longo ${w.longRun}km</span><span style="color:var(--accent);">Pace ${w.targetPace.toFixed(1)}</span>
                    </div>
                `).join('')}
                <p style="font-size:0.7rem;color:var(--text3);">...</p>
            `;
            updateDashboard();
            showToast('Plano gerado!', 'success');
        }

        // ============================================
        // UI AUXILIAR
        // ============================================
        function switchScreen(name) {
            document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
            const id = name==='dashboard'?'dashboardScreen': name==='plan'?'planScreen': name==='history'?'historyScreen': 'runScreen';
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.bottom-nav-item').forEach(b=>b.classList.remove('active'));
            const btn = document.querySelector(`[data-screen="${name}"]`);
            if(btn) btn.classList.add('active');
            if(name==='run'){ document.getElementById('mainContent').style.overflowY='hidden'; if(map) setTimeout(()=>map.invalidateSize(),100); }
            else document.getElementById('mainContent').style.overflowY='auto';
        }
        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `toast ${type}`;
            setTimeout(()=>t.classList.add('hidden'), 2500);
        }
        function updateGreeting() {
            const h = new Date().getHours();
            const g = h<12?'Bom dia': h<18?'Boa tarde':'Boa noite';
            document.getElementById('greeting').textContent = g + ',';
        }
        function updateDashboard() {
            const workout = getTodayWorkout();
            const dist = workout ? workout.dist : 5;
            const type = workout ? (workout.type==='longo'?'Longão': workout.type==='velocidade'?'Velocidade':'Corrida Leve') : 'Corrida Leve';
            const intensity = appData.profile.intensity || 1;
            const basePace = appData.profile.pace5k * (1 + 0.15*intensity);
            document.getElementById('dist').textContent = dist.toFixed(1);
            document.getElementById('pace').textContent = formatPace(basePace);
            document.getElementById('dur').textContent = Math.round(dist * basePace);
            document.getElementById('workoutType').textContent = type;
            const bars = document.getElementById('weeklyBars');
            const days = ['D','S','T','Q','Q','S','S'];
            const today = new Date().getDay();
            let html='';
            for(let i=0;i<7;i++){
                const h = i<=today ? 25+Math.random()*45 : 10;
                const c = h>45 ? 'var(--warn)' : 'var(--accent)';
                html += `<div style="flex:1;text-align:center;"><div style="width:100%;height:${h}px;background:${c};opacity:0.8;border-radius:6px 6px 0 0;"></div><span style="font-size:0.6rem;color:var(--text3);">${days[i]}</span></div>`;
            }
            bars.innerHTML=html;
            updateKaggleInfo();
        }
        function updateIntensity(val) {
            appData.profile.intensity = parseFloat(val);
            updateDashboard();
            saveData();
        }
        function updateHistory() {
            const list = document.getElementById('historyList');
            if(!appData.logs.length){
                list.innerHTML='<p style="color:var(--text3);text-align:center;padding:40px;">Nenhuma corrida registrada.</p>';
                return;
            }
            list.innerHTML = appData.logs.map(l=>`
                <div class="card" style="padding:12px;margin-bottom:8px;">
                    <div class="flex-between">
                        <span style="font-size:0.7rem;color:var(--text3);">${new Date(l.date).toLocaleDateString('pt-BR')}</span>
                        <span class="badge badge-green">${l.distance.toFixed(2)}km</span>
                    </div>
                    <div style="font-size:0.8rem;color:var(--text2);margin-top:4px;">⏱ ${formatTime(l.duration)} | 🏃 ${l.pace.toFixed(2)}/km | 🔥 ${l.intensity.toFixed(2)}x</div>
                </div>
            `).join('');
        }
        function editProfile() {
            document.getElementById('profilePace').value = appData.profile.pace5k;
            document.getElementById('profileKm').value = appData.profile.weeklyKm;
            document.getElementById('profileRest').value = appData.profile.restDays;
            document.getElementById('profileModal').classList.remove('hidden');
        }
        function saveProfile() {
            appData.profile.pace5k = parseFloat(document.getElementById('profilePace').value)||6;
            appData.profile.weeklyKm = parseInt(document.getElementById('profileKm').value)||30;
            appData.profile.restDays = parseInt(document.getElementById('profileRest').value)||2;
            saveData();
            updateDashboard();
            document.getElementById('profileModal').classList.add('hidden');
            showToast('Perfil atualizado');
        }
        function resetApp() {
            if(confirm('Apagar todos os dados?')){
                localStorage.removeItem(APP_KEY);
                appData = {
                    userName: '',
                    profile: { pace5k:6.0, restDays:2, intensity:1.0, weeklyKm:30 },
                    plan: { active:false, weeks:[], goalDist:10, goalTime:60, weeksToRace:12, createdAt:null },
                    logs: [],
                    datasets: { marathon: null, injury: null, lastUpdate: null }
                };
                document.getElementById('userNameInput').value = '';
                updateDashboard();
                updateHistory();
                showToast('Dados resetados');
            }
        }
        function haversine(lat1, lon1, lat2, lon2) {
            const R=6371;
            const dLat=(lat2-lat1)*Math.PI/180;
            const dLon=(lon2-lon1)*Math.PI/180;
            const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        function formatPace(m){ const min=Math.floor(m); const sec=Math.round((m-min)*60); return `${min}:${sec.toString().padStart(2,'0')}`; }
        function formatTime(s){ const min=Math.floor(s/60); const sec=s%60; return `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }

        // ============================================
        // INIT
        // ============================================
        function init() {
            loadData();
            setupUserNameInput();
            document.getElementById('intensitySlider').value = appData.profile.intensity;
            updateGreeting();
            updateDashboard();
            updateHistory();
            if(appData.datasets.marathon) engine.trainMarathon(appData.datasets.marathon);
            if(appData.datasets.injury) engine.trainInjury(appData.datasets.injury);
            setInterval(updateGreeting, 60000);
        }
        window.addEventListener('load', init);
        window.addEventListener('resize', ()=>{ document.body.style.height = window.innerHeight+'px'; });
        document.body.style.height = window.innerHeight+'px';
    </script>
