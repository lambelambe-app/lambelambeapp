    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --glass: rgba(18,18,18,0.75);
            --border: rgba(255,255,255,0.08);
            --text: #fff;
            --text2: rgba(255,255,255,0.6);
            --text3: rgba(255,255,255,0.35);
            --accent: #4ade80;
            --warn: #fbbf24;
            --danger: #ef4444;
            --radius: 20px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Inter',system-ui,sans-serif;
            background:var(--bg);
            color:var(--text);
            height:100vh;height:100dvh;
            display:flex;flex-direction:column;
            overflow:hidden;
            -webkit-tap-highlight-color:transparent;
            user-select:none;
        }
        .top-nav{
            display:flex;align-items:center;justify-content:space-between;
            padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));
            background:var(--glass);backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);z-index:10;
        }
        .top-nav h1{font-size:1.1rem;font-weight:600;letter-spacing:-0.01em;}
        .nav-btn{background:none;border:none;color:var(--text2);font-size:1.2rem;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
        .main-content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
        .screen{display:none;animation:fadeIn 0.3s;}
        .screen.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
        .card{
            background:var(--glass);backdrop-filter:blur(20px);
            border:1px solid var(--border);border-radius:var(--radius);
            padding:20px;margin-bottom:16px;
        }
        .card-dark{background:rgba(10,10,10,0.8);}
        .greeting{font-size:0.8rem;color:var(--text3);}
        .user-name{font-size:1.4rem;font-weight:600;background:linear-gradient(135deg,#4ade80,#22d3bb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .stat-row{display:flex;justify-content:space-around;align-items:center;margin:16px 0;}
        .stat-val{font-size:2rem;font-weight:700;font-family:'SF Mono','Fira Code',monospace;}
        .stat-lab{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;}
        .divider{width:1px;height:40px;background:var(--border);}
        .slider-section{margin:16px 0;}
        .slider-label{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;}
        input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,#4ade80,#fbbf24,#ef4444);outline:none;margin:8px 0;}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:pointer;}
        .btn{
            display:flex;align-items:center;justify-content:center;gap:8px;
            width:100%;padding:16px;border:none;border-radius:var(--radius);
            background:var(--accent);color:#000;font-weight:700;
            font-size:0.95rem;letter-spacing:0.03em;cursor:pointer;
            transition:all 0.2s;
        }
        .btn:active{transform:scale(0.98);opacity:0.9;}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
        .btn-sm{padding:10px 16px;font-size:0.8rem;width:auto;display:inline-flex;}
        .bottom-nav{
            display:flex;justify-content:space-around;align-items:center;
            padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));
            background:var(--glass);backdrop-filter:blur(20px);
            border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:10;
        }
        .bottom-nav-item{
            display:flex;flex-direction:column;align-items:center;gap:4px;
            background:none;border:none;color:var(--text3);cursor:pointer;
            padding:8px 16px;border-radius:12px;transition:0.2s;
        }
        .bottom-nav-item.active{color:var(--accent);}
        .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;letter-spacing:0.05em;}
        .badge-green{background:var(--accent);color:#000;}
        .badge-yellow{background:var(--warn);color:#000;}
        .badge-red{background:var(--danger);}
        .map-container{height:300px;border-radius:12px;margin:16px 0;overflow:hidden;background:#1a1a1a;position:relative;}
        .map-gps-status{
            position:absolute;top:10px;left:50%;transform:translateX(-50%);
            background:rgba(0,0,0,0.7);color:var(--warn);padding:6px 12px;
            border-radius:20px;font-size:0.7rem;z-index:1000;
            backdrop-filter:blur(10px);transition:all 0.3s;
        }
        .map-gps-status.ready{color:var(--accent);}
        .toast{
            position:fixed;bottom:100px;left:20px;right:20px;z-index:200;
            padding:14px 20px;border-radius:12px;text-align:center;
            font-size:0.85rem;font-weight:500;animation:slideUp 0.3s;
        }
        .toast.success{background:var(--accent);color:#000;}
        .toast.error{background:var(--danger);}
        .toast.info{background:rgba(255,255,255,0.9);color:#000;}
        @keyframes slideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
        .hidden{display:none!important;}
        .text-accent{color:var(--accent);}
        .text-warn{color:var(--warn);}
        .text-danger{color:var(--danger);}
        .mt-8{margin-top:8px;}
        .mb-8{margin-bottom:8px;}
        .flex-between{display:flex;justify-content:space-between;align-items:center;}
        .link{color:var(--accent);text-decoration:underline;cursor:pointer;font-size:0.8rem;}
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="top-nav">
        <button class="nav-btn" id="profileBtn" onclick="editProfile()">👤</button>
        <h1>RunMate</h1>
        <button class="nav-btn" onclick="resetApp()">↺</button>
    </div>

    <main class="main-content" id="mainContent">
        <!-- Dashboard -->
        <div class="screen active" id="dashboardScreen">
            <div class="card">
                <p class="greeting" id="greeting"></p>
                <h2 class="user-name">Corredor</h2>
            </div>

            <div class="card" id="nextWorkoutCard">
                <div class="flex-between mb-8">
                    <span class="badge badge-green">HOJE</span>
                    <span style="font-size:0.9rem;color:var(--text2);" id="workoutType">Corrida Leve</span>
                </div>
                <div class="stat-row" id="workoutStats">
                    <div><div class="stat-val" id="dist">5.0</div><div class="stat-lab">km</div></div>
                    <div class="divider"></div>
                    <div><div class="stat-val" id="pace">6:00</div><div class="stat-lab">/km</div></div>
                    <div class="divider"></div>
                    <div><div class="stat-val" id="dur">30</div><div class="stat-lab">min</div></div>
                </div>
                <div class="slider-section">
                    <div class="slider-label">Sensação de Hoje (ajusta o ritmo)</div>
                    <input type="range" id="intensitySlider" min="0.5" max="1.5" step="0.05" value="1.0" oninput="updateIntensity(this.value)">
                    <div style="display:flex;justify-content:space-between;font-size:0.6rem;color:var(--text3);">
                        <span>Fácil</span><span>Normal</span><span>Intenso</span>
                    </div>
                </div>
                <button class="btn" onclick="startRun()" id="startRunBtn">▶ INICIAR CORRIDA</button>
            </div>

            <!-- Painel de datasets Kaggle -->
            <div class="card card-dark">
                <h3 style="font-size:0.8rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">📡 Dados Externos (Kaggle)</h3>
                <div id="kaggleInfo" style="font-size:0.8rem;color:var(--text2);"></div>
                <div class="flex-between mt-8">
                    <a class="link" onclick="promptDatasetURL('marathon')">+ Dataset Maratona</a>
                    <a class="link" onclick="promptDatasetURL('injury')">+ Dataset Lesões</a>
                </div>
            </div>

            <div class="card card-dark">
                <h3 style="font-size:0.8rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">Sua Semana</h3>
                <div id="weeklyBars" style="display:flex;gap:6px;align-items:flex-end;height:80px;"></div>
            </div>
        </div>

        <!-- Tela de Corrida -->
        <div class="screen" id="runScreen">
            <div class="map-container" id="map">
                <div class="map-gps-status" id="gpsStatus">🔍 Obtendo sinal GPS...</div>
            </div>
            <div class="card" style="text-align:center;">
                <div class="stat-val" id="runDist">0.00</div><div class="stat-lab">km</div>
                <div class="stat-row">
                    <div><div class="stat-val" id="runPace" style="font-size:1.5rem;">--</div><div class="stat-lab">/km</div></div>
                    <div><div class="stat-val" id="runTime" style="font-size:1.5rem;">00:00</div><div class="stat-lab">tempo</div></div>
                </div>
                <div style="display:flex;gap:12px;justify-content:center;margin-top:12px;">
                    <button class="btn btn-sm btn-outline" id="pauseResumeBtn" onclick="togglePause()">⏸ Pausar</button>
                    <button class="btn btn-sm btn-outline" onclick="manualLocate()" title="Centralizar na minha posição">📍</button>
                    <button class="btn btn-sm btn-outline" onclick="stopRun()" style="border-color:var(--danger);color:var(--danger);">⏹ Parar</button>
                </div>
            </div>
        </div>

        <!-- Tela de Metas -->
        <div class="screen" id="planScreen">
            <h2 style="margin-bottom:16px;">Planejar Meta</h2>
            <div class="card">
                <label class="slider-label">Distância Alvo</label>
                <select id="goalDist" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:#fff;margin-bottom:12px;">
                    <option value="5">5 km</option>
                    <option value="10" selected>10 km</option>
                    <option value="21.1">Meia Maratona (21.1 km)</option>
                    <option value="42.195">Maratona (42.195 km)</option>
                </select>
                <label class="slider-label">Tempo Desejado (min)</label>
                <input type="number" id="goalTime" value="60" min="10" max="600" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:#fff;margin-bottom:12px;">
                <label class="slider-label">Semanas até a prova</label>
                <input type="range" id="goalWeeks" min="4" max="24" value="12" oninput="document.getElementById('weeksDisp').textContent=this.value+' semanas'">
                <span id="weeksDisp" style="color:var(--accent);font-size:0.8rem;">12 semanas</span>
                <button class="btn mt-8" onclick="generatePlan()">GERAR PLANO</button>
            </div>
            <div id="planPreview" class="card card-dark hidden"></div>
        </div>

        <!-- Histórico -->
        <div class="screen" id="historyScreen">
            <h2 style="margin-bottom:16px;">Histórico</h2>
            <div id="historyList"></div>
        </div>

        <!-- Modal de Perfil -->
        <div id="profileModal" class="modal hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:center;justify-content:center;">
            <div class="card" style="width:90%;max-width:350px;">
                <h3 style="margin-bottom:12px;">Perfil</h3>
                <label>Pace 5K (min/km)</label>
                <input type="number" id="profilePace" step="0.1" style="width:100%;padding:8px;background:#1a1a1a;border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:12px;">
                <label>Dias de descanso/semana</label>
                <input type="number" id="profileRest" min="0" max="7" style="width:100%;padding:8px;background:#1a1a1a;border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:12px;">
                <button class="btn" onclick="saveProfile()">SALVAR</button>
                <button class="btn btn-sm btn-outline mt-8" onclick="document.getElementById('profileModal').classList.add('hidden')">Cancelar</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="bottom-nav-item active" data-screen="dashboard" onclick="switchScreen('dashboard')">🏠 Início</button>
        <button class="bottom-nav-item" data-screen="plan" onclick="switchScreen('plan')">🎯 Metas</button>
        <button class="bottom-nav-item" data-screen="history" onclick="switchScreen('history')">📊 Histórico</button>
    </nav>

    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================
        // SERVICE WORKER
        // ============================================
        if('serviceWorker' in navigator){
            window.addEventListener('load',()=>{
                navigator.serviceWorker.register(
                    URL.createObjectURL(new Blob([`
                        self.addEventListener('install',e=>{self.skipWaiting();});
                        self.addEventListener('activate',e=>{clients.claim();});
                        self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});
                    `],{type:'application/javascript'}))
                );
            });
        }

        // ============================================
        // APP STATE
        // ============================================
        const APP_KEY = 'runmate_v5';
        let appData = {
            profile: { pace5k:6.0, restDays:2, intensity:1.0, weeklyKm:30 },
            plan: { active:false, weeks:[], goalDist:10, goalTime:60, weeksToRace:12, createdAt:null },
            logs: [],
            datasets: { marathon: null, injury: null, lastUpdate: null }
        };
        let currentRun = null;
        let map = null;
        let routeLine = null;
        let currentMarker = null;
        let userPosition = null; // última posição conhecida

        function loadData(){
            const s = localStorage.getItem(APP_KEY);
            if(s) try{ appData = {...appData, ...JSON.parse(s)}; }catch(e){}
        }
        function saveData(){
            localStorage.setItem(APP_KEY, JSON.stringify(appData));
        }

        // ============================================
        // ENGINE (DATASETS EXTERNOS)
        // ============================================
        class PredictionEngine {
            constructor() { this.marathonModel = null; this.injuryModel = null; }
            trainMarathon(data) { /* ... mesma implementação ... */ }
            // (mantida a implementação anterior da classe PredictionEngine com gradiente descendente)
        }
        const engine = new PredictionEngine();

        async function fetchDataset(url, type) {
            // mesma implementação do fetchDataset anterior...
            showToast(`Dataset ${type} carregado (placeholder - implementação completa no código anterior)`, 'info');
        }
        function promptDatasetURL(type) {
            const url = prompt(`URL do CSV público para "${type}":`);
            if(url) fetchDataset(url, type);
        }

        // ============================================
        // MÓDULO GPS E MAPA (CORRIGIDO)
        // ============================================
        function initMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-8.0100, -34.8549], 13); // Olinda como fallback inicial
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            routeLine = L.polyline([], { color: '#4ade80', weight: 4 }).addTo(map);
            
            // Tenta obter a posição do usuário imediatamente
            map.locate({ setView: true, maxZoom: 16, timeout: 10000 });
            map.on('locationfound', onLocationFound);
            map.on('locationerror', onLocationError);
        }

        function onLocationFound(e) {
            userPosition = e.latlng;
            const gpsStatus = document.getElementById('gpsStatus');
            if(gpsStatus) {
                gpsStatus.textContent = '📍 GPS pronto';
                gpsStatus.classList.add('ready');
            }
            if(!currentRun) {
                // Se não estiver em corrida, apenas centraliza
                map.setView(e.latlng, 16);
            }
        }

        function onLocationError(e) {
            document.getElementById('gpsStatus').textContent = '⚠️ GPS indisponível';
            showToast('Ative o GPS do dispositivo para usar o mapa.', 'error');
        }

        function manualLocate() {
            if(map) {
                document.getElementById('gpsStatus').textContent = '🔍 Procurando...';
                document.getElementById('gpsStatus').classList.remove('ready');
                map.locate({ setView: true, maxZoom: 16 });
            }
        }

        function startRun() {
            if(!navigator.geolocation) {
                alert('Geolocalização não suportada.');
                return;
            }
            const workout = getTodayWorkout();
            const plannedDist = workout ? workout.dist : 5;
            currentRun = {
                startTime: Date.now(),
                paused: false,
                positions: [],
                distance: 0,
                plannedDist: plannedDist,
                watchId: null
            };
            switchScreen('run');
            initMap();
            
            // Limpa estado anterior
            routeLine.setLatLngs([]);
            if(currentMarker) map.removeLayer(currentMarker);
            currentMarker = null;
            
            // Centraliza na última posição conhecida ou força nova localização
            if(userPosition) {
                map.setView(userPosition, 16);
                document.getElementById('gpsStatus').textContent = '📍 Aguardando movimento...';
            } else {
                map.locate({ setView: true, maxZoom: 16 });
            }

            // Inicia o rastreamento contínuo
            if(currentRun.watchId) navigator.geolocation.clearWatch(currentRun.watchId);
            currentRun.watchId = navigator.geolocation.watchPosition(
                pos => {
                    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    userPosition = latlng;
                    document.getElementById('gpsStatus').textContent = '📍 GPS ativo';
                    document.getElementById('gpsStatus').classList.add('ready');
                    
                    if(currentRun.paused) return;
                    
                    if(currentRun.positions.length > 0) {
                        const last = currentRun.positions[currentRun.positions.length-1];
                        const d = haversine(last.lat, last.lng, latlng.lat, latlng.lng);
                        if(d > 0.002) { // ~20 metros
                            currentRun.distance += d;
                            currentRun.positions.push({ lat: latlng.lat, lng: latlng.lng, time: Date.now() });
                            routeLine.addLatLng([latlng.lat, latlng.lng]);
                            if(currentMarker) currentMarker.setLatLng([latlng.lat, latlng.lng]);
                            else currentMarker = L.circleMarker([latlng.lat, latlng.lng], { radius: 6, color: 'white', fillColor: '#4ade80', fillOpacity: 1 }).addTo(map);
                            map.panTo([latlng.lat, latlng.lng], { animate: true, duration: 0.5 });
                            updateRunDisplay();
                        }
                    } else {
                        // Primeira posição
                        currentRun.positions.push({ lat: latlng.lat, lng: latlng.lng, time: Date.now() });
                        routeLine.addLatLng([latlng.lat, latlng.lng]);
                        currentMarker = L.circleMarker([latlng.lat, latlng.lng], { radius: 6, color: 'white', fillColor: '#4ade80', fillOpacity: 1 }).addTo(map);
                        map.setView([latlng.lat, latlng.lng], 16);
                    }
                },
                err => {
                    console.warn('Erro GPS:', err);
                    document.getElementById('gpsStatus').textContent = '⚠️ Erro no GPS';
                    showToast('Erro ao obter localização. Verifique as permissões.', 'error');
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
            );
        }

        function togglePause() {
            if(!currentRun) return;
            currentRun.paused = !currentRun.paused;
            document.getElementById('pauseResumeBtn').textContent = currentRun.paused ? '▶ Retomar' : '⏸ Pausar';
        }

        function stopRun() {
            if(!currentRun) return;
            if(currentRun.watchId) navigator.geolocation.clearWatch(currentRun.watchId);
            const dist = currentRun.distance;
            const dur = Math.floor((Date.now() - currentRun.startTime)/1000);
            const pace = dist > 0.05 ? (dur/60)/dist : 0;
            appData.logs.unshift({
                date: new Date().toISOString(),
                distance: dist,
                duration: dur,
                pace: pace,
                intensity: appData.profile.intensity
            });
            saveData();
            showToast(`Corrida salva: ${dist.toFixed(2)}km em ${formatTime(dur)}`);
            currentRun = null;
            switchScreen('dashboard');
            updateDashboard();
            updateHistory();
        }

        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1)*Math.PI/180;
            const dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        function formatPace(minPerKm) {
            const m = Math.floor(minPerKm);
            const s = Math.round((minPerKm-m)*60);
            return `${m}:${s.toString().padStart(2,'0')}`;
        }
        function formatTime(sec) {
            const m = Math.floor(sec/60);
            const s = sec%60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
        // ... (demais funções UI como switchScreen, showToast, updateDashboard, etc., mantidas)
    </script>
</body>
