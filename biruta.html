<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>Pirâmide de Areia - Biruta 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-wrapper {
            width: 100vw;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2d3436;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ad-placeholder {
            width: 100vw;
            height: 60px;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 14px;
            letter-spacing: 1px;
            border-top: 1px solid #333;
            flex-shrink: 0;
        }
        #info-overlay {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            color: #fff;
            font-size: 14px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            opacity: 0.9;
            letter-spacing: 0.4px;
            background: rgba(0,0,0,0.4);
            padding: 6px 16px;
            border-radius: 20px;
            z-index: 10;
        }
        #wind-label {
            position: fixed;
            top: 15px;
            right: 20px;
            pointer-events: none;
            color: #ffeaa7;
            font-size: 14px;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container"></div>
    </div>
    <div id="ad-placeholder">📢 Espaço para anúncios</div>
    <div id="wind-label">🌬️ Vento: --</div>
    <div id="info-overlay">Toque nos cubos para remover • Não derrube o palito!</div>

    <script src="https://cdn.jsdelivr.net/npm/phaser-ce@2.15.1/build/phaser.min.js"></script>
    <script>
        (function() {
            const GRID_SIZE = 7;
            const NUM_LAYERS = 4;
            const TILE_W = 34;
            const TILE_H = 17;
            const SIDE_H = 15;
            const LAYER_H = 22;
            const STICK_HEIGHT_ABOVE = 70;
            const STICK_MAX_LEAN = 28;

            const gameState = {
                cubes: {},
                windAngle: Math.random() * Math.PI * 2,
                windStrength: 0.6 + Math.random() * 0.4,
                stickLeanX: 0,
                stickLeanY: 0,
                score: 0,
                gameOver: false,
                totalCubes: 0,
                removedCubes: 0,
                centerGx: Math.floor(GRID_SIZE / 2),
                centerGy: Math.floor(GRID_SIZE / 2),
            };

            const game = new Phaser.Game({
                width: 600,
                height: 400,
                renderer: Phaser.AUTO,
                parent: 'game-container',
                transparent: false,
                backgroundColor: '#2d3436',
                antialias: true,
                scaleMode: Phaser.ScaleManager.SHOW_ALL,
                pageAlignHorizontally: true,
                pageAlignVertically: true,
            });

            function createCubeTexture(game) {
                const bmd = game.make.bitmapData(TILE_W + SIDE_H + 4, TILE_H + SIDE_H + 8);
                const ctx = bmd.ctx;
                const hw = TILE_W / 2, hh = TILE_H / 2, sh = SIDE_H;
                const cx = hw, cy = hh;

                // Face superior
                ctx.fillStyle = '#f0dca8';
                ctx.strokeStyle = '#c4a96a';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(cx, 0);
                ctx.lineTo(TILE_W, hh);
                ctx.lineTo(cx, TILE_H);
                ctx.lineTo(0, hh);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Face esquerda
                ctx.fillStyle = '#c9a96e';
                ctx.strokeStyle = '#a0844c';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, hh);
                ctx.lineTo(cx, TILE_H);
                ctx.lineTo(cx, TILE_H + sh);
                ctx.lineTo(0, hh + sh);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Face direita
                ctx.fillStyle = '#a6844a';
                ctx.strokeStyle = '#7d6338';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cx, TILE_H);
                ctx.lineTo(TILE_W, hh);
                ctx.lineTo(TILE_W, hh + sh);
                ctx.lineTo(cx, TILE_H + sh);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Brilho
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.beginPath();
                ctx.moveTo(cx, 0);
                ctx.lineTo(cx + hw * 0.5, hh * 0.5);
                ctx.lineTo(cx, hh * 0.7);
                ctx.lineTo(cx - hw * 0.5, hh * 0.5);
                ctx.closePath();
                ctx.fill();

                bmd.dirty = true;
                return bmd;
            }

            const BootState = {
                preload: function() {
                    // Não há assets para carregar, apenas criamos a textura
                },
                create: function() {
                    this.game.state.start('Game');
                }
            };

            const GameState = {
                create: function() {
                    this.game.stage.backgroundColor = '#2d3436';
                    this.cubeGroup = this.game.add.group();
                    this.stickGraphics = this.game.add.graphics();
                    this.windsockGroup = this.game.add.group();
                    this.particleGroup = this.game.add.group();
                    this.uiGraphics = this.game.add.graphics();

                    // Criar a textura do cubo (única, sem hover)
                    this.cubeBmd = createCubeTexture(this.game);

                    gameState.cubes = {};
                    gameState.stickLeanX = 0;
                    gameState.stickLeanY = 0;
                    gameState.score = 0;
                    gameState.gameOver = false;
                    gameState.removedCubes = 0;
                    gameState.totalCubes = 0;
                    gameState.windAngle = Math.random() * Math.PI * 2;
                    gameState.windStrength = 0.6 + Math.random() * 0.4;

                    this.buildPyramid();
                    this.drawStick();
                    this.drawWindsock();
                    this.drawUI();
                    this.updateWindLabel();

                    this.windTimer = this.game.time.events.loop(7000, this.changeWind, this);
                    this.gustTimer = this.game.time.events.loop(2200, this.gustWind, this);

                    this.sandParticles = [];
                    this.spawnAmbientParticles();

                    this.scoreText = this.game.add.text(16, 14, '🏆 0', {
                        font: 'bold 16px "Segoe UI", system-ui, sans-serif',
                        fill: '#ffeaa7',
                        stroke: '#000',
                        strokeThickness: 3
                    });
                    this.scoreText.fixedToCamera = true;

                    this.gameOverText = this.game.add.text(this.game.width/2, this.game.height/2 - 30, '', {
                        font: 'bold 28px "Segoe UI", system-ui, sans-serif',
                        fill: '#ff6b6b',
                        stroke: '#000',
                        strokeThickness: 4,
                        align: 'center'
                    });
                    this.gameOverText.anchor.setTo(0.5);
                    this.gameOverText.fixedToCamera = true;
                    this.gameOverText.visible = false;

                    this.restartText = this.game.add.text(this.game.width/2, this.game.height/2 + 30, '', {
                        font: 'bold 18px "Segoe UI", system-ui, sans-serif',
                        fill: '#ffffff',
                        stroke: '#000',
                        strokeThickness: 3,
                        align: 'center'
                    });
                    this.restartText.anchor.setTo(0.5);
                    this.restartText.fixedToCamera = true;
                    this.restartText.visible = false;
                    this.restartText.inputEnabled = true;
                    this.restartText.events.onInputDown.add(this.restartGame, this);
                },

                buildPyramid: function() {
                    this.cubeGroup.removeAll(true);
                    for (let gz = 0; gz < NUM_LAYERS; gz++) {
                        const minCoord = gz;
                        const maxCoord = GRID_SIZE - 1 - gz;
                        for (let gx = minCoord; gx <= maxCoord; gx++) {
                            for (let gy = minCoord; gy <= maxCoord; gy++) {
                                const pos = this.gridToScreen(gx, gy, gz);
                                const sprite = this.game.add.sprite(pos.x, pos.y, this.cubeBmd);
                                sprite.anchor.setTo(0.5);
                                sprite.scale.setTo(0.95);
                                sprite.data = { gx, gy, gz };
                                sprite.inputEnabled = true;
                                sprite.events.onInputDown.add(this.onCubeTap, this);
                                sprite.events.onInputOver.add(this.onCubeHover, this);
                                sprite.events.onInputOut.add(this.onCubeOut, this);
                                this.cubeGroup.add(sprite);
                                gameState.cubes[`${gx},${gy},${gz}`] = { sprite, exists: true, gx, gy, gz };
                                gameState.totalCubes++;
                            }
                        }
                    }
                    this.sortCubeGroup();
                },

                sortCubeGroup: function() {
                    const children = this.cubeGroup.children.slice();
                    children.sort((a, b) => {
                        const da = a.data, db = b.data;
                        return (da.gz * 1000 + (da.gx + da.gy)) - (db.gz * 1000 + (db.gx + db.gy));
                    });
                    for (let i = 0; i < children.length; i++) {
                        this.cubeGroup.setChildIndex(children[i], i);
                    }
                },

                gridToScreen: function(gx, gy, gz) {
                    const hw = TILE_W / 2, hh = TILE_H / 2;
                    const cx = this.game.width / 2;
                    const cy = this.game.height / 2 - 10;
                    return {
                        x: cx + (gx - gy) * hw,
                        y: cy + (gx + gy) * hh - gz * LAYER_H
                    };
                },

                onCubeHover: function(sprite) {
                    if (gameState.gameOver || !sprite.data) return;
                    const key = `${sprite.data.gx},${sprite.data.gy},${sprite.data.gz}`;
                    if (!gameState.cubes[key]?.exists) return;
                    sprite.tint = 0xffffcc;
                    sprite.scale.setTo(1.02);
                },

                onCubeOut: function(sprite) {
                    if (!sprite.data) return;
                    sprite.tint = 0xffffff;
                    sprite.scale.setTo(0.95);
                },

                onCubeTap: function(sprite) {
                    if (gameState.gameOver || !sprite.data) return;
                    const { gx, gy, gz } = sprite.data;
                    const key = `${gx},${gy},${gz}`;
                    if (!gameState.cubes[key]?.exists) return;

                    this.removeCube(gx, gy, gz, true);
                    this.checkCascade(gx, gy, gz);
                    this.applyWindEffect(gx, gy, gz);
                    this.updateStickLean(gx, gy, gz);
                    this.checkGameOver();
                    this.updateUI();
                    this.drawStick();
                    this.drawWindsock();

                    const pos = this.gridToScreen(gx, gy, gz);
                    this.spawnParticles(pos.x, pos.y, 8);
                    if (gameState.removedCubes % 5 === 0) {
                        this.game.camera.shake(0.003, 80);
                    }
                },

                removeCube: function(gx, gy, gz, animate = true) {
                    const key = `${gx},${gy},${gz}`;
                    const cubeData = gameState.cubes[key];
                    if (!cubeData?.exists) return;
                    cubeData.exists = false;
                    gameState.removedCubes++;
                    gameState.score += Math.floor(10 + gz * 5);
                    const sprite = cubeData.sprite;
                    if (sprite?.alive) {
                        if (animate) {
                            const pos = this.gridToScreen(gx, gy, gz);
                            const tween = this.game.add.tween(sprite).to({
                                alpha: 0,
                                x: pos.x + (Math.random() - 0.5) * 30,
                                y: pos.y + 25 + Math.random() * 20,
                                angle: (Math.random() - 0.5) * 180
                            }, 350, Phaser.Easing.Quadratic.In, true);
                            tween.onComplete.add(() => { if (sprite.alive) sprite.destroy(); });
                        } else {
                            sprite.destroy();
                        }
                    }
                },

                checkCascade: function(fromGx, fromGy, fromGz) {
                    const aboveGz = fromGz + 1;
                    if (aboveGz >= NUM_LAYERS) return;
                    const affected = [
                        { gx: fromGx, gy: fromGy },
                        { gx: fromGx - 1, gy: fromGy },
                        { gx: fromGx, gy: fromGy - 1 },
                        { gx: fromGx - 1, gy: fromGy - 1 }
                    ];
                    const toRemove = [];
                    for (const pos of affected) {
                        const key = `${pos.gx},${pos.gy},${aboveGz}`;
                        if (!gameState.cubes[key]?.exists) continue;
                        const supports = [
                            `${pos.gx},${pos.gy},${fromGz}`,
                            `${pos.gx + 1},${pos.gy},${fromGz}`,
                            `${pos.gx},${pos.gy + 1},${fromGz}`,
                            `${pos.gx + 1},${pos.gy + 1},${fromGz}`
                        ];
                        if (!supports.some(sk => gameState.cubes[sk]?.exists)) {
                            toRemove.push({ gx: pos.gx, gy: pos.gy, gz: aboveGz });
                        }
                    }
                    for (const r of toRemove) {
                        const rKey = `${r.gx},${r.gy},${r.gz}`;
                        if (gameState.cubes[rKey]?.exists) {
                            this.removeCube(r.gx, r.gy, r.gz, true);
                            this.checkCascade(r.gx, r.gy, r.gz);
                        }
                    }
                },

                applyWindEffect: function(fromGx, fromGy, fromGz) {
                    const windDx = Math.cos(gameState.windAngle);
                    const windDy = Math.sin(gameState.windAngle);
                    let gridDx = 0, gridDy = 0;
                    if (Math.abs(windDx) > Math.abs(windDy)) {
                        gridDx = windDx > 0 ? 1 : -1;
                        gridDy = (windDy > 0.3) ? 1 : (windDy < -0.3) ? -1 : 0;
                    } else {
                        gridDy = windDy > 0 ? 1 : -1;
                        gridDx = (windDx > 0.3) ? 1 : (windDx < -0.3) ? -1 : 0;
                    }
                    const baseChance = gameState.windStrength * 0.45;
                    const targets = [
                        { gx: fromGx + gridDx, gy: fromGy + gridDy, gz: fromGz },
                        { gx: fromGx + gridDx * 2, gy: fromGy + gridDy * 2, gz: fromGz },
                        { gx: fromGx + gridDx, gy: fromGy + gridDy, gz: fromGz + 1 },
                        { gx: fromGx, gy: fromGy, gz: fromGz + 1 }
                    ];
                    for (const t of targets) {
                        const key = `${t.gx},${t.gy},${t.gz}`;
                        if (!gameState.cubes[key]?.exists || t.gz >= NUM_LAYERS) continue;
                        if (Math.random() < baseChance * (1 + (t.gz - fromGz) * 0.5)) {
                            this.removeCube(t.gx, t.gy, t.gz, true);
                            this.checkCascade(t.gx, t.gy, t.gz);
                            this.updateStickLean(t.gx, t.gy, t.gz);
                        }
                    }
                },

                updateStickLean: function(gx, gy, gz) {
                    const relX = gx - gameState.centerGx;
                    const relY = gy - gameState.centerGy;
                    const screenDx = (relX - relY) * (TILE_W / 2);
                    const screenDy = (relX + relY) * (TILE_H / 2);
                    const weight = 0.6 + gz * 0.2;
                    gameState.stickLeanX -= screenDx * weight * 0.04;
                    gameState.stickLeanY -= screenDy * weight * 0.03;
                    gameState.stickLeanX *= 0.97;
                    gameState.stickLeanY *= 0.97;
                    const mag = Math.sqrt(gameState.stickLeanX**2 + gameState.stickLeanY**2);
                    if (mag > STICK_MAX_LEAN) {
                        gameState.stickLeanX *= STICK_MAX_LEAN / mag;
                        gameState.stickLeanY *= STICK_MAX_LEAN / mag;
                    }
                },

                checkGameOver: function() {
                    const mag = Math.sqrt(gameState.stickLeanX**2 + gameState.stickLeanY**2);
                    if (mag >= STICK_MAX_LEAN * 0.95) {
                        this.triggerGameOver();
                        return;
                    }
                    let centralSupport = 0;
                    for (let gz = 0; gz < NUM_LAYERS; gz++) {
                        if (gameState.cubes[`${gameState.centerGx},${gameState.centerGy},${gz}`]?.exists) centralSupport++;
                    }
                    if (centralSupport === 0 && gameState.removedCubes > 5) this.triggerGameOver();
                },

                triggerGameOver: function() {
                    if (gameState.gameOver) return;
                    gameState.gameOver = true;
                    gameState.stickLeanX *= 1.6;
                    gameState.stickLeanY *= 1.6;
                    this.drawStick();
                    this.gameOverText.text = '💥 O palito caiu!';
                    this.gameOverText.visible = true;
                    this.restartText.text = '🔄 Tocar para jogar novamente';
                    this.restartText.visible = true;
                    this.restartText.inputEnabled = true;
                    this.game.camera.shake(0.015, 500);
                    const apex = this.gridToScreen(gameState.centerGx, gameState.centerGy, NUM_LAYERS - 1);
                    this.spawnParticles(apex.x, apex.y, 30);
                    const best = localStorage.getItem('pyramidSandBest') || 0;
                    if (gameState.score > best) localStorage.setItem('pyramidSandBest', gameState.score);
                },

                restartGame: function() {
                    gameState.cubes = {};
                    gameState.stickLeanX = 0;
                    gameState.stickLeanY = 0;
                    gameState.score = 0;
                    gameState.gameOver = false;
                    gameState.removedCubes = 0;
                    gameState.totalCubes = 0;
                    this.gameOverText.visible = false;
                    this.restartText.visible = false;
                    this.restartText.inputEnabled = false;
                    this.cubeGroup.removeAll(true);
                    this.stickGraphics.clear();
                    this.windsockGroup.removeAll(true);
                    this.particleGroup.removeAll(true);
                    this.fallingCubes = [];
                    this.sandParticles = [];
                    this.buildPyramid();
                    this.drawStick();
                    this.drawWindsock();
                    this.drawUI();
                    this.updateWindLabel();
                    this.updateUI();
                    this.spawnAmbientParticles();
                },

                changeWind: function() {
                    if (gameState.gameOver) return;
                    const newAngle = Math.random() * Math.PI * 2;
                    const startAngle = gameState.windAngle;
                    const startTime = this.game.time.now;
                    const that = this;
                    const update = () => {
                        const progress = Math.min(1, (this.game.time.now - startTime) / 2000);
                        gameState.windAngle = startAngle + (newAngle - startAngle) * Phaser.Easing.Sinusoidal.InOut(progress);
                        gameState.windStrength = 0.5 + Math.random() * 0.5;
                        that.updateWindLabel();
                        that.drawWindsock();
                        if (progress < 1 && !gameState.gameOver) this.game.time.events.add(30, update, this);
                    };
                    update();
                },

                gustWind: function() {
                    if (gameState.gameOver) return;
                    gameState.windStrength = Math.max(0.3, Math.min(1.0, gameState.windStrength + (Math.random() - 0.5) * 0.35));
                    this.updateWindLabel();
                },

                updateWindLabel: function() {
                    const deg = Math.round(gameState.windAngle * 180 / Math.PI);
                    const cardinals = ['N','NE','L','SE','S','SO','O','NO'];
                    const idx = Math.round(((deg+360)%360)/45)%8;
                    document.getElementById('wind-label').textContent = `🌬️ Vento: ${cardinals[idx]} (${Math.round(gameState.windStrength*100)}%)`;
                },

                drawStick: function() {
                    this.stickGraphics.clear();
                    const basePos = this.gridToScreen(gameState.centerGx, gameState.centerGy, 0);
                    const apexPos = this.gridToScreen(gameState.centerGx, gameState.centerGy, NUM_LAYERS - 1);
                    const topY = apexPos.y - STICK_HEIGHT_ABOVE;
                    const lean = { x: gameState.stickLeanX, y: gameState.stickLeanY };
                    const bx = basePos.x + lean.x * 0.1, by = basePos.y + lean.y * 0.1;
                    const tx = apexPos.x + lean.x * 0.5, ty = topY + lean.y * 0.5;

                    this.stickGraphics.lineStyle(2.5, 0xd4a574, 1);
                    this.stickGraphics.moveTo(bx, by);
                    this.stickGraphics.lineTo(tx, ty);
                    this.stickGraphics.beginFill(0xff6b6b, 1);
                    this.stickGraphics.drawCircle(tx, ty, 5);
                    this.stickGraphics.endFill();
                },

                drawWindsock: function() {
                    this.windsockGroup.removeAll(true);
                    const apexPos = this.gridToScreen(gameState.centerGx, gameState.centerGy, NUM_LAYERS - 1);
                    const topY = apexPos.y - STICK_HEIGHT_ABOVE;
                    const lean = { x: gameState.stickLeanX, y: gameState.stickLeanY };
                    const tx = apexPos.x + lean.x * 0.5, ty = topY + lean.y * 0.5;
                    const sockAngle = gameState.windAngle + Math.PI;
                    const length = 28, wBase = 10, wTip = 3;
                    const endX = tx + Math.cos(sockAngle) * length;
                    const endY = ty + Math.sin(sockAngle) * length;
                    const perpX = Math.cos(sockAngle + Math.PI/2), perpY = Math.sin(sockAngle + Math.PI/2);

                    const gfx = this.game.add.graphics();
                    gfx.lineStyle(1.8, 0xcccccc, 0.9);
                    gfx.moveTo(tx, ty);
                    gfx.lineTo(tx, ty - 8);
                    this.windsockGroup.add(gfx);

                    const sockGfx = this.game.add.graphics();
                    for (let i = 0; i < 5; i++) {
                        const t0 = i/5, t1 = (i+1)/5;
                        const w0 = wBase + (wTip - wBase) * t0;
                        const w1 = wBase + (wTip - wBase) * t1;
                        const x0 = tx + Math.cos(sockAngle) * length * t0;
                        const y0 = ty + Math.sin(sockAngle) * length * t0;
                        const x1 = tx + Math.cos(sockAngle) * length * t1;
                        const y1 = ty + Math.sin(sockAngle) * length * t1;
                        sockGfx.beginFill(i%2===0 ? 0xff6b35 : 0xffffff, 0.9);
                        sockGfx.moveTo(x0 + perpX*w0, y0 + perpY*w0);
                        sockGfx.lineTo(x0 - perpX*w0, y0 - perpY*w0);
                        sockGfx.lineTo(x1 - perpX*w1, y1 - perpY*w1);
                        sockGfx.lineTo(x1 + perpX*w1, y1 + perpY*w1);
                        sockGfx.closePath();
                        sockGfx.endFill();
                    }
                    this.windsockGroup.add(sockGfx);
                },

                drawUI: function() {
                    this.uiGraphics.clear();
                    const best = localStorage.getItem('pyramidSandBest') || 0;
                    if (best > 0) {
                        if (this.prevBestText) this.prevBestText.destroy();
                        this.prevBestText = this.game.add.text(this.game.width - 130, 14, `⭐ Melhor: ${best}`, {
                            font: 'bold 13px "Segoe UI"',
                            fill: '#ffeaa7',
                            stroke: '#000',
                            strokeThickness: 2
                        });
                        this.prevBestText.fixedToCamera = true;
                    }
                },

                updateUI: function() {
                    this.scoreText.text = `🏆 ${gameState.score}`;
                    this.drawUI();
                },

                spawnParticles: function(x, y, count) {
                    const windDx = Math.cos(gameState.windAngle) * 1.5;
                    const windDy = Math.sin(gameState.windAngle) * 1.5;
                    for (let i = 0; i < count; i++) {
                        const p = this.game.add.graphics();
                        p.beginFill(Phaser.Color.getColor(200+Math.random()*55, 160+Math.random()*50, 100+Math.random()*40), 0.9);
                        p.drawCircle(0, 0, 1 + Math.random()*2.5);
                        p.endFill();
                        p.x = x + (Math.random()-0.5)*20;
                        p.y = y + (Math.random()-0.5)*10;
                        this.particleGroup.add(p);
                        const tween = this.game.add.tween(p).to({
                            x: p.x + windDx*30 + (Math.random()-0.5)*50,
                            y: p.y + 30 + Math.random()*40 + windDy*30,
                            alpha: 0
                        }, 500+Math.random()*600, Phaser.Easing.Quadratic.In, true);
                        tween.onComplete.add(() => { if (p.alive) p.destroy(); });
                    }
                },

                spawnAmbientParticles: function() {
                    if (gameState.gameOver) return;
                    const windDx = Math.cos(gameState.windAngle)*0.6;
                    const windDy = Math.sin(gameState.windAngle)*0.6;
                    const p = this.game.add.graphics();
                    p.beginFill(0xe8d5a3, 0.5);
                    p.drawCircle(0,0, 0.6+Math.random()*1.2);
                    p.endFill();
                    p.x = this.game.width/2 + (Math.random()-0.5)*160;
                    p.y = this.game.height/2 + (Math.random()-0.5)*120;
                    p.alpha = 0;
                    this.sandParticles.push(p);
                    const tween = this.game.add.tween(p).to({
                        x: p.x + windDx*60,
                        y: p.y + windDy*60 + 10,
                        alpha: 0.6
                    }, 2000+Math.random()*2000, Phaser.Easing.Quadratic.InOut, true);
                    tween.onComplete.add(() => {
                        const idx = this.sandParticles.indexOf(p);
                        if (idx > -1) this.sandParticles.splice(idx,1);
                        if (p.alive) p.destroy();
                    });
                    if (this.sandParticles.length > 20) {
                        const old = this.sandParticles.shift();
                        if (old?.alive) old.destroy();
                    }
                    this.game.time.events.add(400+Math.random()*800, this.spawnAmbientParticles, this);
                },

                update: function() {
                    if (gameState.gameOver) return;
                    this.drawWindsock();
                    this.drawStick();
                    if (Math.abs(gameState.stickLeanX) < STICK_MAX_LEAN*0.8) {
                        gameState.stickLeanX += (Math.random()-0.5)*0.08;
                        gameState.stickLeanY += (Math.random()-0.5)*0.08;
                    }
                }
            };

            game.state.add('Boot', BootState);
            game.state.add('Game', GameState);
            game.state.start('Boot');
        })();
    </script>
</body>
