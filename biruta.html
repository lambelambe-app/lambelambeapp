<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>Pirâmide de Areia</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-wrapper {
            width: 100vw;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2d3436;
            position: relative;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ad-placeholder {
            width: 100vw;
            height: 60px;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 14px;
            letter-spacing: 1px;
            border-top: 1px solid #333;
            flex-shrink: 0;
        }
        #loading-msg {
            position: absolute;
            color: white;
            font-size: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 20;
        }
        #info-overlay, #wind-label {
            position: fixed;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            color: #fff;
        }
        #info-overlay {
            bottom: 70px; left: 50%; transform: translateX(-50%);
            font-size: 14px; background: rgba(0,0,0,0.4);
            padding: 6px 16px; border-radius: 20px; opacity:0.9;
        }
        #wind-label {
            top: 15px; right: 20px; font-size: 14px; font-weight: 600;
            color: #ffeaa7; background: rgba(0,0,0,0.5);
            padding: 6px 14px; border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container"></div>
        <div id="loading-msg">⏳ Carregando jogo...</div>
    </div>
    <div id="ad-placeholder">📢 Espaço para anúncios</div>
    <div id="wind-label">🌬️ Vento: --</div>
    <div id="info-overlay">Toque nos cubos • Não derrube o palito!</div>

    <script src="https://cdn.jsdelivr.net/npm/phaser-ce@2.15.1/build/phaser.min.js"></script>
    <script>
        // Aguarda o carregamento do Phaser e inicia
        window.onload = function() {
            // Remove mensagem de carregamento
            var loadingEl = document.getElementById('loading-msg');
            if (loadingEl) loadingEl.style.display = 'none';

            // Configurações do jogo
            var GRID_SIZE = 7;
            var NUM_LAYERS = 4;
            var TILE_W = 34;
            var TILE_H = 17;
            var SIDE_H = 15;
            var LAYER_H = 22;
            var STICK_HEIGHT_ABOVE = 70;
            var STICK_MAX_LEAN = 28;

            var gameState = {
                cubes: {},
                windAngle: Math.random() * Math.PI * 2,
                windStrength: 0.6 + Math.random() * 0.4,
                stickLeanX: 0,
                stickLeanY: 0,
                score: 0,
                gameOver: false,
                totalCubes: 0,
                removedCubes: 0,
                centerGx: Math.floor(GRID_SIZE / 2),
                centerGy: Math.floor(GRID_SIZE / 2)
            };

            // Inicializa o jogo em modo Canvas (mais compatível)
            var game = new Phaser.Game({
                width: 600,
                height: 400,
                renderer: Phaser.CANVAS,
                parent: 'game-container',
                backgroundColor: '#2d3436',
                antialias: false,
                scaleMode: Phaser.ScaleManager.SHOW_ALL,
                pageAlignHorizontally: true,
                pageAlignVertically: true
            });

            // Cria textura do cubo usando BitmapData (método padrão e funcional)
            function createCubeTexture() {
                var bmd = game.make.bitmapData(TILE_W + SIDE_H + 4, TILE_H + SIDE_H + 8);
                var ctx = bmd.ctx;
                var hw = TILE_W / 2, hh = TILE_H / 2, sh = SIDE_H;
                var cx = hw, cy = hh;

                // Face superior
                ctx.fillStyle = '#f0dca8';
                ctx.strokeStyle = '#c4a96a';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(cx, 0);
                ctx.lineTo(TILE_W, hh);
                ctx.lineTo(cx, TILE_H);
                ctx.lineTo(0, hh);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Face esquerda
                ctx.fillStyle = '#c9a96e';
                ctx.strokeStyle = '#a0844c';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, hh);
                ctx.lineTo(cx, TILE_H);
                ctx.lineTo(cx, TILE_H + sh);
                ctx.lineTo(0, hh + sh);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Face direita
                ctx.fillStyle = '#a6844a';
                ctx.strokeStyle = '#7d6338';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cx, TILE_H);
                ctx.lineTo(TILE_W, hh);
                ctx.lineTo(TILE_W, hh + sh);
                ctx.lineTo(cx, TILE_H + sh);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                bmd.dirty = true;
                return bmd;
            }

            // Estado de inicialização
            var BootState = {
                create: function() {
                    // Pequeno atraso para garantir que tudo esteja pronto
                    game.time.events.add(100, function() {
                        game.state.start('Game');
                    }, this);
                }
            };

            // Estado principal do jogo
            var GameState = {
                create: function() {
                    console.log('GameState iniciado');
                    this.cubeGroup = game.add.group();
                    this.stickGraphics = game.add.graphics();
                    this.windsockGroup = game.add.group();
                    this.particleGroup = game.add.group();

                    // Gera a textura do cubo
                    this.cubeTexture = createCubeTexture();

                    // Reinicia o estado do jogo
                    gameState.cubes = {};
                    gameState.stickLeanX = 0;
                    gameState.stickLeanY = 0;
                    gameState.score = 0;
                    gameState.gameOver = false;
                    gameState.removedCubes = 0;
                    gameState.totalCubes = 0;
                    gameState.windAngle = Math.random() * Math.PI * 2;
                    gameState.windStrength = 0.6 + Math.random() * 0.4;
                    gameState.centerGx = Math.floor(GRID_SIZE / 2);
                    gameState.centerGy = Math.floor(GRID_SIZE / 2);

                    this.buildPyramid();
                    this.drawStick();
                    this.drawWindsock();
                    this.updateWindLabel();

                    this.windTimer = game.time.events.loop(7000, this.changeWind, this);
                    this.gustTimer = game.time.events.loop(2200, this.gustWind, this);

                    this.sandParticles = [];
                    this.spawnAmbientParticles();

                    this.scoreText = game.add.text(16, 14, '🏆 0', {
                        font: 'bold 16px Arial',
                        fill: '#ffeaa7',
                        stroke: '#000',
                        strokeThickness: 3
                    });
                    this.scoreText.fixedToCamera = true;

                    this.gameOverText = game.add.text(game.width/2, game.height/2 - 30, '', {
                        font: 'bold 28px Arial',
                        fill: '#ff6b6b',
                        stroke: '#000',
                        strokeThickness: 4,
                        align: 'center'
                    });
                    this.gameOverText.anchor.setTo(0.5);
                    this.gameOverText.fixedToCamera = true;
                    this.gameOverText.visible = false;

                    this.restartText = game.add.text(game.width/2, game.height/2 + 30, '', {
                        font: 'bold 18px Arial',
                        fill: '#ffffff',
                        stroke: '#000',
                        strokeThickness: 3,
                        align: 'center'
                    });
                    this.restartText.anchor.setTo(0.5);
                    this.restartText.fixedToCamera = true;
                    this.restartText.visible = false;
                    this.restartText.inputEnabled = true;
                    this.restartText.events.onInputDown.add(this.restartGame, this);
                },

                buildPyramid: function() {
                    this.cubeGroup.removeAll(true);
                    for (var gz = 0; gz < NUM_LAYERS; gz++) {
                        var minCoord = gz;
                        var maxCoord = GRID_SIZE - 1 - gz;
                        for (var gx = minCoord; gx <= maxCoord; gx++) {
                            for (var gy = minCoord; gy <= maxCoord; gy++) {
                                var pos = this.gridToScreen(gx, gy, gz);
                                var sprite = game.add.sprite(pos.x, pos.y, this.cubeTexture);
                                sprite.anchor.setTo(0.5, 0.5);
                                sprite.data = { gx: gx, gy: gy, gz: gz };
                                sprite.inputEnabled = true;
                                sprite.events.onInputDown.add(this.onCubeTap, this);
                                sprite.events.onInputOver.add(this.onCubeHover, this);
                                sprite.events.onInputOut.add(this.onCubeOut, this);
                                this.cubeGroup.add(sprite);
                                gameState.cubes[gx + ',' + gy + ',' + gz] = {
                                    sprite: sprite,
                                    exists: true,
                                    gx: gx,
                                    gy: gy,
                                    gz: gz
                                };
                                gameState.totalCubes++;
                            }
                        }
                    }
                    this.sortCubeGroup();
                },

                sortCubeGroup: function() {
                    var children = this.cubeGroup.children.slice();
                    children.sort(function(a, b) {
                        var da = a.data;
                        var db = b.data;
                        return (da.gz * 1000 + (da.gx + da.gy)) - (db.gz * 1000 + (db.gx + db.gy));
                    });
                    for (var i = 0; i < children.length; i++) {
                        this.cubeGroup.setChildIndex(children[i], i);
                    }
                },

                gridToScreen: function(gx, gy, gz) {
                    var hw = TILE_W / 2;
                    var hh = TILE_H / 2;
                    var cx = game.width / 2;
                    var cy = game.height / 2 - 10;
                    return {
                        x: cx + (gx - gy) * hw,
                        y: cy + (gx + gy) * hh - gz * LAYER_H
                    };
                },

                onCubeHover: function(sprite) {
                    if (gameState.gameOver || !sprite.data) return;
                    var key = sprite.data.gx + ',' + sprite.data.gy + ',' + sprite.data.gz;
                    if (!gameState.cubes[key] || !gameState.cubes[key].exists) return;
                    sprite.tint = 0xffffaa;
                },

                onCubeOut: function(sprite) {
                    if (!sprite.data) return;
                    sprite.tint = 0xffffff;
                },

                onCubeTap: function(sprite) {
                    if (gameState.gameOver || !sprite.data) return;
                    var gx = sprite.data.gx;
                    var gy = sprite.data.gy;
                    var gz = sprite.data.gz;
                    var key = gx + ',' + gy + ',' + gz;
                    if (!gameState.cubes[key] || !gameState.cubes[key].exists) return;

                    this.removeCube(gx, gy, gz, true);
                    this.checkCascade(gx, gy, gz);
                    this.applyWindEffect(gx, gy, gz);
                    this.updateStickLean(gx, gy, gz);
                    this.checkGameOver();
                    this.updateUI();
                    this.drawStick();
                    this.drawWindsock();

                    var pos = this.gridToScreen(gx, gy, gz);
                    this.spawnParticles(pos.x, pos.y, 8);
                    if (gameState.removedCubes % 5 === 0) {
                        game.camera.shake(0.003, 80);
                    }
                },

                removeCube: function(gx, gy, gz, animate) {
                    var key = gx + ',' + gy + ',' + gz;
                    var cubeData = gameState.cubes[key];
                    if (!cubeData || !cubeData.exists) return;
                    cubeData.exists = false;
                    gameState.removedCubes++;
                    gameState.score += Math.floor(10 + gz * 5);
                    var sprite = cubeData.sprite;
                    if (sprite && sprite.alive) {
                        if (animate) {
                            var pos = this.gridToScreen(gx, gy, gz);
                            var tween = game.add.tween(sprite).to({
                                alpha: 0,
                                x: pos.x + (Math.random() - 0.5) * 30,
                                y: pos.y + 25 + Math.random() * 20,
                                angle: (Math.random() - 0.5) * 180
                            }, 350, Phaser.Easing.Quadratic.In, true);
                            tween.onComplete.add(function() {
                                if (sprite && sprite.alive) sprite.destroy();
                            });
                        } else {
                            sprite.destroy();
                        }
                    }
                },

                checkCascade: function(fromGx, fromGy, fromGz) {
                    var aboveGz = fromGz + 1;
                    if (aboveGz >= NUM_LAYERS) return;
                    var affected = [
                        { gx: fromGx, gy: fromGy },
                        { gx: fromGx - 1, gy: fromGy },
                        { gx: fromGx, gy: fromGy - 1 },
                        { gx: fromGx - 1, gy: fromGy - 1 }
                    ];
                    var toRemove = [];
                    for (var i = 0; i < affected.length; i++) {
                        var pos = affected[i];
                        var key = pos.gx + ',' + pos.gy + ',' + aboveGz;
                        if (!gameState.cubes[key] || !gameState.cubes[key].exists) continue;
                        var supports = [
                            pos.gx + ',' + pos.gy + ',' + fromGz,
                            (pos.gx + 1) + ',' + pos.gy + ',' + fromGz,
                            pos.gx + ',' + (pos.gy + 1) + ',' + fromGz,
                            (pos.gx + 1) + ',' + (pos.gy + 1) + ',' + fromGz
                        ];
                        var hasSupport = false;
                        for (var s = 0; s < supports.length; s++) {
                            if (gameState.cubes[supports[s]] && gameState.cubes[supports[s]].exists) {
                                hasSupport = true;
                                break;
                            }
                        }
                        if (!hasSupport) {
                            toRemove.push({ gx: pos.gx, gy: pos.gy, gz: aboveGz });
                        }
                    }
                    for (var r = 0; r < toRemove.length; r++) {
                        var rem = toRemove[r];
                        var rKey = rem.gx + ',' + rem.gy + ',' + rem.gz;
                        if (gameState.cubes[rKey] && gameState.cubes[rKey].exists) {
                            this.removeCube(rem.gx, rem.gy, rem.gz, true);
                            this.checkCascade(rem.gx, rem.gy, rem.gz);
                        }
                    }
                },

                applyWindEffect: function(fromGx, fromGy, fromGz) {
                    var windDx = Math.cos(gameState.windAngle);
                    var windDy = Math.sin(gameState.windAngle);
                    var gridDx = 0, gridDy = 0;
                    if (Math.abs(windDx) > Math.abs(windDy)) {
                        gridDx = windDx > 0 ? 1 : -1;
                        gridDy = (windDy > 0.3) ? 1 : (windDy < -0.3) ? -1 : 0;
                    } else {
                        gridDy = windDy > 0 ? 1 : -1;
                        gridDx = (windDx > 0.3) ? 1 : (windDx < -0.3) ? -1 : 0;
                    }
                    var baseChance = gameState.windStrength * 0.45;
                    var targets = [
                        { gx: fromGx + gridDx, gy: fromGy + gridDy, gz: fromGz },
                        { gx: fromGx + gridDx * 2, gy: fromGy + gridDy * 2, gz: fromGz },
                        { gx: fromGx + gridDx, gy: fromGy + gridDy, gz: fromGz + 1 },
                        { gx: fromGx, gy: fromGy, gz: fromGz + 1 }
                    ];
                    for (var i = 0; i < targets.length; i++) {
                        var t = targets[i];
                        var key = t.gx + ',' + t.gy + ',' + t.gz;
                        if (!gameState.cubes[key] || !gameState.cubes[key].exists || t.gz >= NUM_LAYERS) continue;
                        if (Math.random() < baseChance * (1 + (t.gz - fromGz) * 0.5)) {
                            this.removeCube(t.gx, t.gy, t.gz, true);
                            this.checkCascade(t.gx, t.gy, t.gz);
                            this.updateStickLean(t.gx, t.gy, t.gz);
                        }
                    }
                },

                updateStickLean: function(gx, gy, gz) {
                    var relX = gx - gameState.centerGx;
                    var relY = gy - gameState.centerGy;
                    var screenDx = (relX - relY) * (TILE_W / 2);
                    var screenDy = (relX + relY) * (TILE_H / 2);
                    var weight = 0.6 + gz * 0.2;
                    gameState.stickLeanX -= screenDx * weight * 0.04;
                    gameState.stickLeanY -= screenDy * weight * 0.03;
                    gameState.stickLeanX *= 0.97;
                    gameState.stickLeanY *= 0.97;
                    var mag = Math.sqrt(gameState.stickLeanX * gameState.stickLeanX + gameState.stickLeanY * gameState.stickLeanY);
                    if (mag > STICK_MAX_LEAN) {
                        gameState.stickLeanX *= STICK_MAX_LEAN / mag;
                        gameState.stickLeanY *= STICK_MAX_LEAN / mag;
                    }
                },

                checkGameOver: function() {
                    var mag = Math.sqrt(gameState.stickLeanX * gameState.stickLeanX + gameState.stickLeanY * gameState.stickLeanY);
                    if (mag >= STICK_MAX_LEAN * 0.95) {
                        this.triggerGameOver();
                        return;
                    }
                    var centralSupport = 0;
                    for (var gz = 0; gz < NUM_LAYERS; gz++) {
                        var key = gameState.centerGx + ',' + gameState.centerGy + ',' + gz;
                        if (gameState.cubes[key] && gameState.cubes[key].exists) centralSupport++;
                    }
                    if (centralSupport === 0 && gameState.removedCubes > 5) this.triggerGameOver();
                },

                triggerGameOver: function() {
                    if (gameState.gameOver) return;
                    gameState.gameOver = true;
                    gameState.stickLeanX *= 1.6;
                    gameState.stickLeanY *= 1.6;
                    this.drawStick();
                    this.gameOverText.text = '💥 O palito caiu!';
                    this.gameOverText.visible = true;
                    this.restartText.text = '🔄 Toque para reiniciar';
                    this.restartText.visible = true;
                    this.restartText.inputEnabled = true;
                    game.camera.shake(0.015, 500);
                    var apex = this.gridToScreen(gameState.centerGx, gameState.centerGy, NUM_LAYERS - 1);
                    this.spawnParticles(apex.x, apex.y, 30);
                    var best = localStorage.getItem('pyramidSandBest') || 0;
                    if (gameState.score > best) localStorage.setItem('pyramidSandBest', gameState.score);
                },

                restartGame: function() {
                    gameState.cubes = {};
                    gameState.stickLeanX = 0;
                    gameState.stickLeanY = 0;
                    gameState.score = 0;
                    gameState.gameOver = false;
                    gameState.removedCubes = 0;
                    gameState.totalCubes = 0;
                    this.gameOverText.visible = false;
                    this.restartText.visible = false;
                    this.restartText.inputEnabled = false;
                    this.cubeGroup.removeAll(true);
                    this.stickGraphics.clear();
                    this.windsockGroup.removeAll(true);
                    this.particleGroup.removeAll(true);
                    this.sandParticles = [];
                    this.buildPyramid();
                    this.drawStick();
                    this.drawWindsock();
                    this.updateWindLabel();
                    this.updateUI();
                    this.spawnAmbientParticles();
                },

                changeWind: function() {
                    if (gameState.gameOver) return;
                    var newAngle = Math.random() * Math.PI * 2;
                    var startAngle = gameState.windAngle;
                    var startTime = game.time.now;
                    var that = this;
                    var update = function() {
                        var progress = Math.min(1, (game.time.now - startTime) / 2000);
                        gameState.windAngle = startAngle + (newAngle - startAngle) * Phaser.Easing.Sinusoidal.InOut(progress);
                        gameState.windStrength = 0.5 + Math.random() * 0.5;
                        that.updateWindLabel();
                        that.drawWindsock();
                        if (progress < 1 && !gameState.gameOver) {
                            game.time.events.add(30, update, that);
                        }
                    };
                    update();
                },

                gustWind: function() {
                    if (gameState.gameOver) return;
                    gameState.windStrength = Math.max(0.3, Math.min(1.0, gameState.windStrength + (Math.random() - 0.5) * 0.35));
                    this.updateWindLabel();
                },

                updateWindLabel: function() {
                    var deg = Math.round(gameState.windAngle * 180 / Math.PI);
                    var cardinals = ['N', 'NE', 'L', 'SE', 'S', 'SO', 'O', 'NO'];
                    var idx = Math.round(((deg + 360) % 360) / 45) % 8;
                    document.getElementById('wind-label').textContent =
                        '🌬️ Vento: ' + cardinals[idx] + ' (' + Math.round(gameState.windStrength * 100) + '%)';
                },

                drawStick: function() {
                    this.stickGraphics.clear();
                    var basePos = this.gridToScreen(gameState.centerGx, gameState.centerGy, 0);
                    var apexPos = this.gridToScreen(gameState.centerGx, gameState.centerGy, NUM_LAYERS - 1);
                    var topY = apexPos.y - STICK_HEIGHT_ABOVE;
                    var lean = { x: gameState.stickLeanX, y: gameState.stickLeanY };
                    var bx = basePos.x + lean.x * 0.1;
                    var by = basePos.y + lean.y * 0.1;
                    var tx = apexPos.x + lean.x * 0.5;
                    var ty = topY + lean.y * 0.5;

                    this.stickGraphics.lineStyle(2.5, 0xd4a574, 1);
                    this.stickGraphics.moveTo(bx, by);
                    this.stickGraphics.lineTo(tx, ty);
                    this.stickGraphics.beginFill(0xff6b6b, 1);
                    this.stickGraphics.drawCircle(tx, ty, 5);
                    this.stickGraphics.endFill();
                },

                drawWindsock: function() {
                    this.windsockGroup.removeAll(true);
                    var apexPos = this.gridToScreen(gameState.centerGx, gameState.centerGy, NUM_LAYERS - 1);
                    var topY = apexPos.y - STICK_HEIGHT_ABOVE;
                    var lean = { x: gameState.stickLeanX, y: gameState.stickLeanY };
                    var tx = apexPos.x + lean.x * 0.5;
                    var ty = topY + lean.y * 0.5;
                    var sockAngle = gameState.windAngle + Math.PI;
                    var length = 28, wBase = 10, wTip = 3;
                    var perpX = Math.cos(sockAngle + Math.PI / 2);
                    var perpY = Math.sin(sockAngle + Math.PI / 2);

                    var pole = game.add.graphics();
                    pole.lineStyle(1.8, 0xcccccc, 0.9);
                    pole.moveTo(tx, ty);
                    pole.lineTo(tx, ty - 8);
                    this.windsockGroup.add(pole);

                    var sock = game.add.graphics();
                    for (var i = 0; i < 5; i++) {
                        var t0 = i / 5, t1 = (i + 1) / 5;
                        var w0 = wBase + (wTip - wBase) * t0;
                        var w1 = wBase + (wTip - wBase) * t1;
                        var x0 = tx + Math.cos(sockAngle) * length * t0;
                        var y0 = ty + Math.sin(sockAngle) * length * t0;
                        var x1 = tx + Math.cos(sockAngle) * length * t1;
                        var y1 = ty + Math.sin(sockAngle) * length * t1;
                        sock.beginFill(i % 2 === 0 ? 0xff6b35 : 0xffffff, 0.9);
                        sock.moveTo(x0 + perpX * w0, y0 + perpY * w0);
                        sock.lineTo(x0 - perpX * w0, y0 - perpY * w0);
                        sock.lineTo(x1 - perpX * w1, y1 - perpY * w1);
                        sock.lineTo(x1 + perpX * w1, y1 + perpY * w1);
                        sock.closePath();
                        sock.endFill();
                    }
                    this.windsockGroup.add(sock);
                },

                updateUI: function() {
                    this.scoreText.text = '🏆 ' + gameState.score;
                    var best = localStorage.getItem('pyramidSandBest') || 0;
                    if (best > 0) {
                        if (this.prevBestText) this.prevBestText.destroy();
                        this.prevBestText = game.add.text(game.width - 130, 14, '⭐ Melhor: ' + best, {
                            font: 'bold 13px Arial',
                            fill: '#ffeaa7',
                            stroke: '#000',
                            strokeThickness: 2
                        });
                        this.prevBestText.fixedToCamera = true;
                    }
                },

                spawnParticles: function(x, y, count) {
                    for (var i = 0; i < count; i++) {
                        var p = game.add.graphics();
                        p.beginFill(
                            Phaser.Color.getColor(
                                200 + Math.floor(Math.random() * 55),
                                160 + Math.floor(Math.random() * 50),
                                100 + Math.floor(Math.random() * 40)
                            ),
                            0.9
                        );
                        p.drawCircle(0, 0, 1 + Math.random() * 2.5);
                        p.endFill();
                        p.x = x + (Math.random() - 0.5) * 20;
                        p.y = y + (Math.random() - 0.5) * 10;
                        this.particleGroup.add(p);
                        var windDx = Math.cos(gameState.windAngle) * 1.5;
                        var windDy = Math.sin(gameState.windAngle) * 1.5;
                        var tween = game.add.tween(p).to({
                            x: p.x + windDx * 30 + (Math.random() - 0.5) * 50,
                            y: p.y + 30 + Math.random() * 40 + windDy * 30,
                            alpha: 0
                        }, 500 + Math.random() * 600, Phaser.Easing.Quadratic.In, true);
                        tween.onComplete.add(function() {
                            if (p.alive) p.destroy();
                        });
                    }
                },

                spawnAmbientParticles: function() {
                    if (gameState.gameOver) return;
                    var p = game.add.graphics();
                    p.beginFill(0xe8d5a3, 0.5);
                    p.drawCircle(0, 0, 0.6 + Math.random() * 1.2);
                    p.endFill();
                    p.x = game.width / 2 + (Math.random() - 0.5) * 160;
                    p.y = game.height / 2 + (Math.random() - 0.5) * 120;
                    p.alpha = 0;
                    this.sandParticles.push(p);
                    var windDx = Math.cos(gameState.windAngle) * 0.6;
                    var windDy = Math.sin(gameState.windAngle) * 0.6;
                    var tween = game.add.tween(p).to({
                        x: p.x + windDx * 60,
                        y: p.y + windDy * 60 + 10,
                        alpha: 0.6
                    }, 2000 + Math.random() * 2000, Phaser.Easing.Quadratic.InOut, true);
                    var that = this;
                    tween.onComplete.add(function() {
                        var idx = that.sandParticles.indexOf(p);
                        if (idx > -1) that.sandParticles.splice(idx, 1);
                        if (p.alive) p.destroy();
                    });
                    if (this.sandParticles.length > 20) {
                        var old = this.sandParticles.shift();
                        if (old && old.alive) old.destroy();
                    }
                    game.time.events.add(400 + Math.random() * 800, this.spawnAmbientParticles, this);
                },

                update: function() {
                    if (gameState.gameOver) return;
                    this.drawWindsock();
                    this.drawStick();
                    if (Math.abs(gameState.stickLeanX) < STICK_MAX_LEAN * 0.8) {
                        gameState.stickLeanX += (Math.random() - 0.5) * 0.08;
                        gameState.stickLeanY += (Math.random() - 0.5) * 0.08;
                    }
                }
            };

            // Registrar estados e iniciar
            game.state.add('Boot', BootState);
            game.state.add('Game', GameState);
            game.state.start('Boot');
        };
    </script>
</body>
</html>
